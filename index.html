      font-variant-numeric:tabular-nums; box-shadow:0 0 16px -6px rgba(120,200,255,0.6), inset 0 0 16px -9px rgba(150,220,255,0.6); }
    .ss-spores .spore-ic { width:18px; height:18px; }
    .ss-sp-n { font-weight:700; font-size:16px; color:#dff2ff; }
    .ss-sp-lbl { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#8fb8cc; font-weight:600; }
    .ss-spores.inline { padding:2px 9px 2px 7px; gap:5px; border-width:1px; box-shadow:none; }
    .ss-spores.inline .spore-ic { width:14px; height:14px; }
    .ss-spores.inline .ss-sp-n { font-size:13px; }
    .ss-spores.inline .ss-sp-lbl { display:none; }
    /* Header wallet: no label, icon+number centred as a pair, WHITE glow (not blue). */
    .ss-wallet { padding:5px 13px; gap:8px;
      background:linear-gradient(150deg, rgba(20,27,24,0.92), rgba(9,13,12,0.95));
      border-color:rgba(232,244,238,0.5);
      box-shadow:0 0 16px -5px rgba(236,246,240,0.6), inset 0 0 16px -10px rgba(236,246,240,0.4); }
    .ss-wallet .spore-ic { vertical-align:0; filter:brightness(0) invert(1) drop-shadow(0 0 4px rgba(238,248,242,0.6)); }
    .ss-wallet .ss-sp-n { color:#f1f7f4; line-height:1; }
    /* Cost badge on a revealed-but-unbought species tile (blue, overrides the mint lockbadge). */
    .ss-lockbadge.ss-buybadge { color:#dff2ff; border-color:rgba(150,210,240,0.6); background:rgba(6,12,16,0.78); gap:4px; }
    .ss-buybadge .spore-ic { width:12px; height:12px; }
    .ss-buybadge .ss-sp-n { font-size:10.5px; font-weight:700; color:#dff2ff; }
    .ss-card.ss-locked .ss-choose { color:#bfe0f2; border-color:rgba(150,210,240,0.45); }
    /* Buy sheet (species detail, purchase mode). */
    .ss-buyhint { flex:0 0 100%; order:-1; font-size:12.5px; color:var(--ss-ink-dim); line-height:1.5;
      display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
    .ss-buyhint b { color:#dff2ff; font-weight:700; }
    .ss-btn.ss-buybtn { display:inline-flex; align-items:center; justify-content:center; gap:7px; }
    .ss-btn.ss-buybtn .spore-ic { width:17px; height:17px; filter:brightness(0) invert(1) drop-shadow(0 0 4px rgba(120,170,210,0.5)); }
    .ss-buyn { font-weight:700; }
    /* Spores line on the win / run-complete banners. */
    .ss-win-spores { display:inline-flex; align-items:center; gap:8px; font-family:var(--ss-serif);
      font-size:clamp(15px,2.2vw,20px); color:#dff2ff; text-shadow:0 1px 4px rgba(0,0,0,0.85), 0 0 18px rgba(130,200,255,0.35); }
    .ss-win-spores .spore-ic { width:1.15em; height:1.15em; }
    .ss-win-spores b { color:#eaf7ff; font-weight:700; }
    .ss-win-bal { font-family:var(--ss-sans); font-size:0.66em; color:#9fc4d8; font-weight:600; }
    .ss-lc-spores { justify-content:center; margin:4px auto 0; }

    /* no display:flex on the box — Safari lets a flex child's min-height override
       aspect-ratio (→ "?" cards taller than the available cards). Match .ss-card's
       box model: aspect-ratio only, with the ? absolutely centred. */
    .ss-lock-card { position:relative; aspect-ratio:16/10; border-radius:13px; overflow:hidden;
      background:radial-gradient(90% 120% at 50% 40%, rgba(24,34,30,0.5), rgba(6,9,14,0.85)); border:1px solid rgba(120,160,140,0.16); }
    .ss-q { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-family:var(--ss-serif); font-size:clamp(30px,6vw,44px); font-weight:700; color:rgba(236,246,240,0.6);
      text-shadow:0 0 14px rgba(236,246,240,0.45), 0 0 30px rgba(236,246,240,0.22); animation:ssQ 4.2s ease-in-out infinite; }
    .ss-lock-card:nth-child(3n) .ss-q { animation-delay:-1.4s; } .ss-lock-card:nth-child(3n+1) .ss-q { animation-delay:-2.6s; }
    @keyframes ssQ { 0%,100% { opacity:0.5; } 50% { opacity:0.95; } }

    .ss-detailwrap { position:fixed; inset:0; z-index:1002; display:flex; align-items:center; justify-content:center;
      padding:clamp(12px,3vw,36px); background:rgba(3,5,9,0.72); backdrop-filter:blur(7px);
      opacity:0; visibility:hidden; transition:opacity .28s, visibility .28s; }
    .ss-detailwrap.open { opacity:1; visibility:visible; }
    .ss-detail { position:relative; width:min(880px,100%); max-height:calc(100vh - clamp(24px,6vw,72px)); display:grid; grid-template-columns:42% 1fr; grid-template-rows:minmax(0,1fr);
      background:linear-gradient(160deg, rgba(15,22,20,0.96), rgba(7,11,10,0.98)); border:1.5px solid var(--ss-white-rim); border-radius:18px; overflow:hidden;
      box-shadow:0 0 26px -2px rgba(230,244,238,0.4), 0 0 80px -16px rgba(200,255,240,0.35), 0 40px 90px -30px rgba(0,0,0,0.95);
      transform:translateY(14px) scale(.97); opacity:0; transition:transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s; }
    .ss-detailwrap.open .ss-detail { transform:none; opacity:1; }
    .ss-detail.warm { border-color:rgba(240,210,150,0.75); box-shadow:0 0 26px -2px rgba(240,200,130,0.4), 0 0 80px -16px rgba(224,162,74,0.3), 0 40px 90px -30px rgba(0,0,0,0.95); }
    .ss-detail.aqua { border-color:rgba(150,215,230,0.7); box-shadow:0 0 26px -2px rgba(150,215,230,0.4), 0 0 80px -16px rgba(127,208,224,0.3), 0 40px 90px -30px rgba(0,0,0,0.95); }
    .ss-detail.spore { border-color:rgba(205,175,235,0.7); box-shadow:0 0 26px -2px rgba(205,175,235,0.4), 0 0 80px -16px rgba(199,155,230,0.3), 0 40px 90px -30px rgba(0,0,0,0.95); }

    .ss-d-art { position:relative; background:#04060a; min-height:220px; }
    .ss-d-art img { width:100%; height:100%; object-fit:cover; display:block; }
    .ss-d-art::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 60%, rgba(7,11,10,0.7)), linear-gradient(90deg, transparent 72%, rgba(7,11,10,0.9)); }
    .ss-d-body { padding:clamp(18px,2.6vw,28px); overflow-y:auto; min-height:0; display:flex; flex-direction:column; gap:14px;
      scrollbar-width:thin; scrollbar-color:rgba(150,185,168,0.5) transparent; }
    /* Thin, rounded scrollbar whose THUMB is inset from the panel's rounded corners
       (transparent border) and kept clear of the top-right ✕ (track top margin), so it
       no longer clips at the corners or collides with the close button. */
    .ss-d-body::-webkit-scrollbar { width:10px; }
    .ss-d-body::-webkit-scrollbar-track { background:transparent; margin:54px 0 18px 0; }
    .ss-d-body::-webkit-scrollbar-thumb { background:rgba(150,185,168,0.5); border-radius:999px;
      border:3px solid transparent; background-clip:padding-box; }
    .ss-d-body::-webkit-scrollbar-thumb:hover { background:rgba(185,215,200,0.7); background-clip:padding-box; }
    .ss-d-name { font-family:var(--ss-serif); font-size:clamp(24px,3.4vw,32px); font-weight:600; line-height:1.04; color:#eef7f1; }
    .ss-d-latin { font-family:var(--ss-serif); font-style:italic; font-size:13.5px; color:var(--ss-mint); margin-top:2px; }
    .ss-detail.warm .ss-d-latin { color:var(--ss-gold); }
    .ss-detail.aqua .ss-d-latin { color:#9fdcea; }
    .ss-detail.spore .ss-d-latin { color:#d6bff0; }
    .ss-d-blurb { font-size:14px; line-height:1.62; color:var(--ss-ink-dim); margin:0; }
    .ss-d-blurb b { color:var(--ss-ink); font-weight:600; }

    .ss-hand { border-top:1px solid rgba(120,160,140,0.16); padding-top:14px; }
    .ss-hand h3 { font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--ss-mint); margin:0 0 4px; font-weight:700; }
    .ss-sub { font-size:12px; color:var(--ss-ink-faint); margin:0 0 12px; }
    .ss-resprow { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .ss-respill { display:inline-flex; align-items:center; gap:6px; padding:5px 12px 5px 9px; border-radius:999px;
      background:linear-gradient(150deg, rgba(18,28,22,0.9), rgba(8,14,11,0.9)); border:1.5px solid rgba(130,230,166,0.4); font-variant-numeric:tabular-nums; }
    .ss-respill .ss-ri { width:16px; height:16px; flex:0 0 auto; }
    .ss-rv { font-weight:700; font-size:15px; }
    .ss-rk { font-size:11px; color:var(--ss-ink-dim); letter-spacing:.02em; }
    .ss-respill.energy { border-color:rgba(230,180,92,0.45); } .ss-respill.energy .ss-rv { color:var(--ss-gold); }
    .ss-respill.water { border-color:rgba(127,208,224,0.45); } .ss-respill.water .ss-rv { color:var(--ss-water); }
    .ss-respill.phos { border-color:rgba(199,155,230,0.45); } .ss-respill.phos .ss-rv { color:#c79be6; }

    .ss-deck { display:flex; flex-wrap:wrap; gap:16px 22px; padding:2px 8px 8px 0; }
    .ss-gc { position:relative; width:116px; aspect-ratio:5/7; flex:0 0 auto; border-radius:10px; overflow:hidden; display:flex; flex-direction:column;
      background:linear-gradient(162deg, rgba(20,28,26,0.92), rgba(8,13,12,0.97)); border:1px solid rgba(150,180,165,0.32);
      box-shadow:0 0 12px -4px rgba(127,230,163,0.4), 0 10px 22px -14px rgba(0,0,0,0.9); }
    .ss-detail.warm .ss-gc { border-color:rgba(230,180,92,0.34); box-shadow:0 0 12px -4px rgba(230,180,92,0.4), 0 10px 22px -14px rgba(0,0,0,0.9); }
    .ss-detail.aqua .ss-gc { border-color:rgba(127,208,224,0.32); box-shadow:0 0 12px -4px rgba(127,208,224,0.4), 0 10px 22px -14px rgba(0,0,0,0.9); }
    .ss-detail.spore .ss-gc { border-color:rgba(199,155,230,0.32); box-shadow:0 0 12px -4px rgba(199,155,230,0.4), 0 10px 22px -14px rgba(0,0,0,0.9); }
    .ss-gc.ss-multi { box-shadow:3px 3px 0 -1px rgba(10,15,13,0.96), 3px 3px 0 0 rgba(150,180,165,0.22),
      6px 6px 0 -1px rgba(8,12,11,0.96), 6px 6px 0 0 rgba(150,180,165,0.16), 0 10px 22px -14px rgba(0,0,0,0.9); }
    .ss-gc-art { position:relative; aspect-ratio:3/2; overflow:hidden; background:#04060a; flex:0 0 auto; }
    .ss-gc-art img { width:100%; height:100%; object-fit:cover; display:block; }
    .ss-gc-art::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 64%, rgba(8,13,12,0.92)); }
    /* "Choose Five" placeholder face (memory species): a "?" art window, no image. */
    .ss-gc-art.ss-gc-q { display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 42%, #14201a, #05100b); }
    .ss-gc-art.ss-gc-q::after { display:none; }
    .ss-gc-q .ss-q { font-size:30px; }
    .ss-gc.ss-gc-choose { border-style:dashed; }
    .ss-gc-name { font-family:var(--ss-serif); font-size:11.5px; font-weight:600; line-height:1.12; color:#eef7f1; padding:6px 8px 3px; }
    .ss-gc-eff { font-size:9px; line-height:1.34; color:var(--ss-ink-dim); padding:0 8px 8px; flex:1 1 auto; overflow:hidden;
      display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; }
    .ss-gc-count { position:absolute; top:6px; right:6px; z-index:3; font-size:10.5px; font-weight:700; font-variant-numeric:tabular-nums;
      color:var(--ss-mint); background:rgba(5,9,8,0.82); border:1px solid rgba(127,230,163,0.5); border-radius:999px; padding:2px 7px; box-shadow:0 0 10px -3px rgba(127,230,163,0.5); }
    .ss-detail.warm .ss-gc-count { color:var(--ss-gold); border-color:rgba(230,180,92,0.5); box-shadow:0 0 10px -3px rgba(230,180,92,0.5); }
    .ss-detail.aqua .ss-gc-count { color:#9fdcea; border-color:rgba(127,208,224,0.5); box-shadow:0 0 10px -3px rgba(127,208,224,0.5); }
    .ss-detail.spore .ss-gc-count { color:#d6bff0; border-color:rgba(199,155,230,0.5); box-shadow:0 0 10px -3px rgba(199,155,230,0.5); }
    .ss-gc-type { position:absolute; bottom:6px; left:6px; z-index:3; font-size:8px; letter-spacing:.12em; text-transform:uppercase; color:var(--ss-ink);
      background:rgba(5,9,8,0.7); border:1px solid rgba(120,160,140,0.3); border-radius:5px; padding:2px 5px; }
    .ss-cost { position:absolute; top:6px; left:6px; z-index:3; display:inline-flex; gap:4px; }
    .ss-cpip { display:inline-flex; align-items:center; gap:2px; font-size:10.5px; font-weight:700; font-variant-numeric:tabular-nums; color:#bfeaf2;
      background:rgba(5,9,8,0.82); border:1px solid rgba(127,208,224,0.5); border-radius:999px; padding:2px 6px 2px 5px; box-shadow:0 0 8px -3px rgba(127,208,224,0.45); }
    .ss-cpip.p { color:#dcc4f2; border-color:rgba(199,155,230,0.5); box-shadow:0 0 8px -3px rgba(199,155,230,0.45); }
    .ss-cost .ss-ri { width:12px; height:12px; }

    .ss-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; padding-top:14px; border-top:1px solid rgba(120,160,140,0.16); }
    /* Plain black-and-white buttons (no gradients): Cancel = black outline, Start = white fill. */
    .ss-btn { flex:1; font:inherit; cursor:pointer; border-radius:13px; padding:13px 16px; font-size:14px; font-weight:600; letter-spacing:.01em;
      transition:background .16s, border-color .16s, color .16s, transform .06s; }
    .ss-btn:active { transform:translateY(1px); }
    .ss-btn.ghost { background:#000; border:1px solid #fff; color:#fff; }
    .ss-btn.ghost:hover { background:#1a1a1a; }
    .ss-btn.primary { flex:1.6; background:#fff; color:#000; border:1px solid #fff; }
    .ss-btn.primary:hover { background:#e6e6e6; border-color:#e6e6e6; }
    .ss-detail .ss-btn.primary.is-locked { background:#111; color:var(--ss-ink-dim); border-color:rgba(255,255,255,0.2); cursor:not-allowed; }
    /* Start-level stepper — memory colonies dial in which campaign level to begin on, next to Start game. */
    .ss-lvlstep { flex:0 0 auto; display:inline-flex; align-items:center; gap:8px; padding:0 10px; border-radius:13px;
      background:#000; border:1px solid #fff; color:#fff; font-size:13px; font-weight:600; }
    .ss-lvllbl { min-width:56px; text-align:center; letter-spacing:.02em; }
    .ss-lvllbl b { font-weight:800; }
    .ss-lvlpm { width:28px; height:28px; border-radius:8px; cursor:pointer; font-size:18px; line-height:1; font-weight:700;
      background:transparent; border:1px solid rgba(255,255,255,0.4); color:#fff; display:flex; align-items:center; justify-content:center; }
    .ss-lvlpm:hover:not(:disabled) { background:#1a1a1a; }
    .ss-lvlpm:disabled { opacity:.3; cursor:not-allowed; }

    .ss-close { position:absolute; top:12px; right:12px; z-index:3; width:34px; height:34px; border-radius:999px; cursor:pointer;
      background:rgba(6,10,14,0.7); border:1px solid rgba(160,190,175,0.35); color:var(--ss-ink); font-size:18px; line-height:1;
      display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    .ss-close:hover { background:rgba(20,28,26,0.9); border-color:var(--ss-mint); color:var(--ss-mint-hi); }

    /* level-win: NO container — a procedural mycelium headline (with lighting behind),
       a plain sub-line, then the new-species card(s) and/or a plain black Proceed button.
       Shown OVER the won map (translucent scrim, not opaque). The hand carousel is
       collapsed to a thin strip before this appears (main.js onLevelWon), so the bottom
       pad only needs to clear that strip. Body-level overlay, so it re-declares the
       --ss-* palette the embedded cards need. */
    .ss-win {
      --ss-mint:#7fe6a3; --ss-mint-hi:#c8fff0; --ss-ink:#d7e6dc; --ss-ink-dim:#8aa193; --ss-ink-faint:#57685f;
      --ss-gold:#e6b45c; --ss-water:#7fd0e0; --ss-white-rim:rgba(226,238,232,0.9);
      --ss-serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
      --ss-sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
      position:fixed; inset:0; z-index:1004; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:clamp(4px,1.1vh,13px); text-align:center; overflow:hidden;
      padding:clamp(12px,3vh,28px) clamp(20px,5vw,56px) clamp(96px,13vh,150px);   /* bottom pad clears the collapsed carousel strip */
      font-family:var(--ss-sans); color:var(--ss-ink);
      background:radial-gradient(46% 40% at 50% 40%, rgba(127,230,163,0.10), transparent 66%),
                 radial-gradient(52% 50% at 50% 40%, rgba(3,7,6,0.60), rgba(3,7,6,0.20) 60%, transparent 82%);
      animation:ssIn .5s ease both; }
    .ss-win-title { position:relative; width:min(680px,86vw); height:clamp(82px,14vh,150px); pointer-events:none;
      background:radial-gradient(50% 60% at 50% 50%, rgba(150,255,205,0.18), rgba(127,230,163,0.05) 46%, transparent 72%); }
    .ss-win-sub { font-family:var(--ss-serif); font-weight:600; font-size:clamp(16px,2.5vw,25px); margin:0; color:#eaf6ee;
      text-shadow:0 1px 4px rgba(0,0,0,0.85), 0 0 22px rgba(127,230,163,0.22); }
    .ss-win-sub b { color:#eaf7ff; font-weight:700; }
    .ss-win-sub .spore-ic { width:1.02em; height:1.02em; vertical-align:-0.14em; margin-left:3px; }
    .ss-win-unlock { margin-top:clamp(3px,0.9vh,9px); font-size:11px; letter-spacing:.24em; text-transform:uppercase;
      color:var(--ss-mint); font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,0.85); }
    .ss-win-cards { display:flex; flex-wrap:wrap; justify-content:center; gap:14px; }
    .ss-win-cards .ss-card { flex:0 0 auto; width:min(60vw,168px); }
    .ss-win-btn { margin-top:clamp(8px,2vh,20px); cursor:pointer; font-family:var(--ss-sans); font-weight:600;
      font-size:clamp(14px,1.9vw,17px); letter-spacing:.05em; color:#fff; background:#000; border:1px solid rgba(255,255,255,0.3);
      border-radius:10px; padding:12px 40px; box-shadow:0 6px 22px -6px rgba(0,0,0,0.9);
      transition:background .18s, border-color .18s; }
    .ss-win-btn:hover { background:#0d0d0d; border-color:rgba(255,255,255,0.55); }
    /* Short (landscape-phone) screens: with the carousel collapsed the bottom strip is thin,
       but vertical room is still tight — shrink the win content so it all fits above the strip. */
    @media (max-height:600px) {
      .ss-win { gap:2px; padding:6px clamp(16px,4vw,40px) clamp(76px,14vh,110px); }
      .ss-win-title { width:min(560px,78vw); height:clamp(44px,15vh,84px); }
      .ss-win-sub { font-size:clamp(14px,3.6vh,19px); }
      .ss-win-unlock { margin-top:2px; font-size:10px; letter-spacing:.2em; }
      .ss-win-cards .ss-card { width:min(28vw,116px); }
      .ss-win-btn { margin-top:6px; padding:8px 28px; font-size:14px; }
    }
    /* Very short: the card still shows (carousel is collapsed, so there's room) — just keep
       the headline/sub compact so the whole stack clears the thin bottom strip. */
    @media (max-height:500px) {
      .ss-win { gap:1px; padding:4px 4vw clamp(66px,13vh,96px); }
      .ss-win-title { width:min(520px,72vw); height:clamp(38px,12vh,64px); }
      .ss-win-sub { font-size:clamp(13px,3.2vh,16px); }
    }

    /* between-level: level-complete / game-won panel (reuses the .ss-detailwrap backdrop) */
    .ss-lc { position:relative; width:min(560px,100%); max-height:calc(100vh - clamp(24px,6vw,72px)); overflow-y:auto;
      background:linear-gradient(160deg, rgba(15,22,20,0.97), rgba(7,11,10,0.99)); border:1.5px solid rgba(127,230,163,0.55);
      border-radius:18px; padding:clamp(22px,3.5vw,34px); text-align:center;
      box-shadow:0 0 26px -2px rgba(127,230,163,0.45), 0 0 80px -16px rgba(127,230,163,0.3), 0 40px 90px -30px rgba(0,0,0,0.95);
      transform:translateY(14px) scale(.97); opacity:0; animation:ssLcIn .34s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes ssLcIn { to { transform:none; opacity:1; } }
    .ss-lc-badge { display:inline-block; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; font-weight:700;
      color:var(--ss-mint); border:1px solid rgba(127,230,163,0.4); background:rgba(127,230,163,0.08);
      border-radius:999px; padding:4px 12px; margin-bottom:14px; }
    .ss-lc-title { font-family:var(--ss-serif); font-size:clamp(22px,3.4vw,30px); font-weight:600; line-height:1.1;
      color:#eef7f1; margin:0 0 10px; text-wrap:balance; }
    .ss-lc-sub { font-size:14px; line-height:1.55; color:var(--ss-ink-dim); margin:0 auto; max-width:46ch; }
    .ss-lc-unlock-head { margin:18px 0 5px; font-family:var(--ss-serif); font-size:clamp(20px,2.7vw,25px);
      font-weight:600; color:#eef7f1; letter-spacing:.01em; display:flex; align-items:center; justify-content:center; gap:9px; }
    .ss-lc-star { color:var(--ss-mint); font-size:0.9em; text-shadow:0 0 14px rgba(127,230,163,0.85); }
    .ss-lc-unlock-sub { margin:0 auto; font-size:13.5px; line-height:1.5; color:var(--ss-ink-dim); max-width:46ch; }
    .ss-lc-cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 188px)); justify-content:center; gap:14px; margin:14px auto 4px; max-width:420px; }
    .ss-lc-actions { margin-top:22px; display:flex; justify-content:center; }
    .ss-lc-actions .ss-btn { flex:0 0 auto; min-width:240px; }

    /* TEMP dev button: instantly clear the current level (amber dashed = dev affordance) */
    #devWin { position:fixed; top:14px; right:14px; z-index:31; cursor:pointer;
      font:600 11.5px "Segoe UI", system-ui, sans-serif; letter-spacing:.03em; color:#e6cf9a;
      background:rgba(14,18,12,0.82); border:1px dashed rgba(230,180,92,0.6); border-radius:999px;
      padding:6px 12px; backdrop-filter:blur(4px); }
    #devWin:hover { color:#fff; border-color:#e6b45c; background:rgba(24,26,18,0.92); }

    /* ============================ FIRST-RUN TUTORIAL ============================
       Clean black & white popups with a slight white border-glow (mirrors the
       species-select console) — NO gradients. Root is pointer-events:none so the
       game underneath stays usable on the forced steps. */
    #tutorial { position:fixed; inset:0; z-index:1200; pointer-events:none;
      font:400 15px/1.5 "Segoe UI", system-ui, sans-serif; color:#fff; }
    /* Full-screen click catcher — TRANSPARENT (the map is never dimmed during the
       tutorial); it only exists so a click anywhere advances an explanatory step. */
    .tut-catcher { position:absolute; inset:0; pointer-events:auto; cursor:pointer;
      background:transparent; }
    .tut-pop { position:absolute; pointer-events:auto; left:50%; transform:translateX(-50%);
      width:min(460px, calc(100vw - 40px)); background:#000;
      border:1.5px solid rgba(255,255,255,0.72); border-radius:16px;
      box-shadow:0 0 22px -2px rgba(255,255,255,0.42), 0 0 60px -10px rgba(255,255,255,0.30),
        inset 0 0 40px -16px rgba(255,255,255,0.12), 0 30px 80px -30px rgba(0,0,0,0.95);
      padding:20px 22px 16px; }
    .tut-pop--bottom { bottom:120px; }
    .tut-pop--top { top:26px; }
    .tut-pop--center { top:50%; transform:translate(-50%,-50%); }
    /* Desktop: popup in the TOP HALF, on the LEFT or RIGHT (opposite the framed subject),
       clear of the top-left resource pill (top offset) and the bottom card carousel (top
       half). Applied by tutorial.js only on wide screens. */
    .tut-pop--side { top:clamp(72px, 11vh, 150px); bottom:auto; left:auto; right:auto;
      transform:none; width:min(440px, 40vw); }
    .tut-pop--side.tut-pop--left  { left:clamp(20px, 4vw, 72px); }
    .tut-pop--side.tut-pop--right { right:clamp(20px, 4vw, 72px); }
    .tut-pop--side .tut-fig img { max-height:200px; }
    .tut-body { font-size:17px; line-height:1.5; letter-spacing:.004em; text-wrap:balance; }
    .tut-body b { font-weight:700; }
    .tut-body i { font-style:italic; color:#dcdcdc; }
    .tut-fig { margin:-2px 0 14px; border:1px solid rgba(255,255,255,0.5); border-radius:10px;
      overflow:hidden; background:#000; box-shadow:0 0 18px -6px rgba(255,255,255,0.4); }
    .tut-fig img { display:block; width:100%; height:auto; max-height:236px; object-fit:cover;
      filter:contrast(1.05); }
    .tut-btns { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:16px; }
    .tut-btn { font:inherit; font-weight:600; font-size:14px; cursor:pointer; pointer-events:auto;
      border-radius:11px; padding:9px 18px; letter-spacing:.01em; transition:background .12s, color .12s, border-color .12s; }
    .tut-end { background:#000; border:1px solid rgba(255,255,255,0.5); color:#c8c8c8; }
    .tut-end:hover { background:#151515; color:#fff; border-color:#fff; }
    .tut-next { background:#fff; border:1px solid #fff; color:#000; }
    .tut-next:hover { background:#e6e6e6; border-color:#e6e6e6; }

    /* pulsing target ring around whatever the step points at */
    .tut-ring { position:absolute; border-radius:50%; border:2px solid rgba(255,255,255,0.95);
      box-shadow:0 0 18px 2px rgba(255,255,255,0.55), inset 0 0 14px rgba(255,255,255,0.35);
      pointer-events:none; animation:tutPulse 1.4s ease-in-out infinite; }
    @keyframes tutPulse { 0%,100%{ opacity:0.95 } 50%{ opacity:0.5 } }

    /* strong white glow on the card the player is being forced to play */
    .cardbtn.tut-glow { outline:2px solid #fff; outline-offset:2px;
      animation:tutCard 1.25s ease-in-out infinite; }
    @keyframes tutCard {
      0%,100%{ box-shadow:0 0 18px 2px rgba(255,255,255,0.55), 0 0 40px 8px rgba(255,255,255,0.22) }
      50%{ box-shadow:0 0 30px 6px rgba(255,255,255,0.95), 0 0 60px 14px rgba(255,255,255,0.4) } }

    /* drag-to-grow demo: a finger dot that repeatedly pulls DOWN-and-out from the colony,
       INTO the soil (never up toward the sky) — matches the "pull into the soil" copy. */
    .tut-demo { position:absolute; pointer-events:none; }
    .tut-demo-dot { position:absolute; width:20px; height:20px; margin:-10px; border-radius:50%;
      background:#fff; box-shadow:0 0 16px 4px rgba(255,255,255,0.8);
      animation:tutDrag 1.7s ease-in-out infinite; }
    @keyframes tutDrag {
      0% { transform:translate(0,0); opacity:0 }
      14% { opacity:1 }
      68% { transform:translate(80px,64px); opacity:1 }
      100% { transform:translate(80px,64px); opacity:0 } }

    @media (max-width:720px) {
      .tut-pop { width:min(440px, calc(100vw - 26px)); padding:16px 16px 12px; }
      .tut-pop--bottom { bottom:98px; }
      .tut-body { font-size:15.5px; }
      .tut-fig img { max-height:190px; }
    }
    /* Portrait phone: smallest pics + text, and the popup hugs the screen edges — it
       sits just above the MINIMIZED hand carousel (bottom steps; tutorial.js collapses
       the hand) and drops below the top-left resource pill (top steps) so it clears
       both. Overlapping the pill is tolerated but avoided here. */
    @media (max-width:720px) and (orientation:portrait) {
      .tut-pop { width:min(400px, calc(100vw - 18px)); padding:13px 15px 11px; }
      .tut-pop--bottom { bottom:calc(60px + env(safe-area-inset-bottom, 0px)); }
      .tut-pop--top { top:60px; }             /* clear the top-left resource pill */
      .tut-body { font-size:14px; line-height:1.45; }
      .tut-fig { margin:-1px 0 10px; }
      .tut-fig img { max-height:146px; }
      .tut-btns { margin-top:11px; }
      .tut-btn { padding:8px 15px; font-size:13px; }
    }

    /* ---- Run-end loadout picker (memory species, e.g. Split Gill) ----------
       Two carousels that REUSE the in-game hand carousel (.cardbtn faces + .fchip
       filters): UPPER = next run's hand (fixed opener locked + selected), LOWER =
       cards drafted this run. Click to move copies up/down. Namespaced
       #loadoutSelect / .lo-*. See render/loadout_select.js. */
    #loadoutSelect { position:fixed; inset:0; z-index:1400; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(1200px 620px at 50% -6%, rgba(126,240,192,0.07), transparent 60%),
        linear-gradient(180deg,#08110d,#050b08); color:#e6f4ec;
      font-family:"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; padding:16px; overflow:auto; }
    #loadoutSelect *, #loadoutSelect *::before, #loadoutSelect *::after { box-sizing:border-box; }
    .lo-panel { width:100%; max-width:1120px; display:flex; flex-direction:column; align-items:center; gap:10px; margin:auto; }
    .lo-caro { width:100%; display:flex; flex-direction:column; gap:6px; }
    .lo-label { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#7ef0c0; font-weight:700; margin:0 2px; }
    /* filter chips — same look as the in-game .handfilter row */
    .lo-filter { display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; padding:1px 2px; }
    .lo-filter::-webkit-scrollbar { display:none; }
    /* carousel scroll list — mirrors .handlist (horizontal, hidden scrollbar) */
    .lo-list { display:flex; gap:8px; overflow-x:auto; overflow-y:hidden; padding:6px 2px 10px; min-height:150px;
      align-items:flex-start; cursor:grab; user-select:none; -webkit-user-select:none; touch-action:pan-x;
      border:1px solid rgba(126,240,192,0.14); border-radius:13px; background:linear-gradient(180deg,rgba(10,18,14,0.5),rgba(6,11,9,0.66)); }
    .lo-list:active { cursor:grabbing; }
    .lo-list::-webkit-scrollbar { display:none; }
    #loadoutSelect .cardbtn img { -webkit-user-drag:none; user-drag:none; }   /* don't let the art start a native image-drag */
    /* the .cardbtn faces come straight from the in-game carousel; add the fixed-opener lock badge */
    #loadoutSelect .cardbtn { cursor:pointer; }
    #loadoutSelect .cardbtn.lo-fixed { cursor:default; }
    #loadoutSelect .cardbtn.unaff { cursor:default; }
    .lo-lock { position:absolute; bottom:8px; right:9px; z-index:6; font-size:14px; color:#7ef0c0; text-shadow:0 1px 5px #000; }
    .lo-empty { color:#8fb3a4; font-size:13px; padding:40px 12px; margin:auto; }
    .lo-mid { display:flex; flex-direction:column; align-items:center; gap:3px; margin:2px 0; }
    .lo-mid-txt { font-size:clamp(14px,2.4vw,18px); font-weight:700; color:#eaf4ee; letter-spacing:.01em; }
    .lo-count { font-size:12px; font-weight:800; color:#8fb3a4; letter-spacing:.08em; }
    .lo-count.lo-full { color:#7ef0c0; }
    .lo-actions { margin-top:8px; }
    /* simple black & white button (no gradient, no icon) */
    .lo-btn { font:inherit; font-size:15px; font-weight:700; color:#000; background:#fff;
      border:2px solid #fff; border-radius:10px; padding:11px 30px; cursor:pointer; }
    .lo-btn:hover { background:#e9e9e9; }

    /* ---- Level intro -------------------------------------------------------
       A full-screen BLACK "Level N" + threat-roster screen shown before each
       campaign level's map fades in. No container / no buttons — the content
       sits straight on black. The overlay fades ITS OWN opacity out on click,
       revealing the (already fully drawn) map behind it — that IS the map
       fade-in (see main.js revealMap / level_intro.js). Sits above the tutorial
       (z 1200) so a deferred first-run tutorial starts only after it clears. */
    #levelIntro { position:fixed; inset:0; z-index:1300; background:#000; cursor:pointer;
      display:flex; align-items:center; justify-content:center; padding:24px;
      opacity:1; transition:opacity 1.4s ease; -webkit-tap-highlight-color:transparent; }
    /* Once dismissed, stop intercepting input immediately (even before the node is
       removed) so the fading-out overlay can never swallow a map tap. */
    #levelIntro.li-out { opacity:0; pointer-events:none; }
    .li-inner { display:flex; flex-direction:column; align-items:center;
      gap:clamp(26px,5.2vh,56px); text-align:center;
      opacity:0; transform:translateY(12px); transition:opacity .8s ease, transform .8s ease; }
    #levelIntro.li-in .li-inner { opacity:1; transform:none; }
    /* Level title is the procedural mycelium wordmark ("LEVEL ONE", …); it grows to
       fill this box (size = min of height·0.72 and a width-derived cap). */
    .li-level { width:min(720px,92vw); height:clamp(84px,14vh,128px); }
    .li-threats { display:flex; align-items:flex-start; justify-content:center;
      gap:clamp(16px,4.4vw,46px); flex-wrap:wrap; }
    .li-threat { display:flex; flex-direction:column; align-items:center; gap:clamp(10px,1.6vh,16px); }
    /* Square portrait with a white border + faint glow, matching the tutorial figures. */
    .li-pic { width:clamp(98px,20vw,196px); aspect-ratio:1/1; border-radius:13px; overflow:hidden;
      background:#000; border:1.5px solid rgba(255,255,255,0.55);
      box-shadow:0 0 24px -4px rgba(255,255,255,0.42), inset 0 0 34px -18px rgba(255,255,255,0.22); }
    .li-pic img { width:100%; height:100%; object-fit:cover; display:block; filter:contrast(1.05); }
    /* Head-focused crops: the square keeps the ant's head/mandibles and the
       nematode's mouth as the focus, without cropping down to only the head. */
    .li-pic--ant img { object-position:50% 45%; }
    .li-pic--nematode img { object-position:54% 42%; }
    .li-pic--trichoderma img { object-position:50% 50%; }
    .li-pic--noimg { display:none; }
    .li-count { font-family:var(--serif); font-weight:600; color:#fff; letter-spacing:.02em;
      font-size:clamp(21px,3.6vw,32px); }
    .li-hint { font-family:"Segoe UI",system-ui,-apple-system,sans-serif; font-size:13px;
      letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,0.42);
      animation:liHint 2.2s ease-in-out infinite; }
    @keyframes liHint { 0%,100%{ opacity:.3 } 50%{ opacity:.62 } }
    @media (max-width:720px) {
      .li-threat { gap:9px; }
      .li-hint { font-size:11px; letter-spacing:.12em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .li-inner { transition-duration:.01ms; }
      #levelIntro { transition-duration:.01ms; }
      .li-hint { animation:none; }
    }

    /* HUD campaign level chip (top-centre, non-interactive) */

    @media (max-width:720px) {
      /* Phone (portrait): one card per column so each is large. */
      .ss-grid { grid-template-columns:minmax(0,560px); justify-content:center; }
      .ss-detail { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
      .ss-d-art { max-height:34vh; }
    }
    /* Phone (landscape): two cards per row. Cap each by VIEWPORT HEIGHT (the short
       dimension here) so the row doesn't get tall, and centre the pair. */
    @media (orientation:landscape) and (max-height:520px) {
      .ss-grid { grid-template-columns:repeat(2,minmax(0,min(320px,76vh))); justify-content:center; }
    }
    @media (prefers-reduced-motion: reduce) {
      #speciesSelect, #speciesSelect * { animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <script type="module" src="./src/main.js"></script>
</body>
