<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🍄</text></svg>" />
  <title>Mycelium — Phase 1</title>
  <style>
    :root {
      --bg: #05070d;
      --panel: rgba(16, 22, 34, 0.86);
      --panel-border: rgba(120, 160, 140, 0.18);
      --ink: #d7e6dc;
      --ink-dim: #8aa193;
      --accent: #7fe6a3;
      --accent-dim: #3a6f50;
      --warn: #e0a85a;
      --danger: #e06a6a;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink);
      user-select: none; -webkit-user-select: none; }
    #game { position: fixed; inset: 0; display: block; cursor: crosshair; touch-action: none;
      opacity: 0; }   /* revealed (faded in) by main.js once the map's art has loaded */
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }

    .panel { position: absolute; background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.4); }
    .title { font-weight: 600; font-size: 13px; letter-spacing: 0.04em; color: var(--ink);
      margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .title .sub { color: var(--accent); font-weight: 400; font-size: 11px; }
    .title.clickable { cursor: pointer; }
    .title .chev { margin-left: auto; color: var(--ink-dim); font-size: 11px; }
    .title .warn { color: var(--warn); font-size: 10px; font-weight: 400; }

    /* HUD — one compact glowing resource row + a drop-down event log */
    /* z-index lifts the pill + log + engine ledger above the hand carousel so the
       drop-downs overlay cleanly instead of being clipped by it (below toast/overlay). */
    .hud { top: 14px; left: 14px; min-width: 0; padding: 0; background: none; border: none;
      box-shadow: none; backdrop-filter: none; z-index: 30; }
    .resrow { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 12px; min-height: 40px; cursor: pointer;
      background: linear-gradient(150deg, rgba(18,28,22,0.92), rgba(8,14,11,0.92));
      border: 1.5px solid rgba(130,230,166,0.5); border-radius: 999px;
      box-shadow: 0 0 14px -2px rgba(130,230,166,0.5), inset 0 0 0 1px rgba(130,230,166,0.14), 0 6px 20px -8px rgba(0,0,0,0.7);
      backdrop-filter: blur(6px); }
    /* Icon + number + income-delta all vertically CENTRED so the three resources
       read as one coherent row (energy/water/phosphorus now all use same-size SVGs). */
    .res { display: inline-flex; align-items: center; gap: 4px; padding: 0 4px; }
    .res .rk { font-size: 11px; font-weight: 700; opacity: 0.85; }
    .res .rv { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; line-height: 1; }
    /* per-round income shown next to the stock, e.g. "200 +1–3" */
    .res .rd { font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; opacity: 0.82; margin-left: 1px; }
    .res .rd:empty { display: none; }
    .res.e .rk, .res.e .rv, .res.e .ri, .res.e .rd { color: var(--accent); }
    /* (Energy bolt icon carries its own gold fill in RES_ICON — see ui.js — so it's
       the same yellow here as on card costs + the Skip chip; the number stays green.) */
    .res.w .rk, .res.w .rv, .res.w .ri, .res.w .rd { color: #7fd0e0; }
    .res.p .rk, .res.p .rv, .res.p .ri, .res.p .rd { color: #c79be6; }
    /* Resource marks (bolt / water drop / phosphorus spark) — inherit currentColor. */
    .ri { display: inline-block; width: 1em; height: 1em; flex: 0 0 auto; vertical-align: -0.14em; }
    .res .ri { width: 16px; height: 16px; align-self: center; }
    .logbtn { font-family: inherit; font-size: 12px; font-weight: 600; color: var(--ink);
      background: rgba(127,230,163,0.12); border: 1px solid rgba(130,230,166,0.4); border-radius: 999px;
      padding: 4px 11px; cursor: pointer; margin-left: 2px; display: inline-flex; align-items: center; gap: 4px; }
    .logbtn:hover { background: rgba(127,230,163,0.22); border-color: rgba(170,255,205,0.6); }
    .logbtn .lchev { font-size: 9px; color: var(--ink-dim); }
    .mutebtn { font-size: 13px; line-height: 1; background: rgba(127,230,163,0.12);
      border: 1px solid rgba(130,230,166,0.4); border-radius: 999px; cursor: pointer;
      width: 26px; height: 26px; padding: 0; margin-left: 2px; display: inline-flex;
      align-items: center; justify-content: center; }
    .mutebtn:hover { background: rgba(127,230,163,0.22); border-color: rgba(170,255,205,0.6); }
    .logdrop { margin-top: 8px; max-width: 340px; padding: 8px 12px;
      background: linear-gradient(150deg, rgba(16,24,20,0.94), rgba(8,13,11,0.94));
      border: 1px solid rgba(130,230,166,0.35); border-radius: 12px;
      box-shadow: 0 0 12px -3px rgba(130,230,166,0.35), 0 8px 24px -8px rgba(0,0,0,0.6); backdrop-filter: blur(6px); }
    .logdrop.hidden { display: none; }
    .logdrop .loglist { max-height: 34vh; overflow-y: auto; }
    .traits { display: flex; gap: 6px; margin-top: 10px; }
    .traits .tr { font-size: 11px; color: var(--ink-dim); background: rgba(255,255,255,0.05);
      padding: 2px 7px; border-radius: 6px; }
    .traits .tr.on { color: var(--accent); background: rgba(127,230,163,0.12); }
    .traits .tr b { color: var(--ink); margin-left: 2px; }

    /* Action bar — glowing on-theme tray. DESKTOP: a vertical column pinned to the
       bottom-right, beside the card carousel. (Phone restores a horizontal bottom
       strip in the media queries below.) */
    .actionbar { bottom: 16px; right: 12px; left: auto; transform: none; display: flex; flex-direction: column; gap: 8px;
      align-items: stretch; flex-wrap: nowrap; width: 164px; padding: 10px;
      background: linear-gradient(150deg, rgba(18,28,22,0.92), rgba(8,14,11,0.92));
      border: 1.5px solid rgba(130,230,166,0.5); border-radius: 14px;
      box-shadow: 0 0 14px -2px rgba(130,230,166,0.5), inset 0 0 0 1px rgba(130,230,166,0.14), 0 6px 20px -8px rgba(0,0,0,0.7); }
    /* Buttons stack vertically (Show Hand · Draw · Skip · Play Card), each full-width. */
    .actionbar .abgroup { display: flex; flex-direction: column; gap: 8px; align-items: stretch; width: 100%; }
    /* Action buttons — "Lumen": a bioluminescent frosted-glass finish. An icon,
       then a stacked function/cost; a top light-line + depth shadow; the mint rim
       wakes on hover. Icon hides on narrow phones (media query below). */
    .actionbar .abtn { display: inline-flex; flex-direction: row; align-items: center; justify-content: center;
      gap: 9px; min-height: 52px; padding: 7px 15px; line-height: 1.14; white-space: nowrap; border-radius: 13px;
      background: linear-gradient(180deg, rgba(34,50,42,0.92), rgba(15,24,20,0.94));
      border: 1px solid rgba(130,230,166,0.26);
      box-shadow: inset 0 1px 0 rgba(198,255,224,0.10), 0 6px 16px -10px rgba(0,0,0,0.9);
      transition: background .16s, border-color .16s, box-shadow .16s, transform .06s; }
    /* Icons removed from the bottom bar on every screen — text-only buttons (matches phone). */
    .actionbar .abtn .ic { display: none; }
    .actionbar .abtn .txt { display: inline-flex; flex-direction: column; align-items: flex-start; }
    .actionbar .abtn .blabel { font-size: 13px; font-weight: 600; letter-spacing: .005em; color: var(--ink); }
    .actionbar .abtn .bcost { font-size: 11px; margin-top: 2px; color: #e6b45c; font-variant-numeric: tabular-nums;
      display: inline-flex; gap: 5px; }
    .actionbar .abtn .bcost .w { color: #83d2e4; }   /* water */
    .actionbar .abtn .bcost .p { color: #c79be6; }   /* phosphorus */
    /* No cost (Show Hand, or Play Card with nothing selected) → drop the empty row
       so the single label centres next to the icon. */
    .actionbar .abtn .bcost:empty { display: none; }
    .actionbar .abtn:hover:not(:disabled) { border-color: rgba(130,230,166,0.6);
      background: linear-gradient(180deg, rgba(42,62,52,0.96), rgba(18,30,24,0.96));
      box-shadow: inset 0 1px 0 rgba(198,255,224,0.16), 0 0 16px -4px rgba(127,230,163,0.4), 0 6px 16px -10px rgba(0,0,0,0.9); }
    .actionbar .abtn:active:not(:disabled) { transform: translateY(1px); }
    /* Show Hand — a mint-tinted glass toggle */
    .actionbar .handbtn { background: linear-gradient(180deg, rgba(127,230,163,0.18), rgba(127,230,163,0.055));
      border-color: rgba(130,230,166,0.42); }
    .actionbar .handbtn:hover:not(:disabled) { background: linear-gradient(180deg, rgba(127,230,163,0.26), rgba(127,230,163,0.10)); }
    /* Play Card — radiant mint primary when a card is armed */
    .actionbar .playbtn { background: linear-gradient(180deg, #9bf0b8, #57cf8c); border-color: rgba(155,240,184,0.9);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 0 20px -4px rgba(127,230,163,0.7), 0 6px 16px -10px rgba(0,0,0,0.9); }
    .actionbar .playbtn:hover:not(:disabled) { background: linear-gradient(180deg, #b6ffd0, #6ee0a0);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 0 26px -2px rgba(127,230,163,0.9), 0 6px 16px -10px rgba(0,0,0,0.9); }
    .actionbar .playbtn .ic, .actionbar .playbtn .blabel { color: #06110a; }
    .actionbar .playbtn .bcost, .actionbar .playbtn .bcost .w, .actionbar .playbtn .bcost .p { color: #0a2417; }
    /* Play Card disabled (no card selected) — a quiet glass button, still legible */
    .actionbar .playbtn:disabled { opacity: 1;
      background: linear-gradient(180deg, rgba(34,50,42,0.92), rgba(15,24,20,0.94));
      border-color: rgba(130,230,166,0.2);
      box-shadow: inset 0 1px 0 rgba(198,255,224,0.08), 0 6px 16px -10px rgba(0,0,0,0.9); }
    .actionbar .playbtn:disabled .ic, .actionbar .playbtn:disabled .blabel { color: var(--ink-dim); }
    /* Narrow phones: drop the icon so the four buttons still fit the width. */
    @media (max-width: 560px) { .actionbar .abtn .ic { display: none; } }
    .btn { font-family: inherit; color: var(--ink); background: rgba(40,54,48,0.8);
      border: 1px solid var(--panel-border); border-radius: 8px; padding: 8px 12px; cursor: pointer;
      font-size: 13px; transition: background 0.15s, border 0.15s, transform 0.05s; white-space: nowrap; }
    .btn:hover:not(:disabled) { background: rgba(60,84,72,0.95); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .btn.selected { border-color: var(--accent); background: rgba(127,230,163,0.18);
      box-shadow: 0 0 0 1px var(--accent) inset; }
    .btn .cost { color: var(--accent); font-size: 11px; margin-left: 4px; }
    .btn .lvl { color: var(--ink-dim); font-size: 11px; }
    .btn.end { background: rgba(70,90,120,0.85); }
    .btn.restart { background: rgba(70,60,90,0.7); }
    .expr-group { display: flex; gap: 4px; align-items: center; background: rgba(255,255,255,0.04);
      border-radius: 8px; padding: 4px 6px; }
    .expr-group .group-label { color: var(--ink-dim); font-size: 11px; margin-right: 2px; }
    .expr-group .btn.trait { padding: 6px 8px; font-size: 12px; }
    .ctrl { display: flex; gap: 8px; }

    /* Transient contextual hint (e.g. "Tap the map to aim …"). bottom is set from
       JS to sit just above the hand bar; pointer-events:none so it can never block
       the filter row / carousel controls beneath it; fades out on auto-dismiss. */
    .hint { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: var(--ink-dim); background: rgba(10,14,22,0.7); padding: 5px 12px;
      border-radius: 14px; max-width: 80vw; text-align: center; z-index: 25; transition: opacity .3s; }
    /* Beat the "#ui > * { pointer-events:auto }" rule so map taps (aiming) and the
       filter row pass straight through the hint. */
    #ui > .hint { pointer-events: none; }

    /* Error toast — transient banner near the top, on-theme dark glass with a
       warning-amber edge + glow. Non-blocking; fades in then auto-clears. */
    .toast { position: absolute; top: 74px; left: 50%;
      display: flex; align-items: center; gap: 9px; max-width: min(82vw, 430px);
      padding: 10px 15px 10px 13px; border-radius: 13px; font-size: 13px; line-height: 1.35;
      color: var(--ink); background: rgba(22, 17, 14, 0.92);
      border: 1px solid rgba(224,168,90,0.45);
      box-shadow: 0 8px 26px rgba(0,0,0,0.5), 0 0 22px rgba(224,168,90,0.12), inset 0 0 0 1px rgba(224,168,90,0.08);
      -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
      pointer-events: none; z-index: 60;
      opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.97);
      transition: opacity .2s ease, transform .24s cubic-bezier(.2,.85,.3,1.25); }
    .toast.in { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    .toast.hidden { display: none; }
    .toast .tk-wrap { display: flex; flex: 0 0 auto; color: var(--warn); }
    .toast .tk { width: 19px; height: 19px; }
    .toast .tmsg { min-width: 0; }
    .toast.error { border-color: rgba(224,106,106,0.5); box-shadow: 0 8px 26px rgba(0,0,0,0.5), 0 0 22px rgba(224,106,106,0.14), inset 0 0 0 1px rgba(224,106,106,0.08); }
    .toast.error .tk-wrap { color: var(--danger); }
    @media (max-width: 560px) { .toast { top: 64px; font-size: 12px; padding: 8px 12px; } .toast .tk { width: 17px; height: 17px; } }

    /* Legend */
    .legend { top: 168px; left: 14px; width: 210px; }
    .legend.collapsed .legend-body { display: none; }
    .legend-body { display: flex; flex-direction: column; gap: 4px; }
    .legend .li { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-dim); }
    .legend .sw { width: 14px; height: 12px; border-radius: 3px; display: inline-block; flex: none;
      border: 1px solid rgba(255,255,255,0.15); }
    .legend .li.note { margin-top: 4px; color: #5e7468; font-style: italic; }

    /* Log */
    .logpanel { top: 14px; right: 14px; width: 280px; max-height: 38vh; display: flex; flex-direction: column; }
    .loglist { overflow-y: auto; font-size: 11.5px; line-height: 1.5; }
    .le { padding: 1px 0; color: var(--ink-dim); }
    .le .t { color: #51695c; margin-right: 5px; font-variant-numeric: tabular-nums; }
    .le.action { color: var(--ink); }
    .le.good { color: var(--accent); }
    .le.turn { color: #7fb0e6; }
    .le.warn { color: var(--warn); }
    .le.dev { color: #c07fe6; }

    /* ===== Installed-engine ledger (top-left) + Actions menu (top-right) =====
       Both exist only with the card layer on. The ledger hangs under the resource
       pill (it's a child of .hud, in normal flow); the Actions dock sits in the
       opposite corner. Both share the HUD's dark-glass, mint-rimmed look and
       scroll internally when they grow tall. _syncPanelHeights() may set an
       explicit height to match the two corners; the max-height here is the
       single-panel fallback. */
    .engledger.hidden, .actionsdock.hidden, .actmenu.hidden { display: none; }

    .engledger { margin-top: 8px; width: 238px; max-width: calc(100vw - 28px);
      padding: 9px 11px; font-size: 12px; color: var(--ink);
      background: linear-gradient(150deg, rgba(16,24,20,0.94), rgba(8,13,11,0.94));
      border: 1px solid rgba(130,230,166,0.35); border-radius: 12px;
      box-shadow: 0 0 12px -3px rgba(130,230,166,0.35), 0 8px 24px -8px rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      max-height: 90vh; overflow-y: auto; overflow-x: hidden;
      scrollbar-width: thin; scrollbar-color: rgba(127,230,163,0.4) transparent; }
    .engledger::-webkit-scrollbar, .actmenu::-webkit-scrollbar { width: 5px; }
    .engledger::-webkit-scrollbar-thumb, .actmenu::-webkit-scrollbar-thumb {
      background: rgba(127,230,163,0.35); border-radius: 5px; }
    .lgblock { margin-bottom: 7px; }
    .lgblock:last-child { margin-bottom: 0; }
    .lghead { display: flex; align-items: baseline; gap: 6px; font-family: var(--serif);
      font-weight: 600; margin-bottom: 3px; }
    .lghead .lgsub { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 11.5px; }
    .lghead.energy, .lghead.energy .lgsub { color: var(--accent); }
    .lghead.water, .lghead.water .lgsub { color: #7fd0e0; }
    .lghead.phosphorus, .lghead.phosphorus .lgsub { color: #c79be6; }
    .lghead.t { color: var(--warn); }
    .lghead.m { color: var(--ink-dim); }
    .erow { display: flex; align-items: center; gap: 7px; padding: 2px 0 2px 4px; }
    .erow .enm { color: var(--ink-dim); font-size: 11.5px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
    .erow .exn { color: var(--ink); font-weight: 700; font-size: 10px; opacity: 0.8; flex: 0 0 auto; }
    .erow .eval { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700;
      white-space: nowrap; flex: 0 0 auto; }
    /* income LEADS the row (replaces the old dot); fixed min-width lines the names up.
       inline-flex + centered so the +N and its resource icon share one baseline and
       the icons line up across rows. */
    .erow .eval.lead { margin-left: 0; margin-right: 5px; min-width: 34px; display: inline-flex;
      align-items: center; gap: 2px; }
    .erow .eval.lead .ri { width: 13px; height: 13px; }   /* same mark as the pill, a touch smaller */
    .erow.energy .eval { color: var(--accent); }
    .erow.water .eval { color: #7fd0e0; }
    .erow.phosphorus .eval { color: #c79be6; }
    .erow.t .eval { color: var(--warn); }
    .ecad { color: var(--ink-dim); font-size: 10px; font-weight: 600; flex: 0 0 auto; }
    /* Cadence lights: one dot per round of the cadence. Lit dots = rounds left
       until the event (a producer's next payout, or an action coming off cooldown);
       they count DOWN, then recharge. Same widget on BOTH corners. */
    .ecad.cad { display: inline-flex; align-items: center; gap: 3px; margin-left: 2px; }
    .clight { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto;
      background: rgba(220,235,225,0.13); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); }
    .clight.on { background: radial-gradient(circle at 35% 35%, #fff2d0, var(--warn)); box-shadow: 0 0 5px var(--warn); }
    .ck-e .clight.on { background: radial-gradient(circle at 35% 35%, #d7ffe8, var(--accent)); box-shadow: 0 0 5px var(--accent); }
    .ck-w .clight.on { background: radial-gradient(circle at 35% 35%, #dff6fb, #7fd0e0); box-shadow: 0 0 5px #7fd0e0; }
    .ck-p .clight.on { background: radial-gradient(circle at 35% 35%, #efe0fb, #c79be6); box-shadow: 0 0 5px #c79be6; }
    .ck-t .clight.on { background: radial-gradient(circle at 35% 35%, #fff2d0, var(--warn)); box-shadow: 0 0 5px var(--warn); }
    .lgdiv { height: 1px; background: var(--panel-border); margin: 6px 0; }

    /* glow dots — shared by ledger rows (full keys energy/water/phosphorus/t) and
       action rows (short keys e/w/p/t), so both spellings are styled. */
    .edot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
    .edot.e, .edot.energy { background: radial-gradient(circle at 35% 35%, #d7ffe8, var(--accent)); box-shadow: 0 0 6px var(--accent); }
    .edot.w, .edot.water { background: radial-gradient(circle at 35% 35%, #dff6fb, #7fd0e0); box-shadow: 0 0 6px #7fd0e0; }
    .edot.p, .edot.phosphorus { background: radial-gradient(circle at 35% 35%, #efe0fb, #c79be6); box-shadow: 0 0 6px #c79be6; }
    .edot.t { background: radial-gradient(circle at 35% 35%, #ffe6c2, var(--warn)); box-shadow: 0 0 6px var(--warn); }

    /* Actions dock (top-right): a pill button + a drop-down menu of abilities. */
    /* z-index (matches .hud) keeps the menu above the hand carousel. */
    .actionsdock { top: 14px; right: 14px; position: absolute; display: flex;
      flex-direction: column; align-items: flex-end; gap: 8px; max-width: calc(100vw - 28px);
      background: none; border: none; box-shadow: none; backdrop-filter: none; padding: 0; z-index: 30; }
    /* Same height as the resource pill (both 40px) so the two corners read as a pair. */
    .actbtn { display: inline-flex; align-items: center; gap: 7px; padding: 0 13px; height: 40px;
      border-radius: 999px; font-family: inherit; font-size: 12px; font-weight: 700; color: var(--ink);
      background: linear-gradient(150deg, rgba(18,28,22,0.92), rgba(8,14,11,0.92));
      border: 1.5px solid rgba(224,106,106,0.55);
      box-shadow: 0 0 14px -2px rgba(224,106,106,0.5), inset 0 0 0 1px rgba(224,106,106,0.14), 0 6px 20px -8px rgba(0,0,0,0.7);
      backdrop-filter: blur(6px); cursor: pointer; white-space: nowrap; }
    .actbtn:hover { border-color: rgba(240,140,140,0.75); }
    .actbtn .pk { width: 19px; height: 19px; color: var(--danger); flex: 0 0 auto; }
    /* Red badge with a white count — reads as "attention / actions" and stays legible. */
    .actbtn .abadge { font-size: 10px; font-weight: 800; color: #fff; background: #d64a4a;
      border-radius: 999px; padding: 1px 6px; box-shadow: 0 0 8px rgba(224,106,106,0.5); font-variant-numeric: tabular-nums; }
    .actbtn .abadge.zero { color: var(--ink-dim); background: rgba(120,140,130,0.18); box-shadow: none; }
    .actmenu { width: 266px; max-width: calc(100vw - 28px); padding: 4px 8px 8px;
      font-size: 12px; color: var(--ink);
      background: linear-gradient(150deg, rgba(16,24,20,0.94), rgba(8,13,11,0.94));
      border: 1px solid rgba(224,106,106,0.4); border-radius: 12px;
      box-shadow: 0 0 12px -3px rgba(224,106,106,0.35), 0 8px 24px -8px rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      max-height: 90vh; overflow-y: auto; overflow-x: hidden;
      scrollbar-width: thin; scrollbar-color: rgba(127,230,163,0.4) transparent; }
    .actrow { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center;
      padding: 7px 4px; border-top: 1px solid var(--panel-border); }
    .actrow:first-child { border-top: 0; }
    .actrow.off { opacity: 0.6; }
    .acttxt { min-width: 0; }
    .actnm { font-weight: 600; font-size: 12.5px; color: var(--ink); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .acteff { color: var(--ink-dim); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actmeta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 10px;
      color: var(--ink-dim); margin-top: 2px; }
    .acost { font-weight: 700; }
    .acost.e { color: var(--accent); } .acost.w { color: #7fd0e0; } .acost.p { color: #c79be6; }
    /* Red to match the Actions pickaxe + badge (white label). Disabled stays dim grey. */
    .use { font-family: inherit; font-size: 11.5px; font-weight: 700; color: #fff; background: #d64a4a;
      border: 1px solid #e06a6a; border-radius: 8px; padding: 6px 14px; cursor: pointer; white-space: nowrap;
      box-shadow: 0 0 10px rgba(224,106,106,0.3); align-self: center; }
    .use:hover:not(.off) { filter: brightness(1.08); }
    .use.off { color: var(--ink-dim); background: rgba(120,140,130,0.14); border-color: var(--panel-border);
      box-shadow: none; cursor: not-allowed; }
    /* Automatic ability (timed dig): an amber "auto" tag instead of a Use button. */
    .actrow.auto .acttxt { opacity: 0.92; }
    .autotag { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--warn); background: rgba(224,168,90,0.14); border: 1px solid rgba(224,168,90,0.4);
      border-radius: 8px; padding: 5px 9px; white-space: nowrap; align-self: center; }

    /* Testing panel */
    .testing { bottom: 14px; left: 14px; width: 320px; }
    .testing.collapsed .testing-list { display: none; }
    .testing-list { font-size: 11px; line-height: 1.5; color: var(--ink-dim); max-height: 30vh; overflow-y: auto; }
    .testing-list .q { margin-bottom: 5px; }
    .testing-list b { color: var(--accent); }

    /* Dev panel */
    .dev { bottom: 14px; right: 14px; width: 280px; }
    .dev.collapsed .dev-body { display: none; }
    .cheats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .dev-btn { font-size: 11px; padding: 5px 8px; background: rgba(90,60,90,0.7); }
    .sliders { display: flex; flex-direction: column; gap: 7px; max-height: 34vh; overflow-y: auto; }
    .slider label { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-dim); }
    .slider .sv { color: var(--accent); font-variant-numeric: tabular-nums; }
    .slider input[type=range] { width: 100%; accent-color: var(--accent); }

    /* Overlay */
    .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(3,5,10,0.78); backdrop-filter: blur(3px); }
    .overlay.hidden { display: none; }
    .overlay .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
      padding: 32px 40px; text-align: center; max-width: 440px; }
    .overlay h1 { font-size: 22px; margin: 0 0 12px; color: var(--accent); font-weight: 600; }
    .overlay p { color: var(--ink); font-size: 14px; line-height: 1.5; margin: 8px 0; }
    .overlay p.dim { color: var(--ink-dim); }
    .overlay p.small { font-size: 12px; }
    .overlay .btn.big { margin-top: 18px; font-size: 15px; padding: 12px 22px; background: rgba(127,230,163,0.16);
      border-color: var(--accent); }

    /* mobile-ish */
    @media (max-width: 720px) {
      .logpanel { width: 150px; max-height: 22vh; }
      .testing { width: 200px; }
      .dev { width: 200px; }

      /* Let the action bar use the FULL width and shrink its buttons, so it
         collapses into a short 1–2 row strip instead of a tall block that
         covers the map. */
      .actionbar { left: 6px; right: 6px; transform: none;
        width: auto; max-width: none; gap: 5px; padding: 7px 8px; justify-content: space-between; }
      .actionbar .btn { padding: 6px 9px; font-size: 12px; }
      .actionbar .btn .cost, .actionbar .btn .lvl { font-size: 10px; margin-left: 3px; }
      .actionbar .expr-group { padding: 3px 5px; gap: 3px; }
      .actionbar .expr-group .group-label { font-size: 10px; }
      .actionbar .expr-group .btn.trait { padding: 5px 7px; font-size: 11px; }
      .actionbar .ctrl { gap: 5px; }
      /* the hover hint isn't useful on touch and would overlap the wider bar */
      .hint { display: none; }
    }

    /* narrow phones: tighten the buttons further so everything still fits in a
       compact 1–2 row strip (all actions stay tappable — no scrolling). */
    @media (max-width: 480px) {
      .actionbar { gap: 4px; padding: 6px; }
      .actionbar .btn { padding: 6px 8px; font-size: 11.5px; }
      .actionbar .expr-group .group-label { display: none; }
    }

    /* ---- Card layer HUD ---- */
    .stat.res-w .v { color: #7fd0e0; } .stat.res-n .v { color: #93cf52; } .stat.res-p .v { color: #c79be6; }
    .btn.deckbtn { background: rgba(70,90,120,0.85); }
    .btn .deckn { color: var(--ink-dim); font-size: 10px; margin-left: 4px; }
    /* Hand tray (bottom): the control row — [▾ arrow] · filter chips · [» Skip] —
       is ALWAYS visible and docked; the ▾/▴ arrow shows/hides only the card
       carousel. There is no separate action bar in card mode. */
    .handbar { bottom: 16px; left: 12px; right: 12px; transform: none; max-width: none; padding: 8px 10px;
      display: flex; flex-direction: column; gap: 8px; align-items: stretch;
      background: linear-gradient(150deg, rgba(18,28,22,0.9), rgba(8,14,11,0.9));
      border: 1.5px solid rgba(130,230,166,0.45); border-radius: 14px;
      box-shadow: 0 0 14px -3px rgba(130,230,166,0.45), inset 0 0 0 1px rgba(130,230,166,0.12), 0 8px 22px -9px rgba(0,0,0,0.7);
      backdrop-filter: blur(6px); }
    /* hand header: just the selected/aiming chip (phone only) */
    .handhead { display: none; align-items: center; gap: 8px; width: 100%; }
    .handbody { display: flex; flex-direction: column; gap: 8px; align-items: stretch; width: 100%; }
    /* control row: arrow (left) · filters (fill/centre) · skip chip (right) */
    .handrow { display: flex; align-items: center; gap: 8px; width: 100%; }
    /* Card carousel + preview appear only when expanded (.open). */
    .handcarousel, .handpreview { display: none; }
    .handbar.open .handcarousel { display: flex; }
    .handbar.open .handpreview:not(.hidden) { display: block; }
    /* ▾/▴ show-hide arrow — a small round glass button at the row's left edge */
    /* ▾/▴ arrow + » Skip chip: sized to match the filter chips' height so the whole
       row aligns on one line (green-glass, like the chips). */
    .handtoggle { flex: 0 0 auto; width: 21px; height: 21px; padding: 0; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      background: rgba(40,54,48,0.9); color: var(--ink); border: 1px solid rgba(130,230,166,0.4); }
    .handtoggle:hover { border-color: rgba(170,255,205,0.6); background: rgba(52,70,60,0.95); }
    .handtoggle .htchev { font-size: 9px; line-height: 1; color: var(--accent); }
    /* » Skip chip — a small green-glass pill at the row's right edge: "»<cost>⚡".
       All three parts are vertically centred; the number + ⚡ are sized down. */
    .skipchip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 1px; font-family: inherit;
      font-weight: 700; color: var(--ink); cursor: pointer; white-space: nowrap; line-height: 1;
      padding: 3px 7px; border-radius: 999px; background: rgba(40,54,48,0.9);
      border: 1px solid rgba(130,230,166,0.4); }
    .skipchip:hover:not(:disabled) { border-color: rgba(170,255,205,0.6); background: rgba(52,70,60,0.95); }
    .skipchip:disabled { opacity: 0.45; cursor: not-allowed; }
    /* all three marks are box-centred SVG/text at ~13px so they line up cleanly; the
       negative margins trim the SVGs' internal viewBox whitespace so it reads tight */
    .skipchip .skgl { display: inline-flex; align-items: center; color: var(--accent); }
    .skipchip .skgl svg { width: 13px; height: 13px; display: block; margin: 0 -2px; }
    .skipchip .skn { font-size: 11px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
    .skipchip .ske { display: inline-flex; align-items: center; }
    .skipchip .ske svg { width: 13px; height: 13px; display: block; margin: 0 -2px; }
    .handsel { display: inline-flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0;
      padding: 5px 6px 5px 11px; border-radius: 11px; background: rgba(127,230,163,0.12);
      border: 1px solid rgba(130,230,166,0.55); color: var(--ink);
      box-shadow: 0 0 10px -3px rgba(130,230,166,0.5); }
    .handsel.hidden { display: none; }
    .handsel .hslabel { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.13em; color: var(--accent); flex: 0 0 auto; }
    .handsel .hsname { font-family: var(--serif); font-size: 14px; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
    .handsel .hscancel { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--panel-border);
      background: rgba(0,0,0,0.32); color: var(--ink-dim); cursor: pointer; font-size: 12px; line-height: 1; }
    .handsel .hscancel:active { background: rgba(224,106,106,0.35); color: #fff; }
    /* filter chips */
    /* Single scrollable row (never wraps) with a soft fade at both ends so the chips
       melt out near the ▾ minimize and » Skip buttons instead of ending abruptly.
       The 14px side padding parks the first/last chip just past the fade at rest. */
    .handfilter { display: flex; gap: 6px; flex-wrap: nowrap; justify-content: safe center; flex: 1 1 auto;
      min-width: 0; overflow-x: auto; padding: 0 14px; scrollbar-width: none;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); }
    .handfilter::-webkit-scrollbar { display: none; }
    .fchip { display: inline-flex; align-items: center; gap: 5px; font-family: inherit; font-size: 11px;
      padding: 3px 9px; border-radius: 999px; background: rgba(40,54,48,0.9); color: var(--ink-dim);
      border: 1px solid var(--panel-border); cursor: pointer; white-space: nowrap; }
    .fchip:hover { color: var(--ink); border-color: rgba(130,230,166,0.4); }
    .fchip.on { background: rgba(127,230,163,0.18); color: var(--accent); border-color: rgba(130,230,166,0.6); }
    .fchip .fn { font-size: 9px; opacity: 0.75; background: rgba(0,0,0,0.28); border-radius: 8px; padding: 0 4px; }
    /* Carousel: a single horizontal drag-scroll row on every platform (no nav
       buttons — you drag; Play Card lives in the bottom action bar). */
    .handcarousel { position: relative; align-items: center; gap: 8px; max-width: 100%; }   /* display gated by .handbar.open above; position:relative anchors the edge-fade nav arrows */
    .handlist { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; justify-content: flex-start;
      max-width: none; overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; scroll-snap-type: none; cursor: grab; }
    .handlist::-webkit-scrollbar { display: none; }
    .handlist:active { cursor: grabbing; }
    /* Carousel nav arrows — browser only (phones swipe). Overlaid on the carousel's
       left/right edges (so cards run full-width beneath them) with a dark→transparent
       fade so the edge cards melt out under the arrow instead of hitting a hard band. */
    .handnav { position: absolute; top: 0; bottom: 0; width: 54px; z-index: 5; cursor: pointer;
      display: inline-flex; align-items: center; font-size: 30px; line-height: 1;
      font-family: inherit; color: rgba(215,235,222,0.5); border: none; padding: 0; transition: color .15s; }
    .handnav.prev { left: 0; justify-content: flex-start; padding-left: 3px;
      background: linear-gradient(to right, rgba(9,14,11,0.92) 0%, rgba(9,14,11,0) 100%); }
    .handnav.next { right: 0; justify-content: flex-end; padding-right: 3px;
      background: linear-gradient(to left, rgba(9,14,11,0.92) 0%, rgba(9,14,11,0) 100%); }
    .handnav:hover { color: rgba(232,255,242,0.95); }
    .handnav[hidden] { display: none; }
    /* text-only preview of what a draw-engine (+5) card shuffles into the deck */
    .handpreview { width: 100%; max-width: 520px; text-align: center; padding: 8px 12px; border-radius: 10px;
      background: rgba(10,16,13,0.6); border: 1px solid rgba(130,230,166,0.3); }
    .handpreview.hidden { display: none; }
    .handpreview .hplabel { font-size: 12px; color: var(--accent); }
    .handpreview .hplabel b { color: #eafff2; }
    .handpreview .hpdesc { font-size: 12px; color: var(--ink); margin-top: 3px; line-height: 1.4; }
    .handpreview .hpname { color: #eafff2; }
    /* stack count badge (×N) */
    .stackn { position: absolute; top: 6px; right: 6px; z-index: 6; font-weight: 700; font-size: 11px; color: #eafff2;
      background: rgba(6,12,9,0.82); border: 1px solid rgba(130,230,166,0.5); border-radius: 10px; padding: 1px 6px;
      box-shadow: 0 0 6px rgba(0,0,0,0.6); }
    /* Portrait CCG card face: framed art window + name plate + full-text rules box.
       Card size is a FIXED 5:7 aspect (below); the rules font/box are tuned so every
       current card's full text fits (verified). Keep new cards' text within ~110
       chars or they'll clip against the fixed box. */
    /* Every card is a FIXED CCG shape (5:7) on every screen — size scales with the
       width but the proportions, the art window, and the text box never change. This
       takes priority over how many cards fit on screen. */
    .cardbtn, .offercard { position: relative; display: flex; flex-direction: column; align-items: stretch;
      aspect-ratio: 5 / 7;
      /* Per-category tint (border, glow, category text): Basic = green (default),
         Engine = muted red, Event = warm orange. --cacc is an "r,g,b" triplet. */
      --cacc: 130,230,166; --chi: 170,255,205; --cink: #7fe6a3;
      padding: 0; overflow: hidden; background: linear-gradient(158deg, #101a15, #070c0a 72%);
      border: 2px solid rgba(var(--cacc),0.5); border-radius: 14px; color: var(--ink);
      cursor: pointer; text-align: left; font-family: inherit;
      box-shadow: 0 0 9px -2px rgba(var(--cacc),0.45), inset 0 0 0 1px rgba(var(--cacc),0.16), 0 8px 18px -9px rgba(0,0,0,0.75);
      transition: transform .08s, box-shadow .08s, border-color .08s; }
    .cardbtn.cat-engine, .offercard.cat-engine { --cacc: 226,118,108; --chi: 244,158,148; --cink: #e58a7e; }
    .cardbtn.cat-event,  .offercard.cat-event  { --cacc: 240,166,94;  --chi: 255,200,150; --cink: #f0aa62; }
    .cardbtn { width: 172px; flex: 0 0 auto; align-self: flex-start; scroll-snap-align: center; }
    .cardbtn:hover:not(.unaff), .offercard:hover { border-color: rgba(var(--chi),0.85);
      box-shadow: 0 0 14px -1px rgba(var(--cacc),0.7), inset 0 0 0 1px rgba(var(--cacc),0.28), 0 10px 22px -9px rgba(0,0,0,0.85); }
    .offercard:hover { transform: translateY(-3px); }
    .cardbtn.unaff { opacity: 0.5; cursor: not-allowed; }
    .cardbtn.selected { border-color: #eafff2; box-shadow: 0 0 0 2px rgba(var(--cacc),0.9), 0 0 16px rgba(var(--cacc),0.6); }
    /* art window — inset so the dark frame shows around it, with an arched bottom.
       Fixed 3:2 aspect so every card's picture is the same size. */
    .cart { position: relative; margin: 6px 6px 0; aspect-ratio: 3 / 2; flex: 0 0 auto; overflow: hidden;
      border-radius: 10px 10px 30px 30px / 10px 10px 16px 16px;
      background: radial-gradient(circle at 50% 40%, #16241c, #060f0b);
      box-shadow: inset 0 0 0 1px rgba(var(--cacc),0.28), inset 0 -14px 20px -12px rgba(4,7,6,0.9); }
    /* pointer-events:none + no native image-drag so dragging the picture scrolls
       the carousel (and taps arm the card) instead of ghost-dragging the image. */
    .caimg { width: 100%; height: 100%; object-fit: cover; display: block;
      pointer-events: none; -webkit-user-drag: none; user-select: none; }
    .pips { position: absolute; top: 12px; left: 12px; z-index: 6; display: flex; flex-direction: column; gap: 4px; }
    .cplate { text-align: center; padding: 5px 9px 2px; flex: 0 0 auto; }
    .cplate .cn { font-family: var(--serif); font-size: 13.5px; font-weight: 600; line-height: 1.1; color: #eaf4ee;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6); display: block; }
    .cplate .ct { font-size: 8px; color: var(--cink); text-transform: uppercase; letter-spacing: 0.14em; margin-top: 2px; display: block; }
    /* rules box fills the remaining fixed height; text is sized to always fit. */
    .crules { margin: 2px 7px 8px; padding: 5px 8px; flex: 1 1 auto; min-height: 0; overflow: hidden;
      display: flex; align-items: flex-start; border: 1px solid rgba(var(--cacc),0.16); border-radius: 9px;
      background: linear-gradient(180deg, rgba(10,16,13,0.5), rgba(6,10,8,0.68));
      font-size: 10px; line-height: 1.3; color: #d3e2da; }
    .cc { font-size: 10px; font-weight: 700; border-radius: 5px; padding: 1px 5px; }
    .cc.e { color: var(--accent); background: rgba(127,230,163,0.14); }
    .cc.w { color: #7fd0e0; background: rgba(70,184,204,0.15); }
    .cc.n { color: #93cf52; background: rgba(147,207,82,0.15); }
    .cc.p { color: #c79be6; background: rgba(179,128,224,0.15); }
    .cc.free { color: var(--ink-dim); background: rgba(255,255,255,0.06); }
    .cc .ri { margin-left: 1px; }   /* cost-chip water/phosphorus mark */
    .handempty { color: var(--ink-dim); font-size: 12px; padding: 8px 12px; }
    /* Installed-card preview: click a ledger / actions row to float that card as a
       compact, fixed-shape CCG card — smaller picture, but the rules text keeps its
       normal size. A full-screen backdrop catches the next click and dismisses it. */
    .cardpop { position: fixed; inset: 0; z-index: 120; display: none; align-items: center; justify-content: center;
      background: rgba(6,10,8,0.5); padding: 20px; }
    .cardpop.show { display: flex; }
    /* IDENTICAL to a hand card (.cardbtn) — only centred in the overlay instead of
       pinned to the carousel's flex-start, non-interactive, and with a smaller art
       window (the rules box keeps its normal size + text). */
    .cardpop-card { align-self: center; cursor: default; max-width: calc(100vw - 40px); }
    .cardpop-card .cart { aspect-ratio: 5 / 2; }
    /* Card-draft overlay: pick 1 of 3 after finishing a food pile */
    .offer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(6,10,14,0.72); z-index: 50; padding: 16px; }
    .offer.hidden { display: none; }
    /* Minimized-draft chip: a small glowing 3-card fan parked above the carousel (left)
       while the draft is set aside. White by default; RED for an engine (red-leaf) draft.
       A gentle pulse marks the still-pending choice. Click to reopen the panel. */
    .offermin { position: fixed; z-index: 46; width: 46px; height: 40px; cursor: pointer;
      pointer-events: auto; animation: offerminPulse 1.7s ease-in-out infinite; }
    .offermin.hidden { display: none; }
    .offermin .omc { position: absolute; left: 50%; bottom: 3px; width: 16px; height: 22px;
      margin-left: -8px; border-radius: 3px; box-sizing: border-box; transform-origin: 50% 100%;
      background: rgba(9,15,12,0.92); border: 1.6px solid rgba(255,255,255,0.96);
      box-shadow: 0 0 10px rgba(255,255,255,0.7); }
    .offermin .omc:nth-child(1) { transform: rotate(-20deg); }
    .offermin .omc:nth-child(3) { transform: rotate(20deg); }
    .offermin.engine .omc { border-color: rgba(244,158,148,0.96); box-shadow: 0 0 10px rgba(226,118,108,0.8); }
    @keyframes offerminPulse { 0%, 100% { opacity: 0.72; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .offermin { animation: none; opacity: 0.92; } }
    /* Draft morph: glowing 3-card glyph flying up from the pile, each frame
       growing into a draft-card slot with its face revealing inside. */
    .draftmorph { position: fixed; z-index: 60; box-sizing: border-box; overflow: hidden;
      border: 1.8px solid rgba(255,255,255,0.96); background: rgba(9,15,12,0.86);
      box-shadow: 0 0 18px rgba(255,255,255,0.72), inset 0 0 14px rgba(255,255,255,0.22);
      pointer-events: none; }
    /* Engine caches read RED (matching engine cards) instead of mint. */
    .draftmorph.engine { border-color: rgba(244,158,148,0.96);
      box-shadow: 0 0 18px rgba(226,118,108,0.8), inset 0 0 14px rgba(226,118,108,0.26); }
    .draftmorph .dmclone { width: 100% !important; height: 100% !important; margin: 0 !important;
      border: none !important; box-shadow: none !important; background: transparent !important;
      opacity: 0; }   /* icon reads as a glowing outline until the face reveals (morph path animates this) */
    .offerbox { position: relative; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
      padding: 20px 22px; max-width: 720px; text-align: center; box-shadow: 0 12px 48px rgba(0,0,0,0.5); }
    /* Minimize (set-aside) button — top-left of the draft box. */
    .offermin-btn { position: absolute; top: 10px; left: 10px; width: 26px; height: 26px; display: flex;
      align-items: center; justify-content: center; padding: 0; font-size: 15px; line-height: 1;
      border-radius: 8px; cursor: pointer; color: var(--accent); background: rgba(40,54,48,0.85);
      border: 1px solid var(--panel-border); }
    .offermin-btn:hover { background: rgba(56,74,66,0.95); border-color: rgba(130,230,166,0.6); }
    .offerhelp { margin: 12px 0 0; }
    .offerbox h2 { font-size: 19px; margin: 0 0 6px; color: var(--accent); font-weight: 600; }
    .offerbox p { margin: 4px 0; color: var(--ink); font-size: 13px; }
    .offerbox p.dim { color: var(--ink-dim); }
    .offerbox p.small { font-size: 12px; }
    .offerrow { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
    .offercard { width: 172px; align-self: flex-start; }   /* same size as a hand card (.cardbtn) */
    /* a static (non-interactive) card face inside the confirm/preview overlay */
    .offercard.static { cursor: default; }
    .offercard.static:hover { transform: none; border-color: rgba(130,230,166,0.5);
      box-shadow: 0 0 9px -2px rgba(130,230,166,0.45), inset 0 0 0 1px rgba(130,230,166,0.16), 0 8px 18px -9px rgba(0,0,0,0.75); }
    /* Confirm/preview overlay (play a card / draft a card) */
    /* Draft selection + confirm */
    .offercard.selected { border-color: #eafff2; box-shadow: 0 0 0 2px rgba(130,230,166,0.9), 0 0 16px rgba(130,230,166,0.6); }
    .offercard.selected:hover { transform: translateY(-3px); }
    .offerpreview { margin: 14px auto 0; }
    .offerfooter { display: flex; justify-content: center; margin-top: 16px; }
    .offerfooter .btn.big { font-size: 14px; padding: 11px 24px; font-weight: 600; color: #06110a;
      background: linear-gradient(180deg, #9bf0b8, #57cf8c); border-color: rgba(155,240,184,0.9);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 0 18px -5px rgba(127,230,163,0.7); }
    .offerfooter .btn.big:hover:not(:disabled) { background: linear-gradient(180deg, #b6ffd0, #6ee0a0); }
    .offerfooter .btn.big:disabled { opacity: 1; color: var(--ink-dim);
      background: rgba(40,54,48,0.85); border-color: var(--panel-border); box-shadow: none; }
    /* Tempo-upgrade picker (choose which installed ability to speed up) */
    .offer.pick { z-index: 60; background: rgba(6,12,9,0.62); backdrop-filter: blur(2px); }
    .pickbox { max-width: 420px; width: min(92vw, 420px); }
    .picksub { color: var(--ink-dim); font-size: 12px; margin: 0 0 4px; }
    .pickrows { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; text-align: left; }
    .pickrow { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 11px 14px; border-radius: 11px; cursor: pointer; color: var(--ink);
      background: rgba(20,30,25,0.7); border: 1px solid var(--panel-border); transition: border-color .12s, background .12s, transform .06s; }
    .pickrow:hover { border-color: rgba(170,255,205,0.85); background: rgba(28,44,36,0.85); }
    .pickrow:active { transform: translateY(1px); }
    .picknm { font-weight: 600; font-size: 14px; }
    .pickwait { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pw-old { color: var(--ink-dim); text-decoration: line-through; }
    .pw-arrow { color: var(--ink-dim); }
    .pw-new { color: var(--accent); font-weight: 600; }
    .confirmbox { max-width: 560px; }
    .confirmbox .addslabel { margin-top: 14px; color: var(--accent); }
    .confirmbtns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
    .confirmbtns .btn { font-size: 14px; padding: 11px 20px; }
    .confirmbtns .btn.big { background: var(--accent); color: #06110a; border-color: var(--accent); font-weight: 600; }
    .confirmbtns .btn.big:hover:not(:disabled) { background: #9bf0b8; }
    .confirmbtns .confirmno { background: rgba(255,255,255,0.06); }
    /* PHONE PORTRAIT (and narrow windows): compact controls + a swipeable card carousel. */
    @media (max-width: 760px) {
      /* hide the hint here too — the carousel layout (lowered controls) starts at 760px,
         so leaving it at ≤720px let it overlap + swallow taps in the 721-760px band */
      .hint { display: none; }
      /* Compact top HUD (resource pill); the log drops down from it */
      .hud { top: 8px; left: 8px; right: auto; }
      .logdrop { max-width: min(80vw, 300px); }
      /* Phone: the pill is tappable to drop the engine ledger; the Actions dock
         moves in to match the compact HUD margins. */
      .hud .resrow { cursor: pointer; }
      .engledger { width: min(80vw, 260px); max-width: calc(100vw - 16px); max-height: 88vh; }
      .actionsdock { top: 8px; right: 8px; }
      .actmenu { max-width: calc(100vw - 16px); max-height: 88vh; }
      .loglist { font-size: 10px; line-height: 1.4; }
      /* Bottom cluster sits low, using the space under the controls (respect safe-area) */
      .actionbar { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 6px; right: 6px; transform: none;
        flex-direction: row; width: auto; gap: 6px; padding: 6px 8px; flex-wrap: nowrap; justify-content: space-between; }
      .actionbar .abgroup { flex-direction: row; width: auto; }
      .actionbar .abtn { min-height: 44px; padding: 5px 8px; }
      .actionbar .abtn .blabel { font-size: 12px; }
      .actionbar .abtn .bcost { font-size: 10.5px; }
      .handbar { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 6px; right: 6px; transform: none; max-width: none; padding: 6px; gap: 6px; }
      .handhead { display: flex; }              /* selected/aiming chip visible on phone */
      .handfilter { flex-wrap: nowrap; overflow-x: auto; justify-content: safe center; max-width: none;
        align-self: stretch; scrollbar-width: none; padding-bottom: 1px; }
      .handfilter::-webkit-scrollbar { display: none; }
      .handcarousel { align-self: stretch; }
      .handnav { display: none; }   /* phones swipe — no arrows */
      .handlist { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
        justify-content: flex-start; max-height: none; max-width: none; scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .handlist::-webkit-scrollbar { display: none; }
      /* Portrait cards keep the SAME fixed 5:7 shape as desktop (aspect-ratio from the
         base rule) — only the width scales. Uniform 3:2 picture, all text shown. */
      .cardbtn { width: min(46vw, 172px); flex: 0 0 auto; align-self: flex-start; scroll-snap-align: center; }
      .cardbtn .cart { height: auto; flex: 0 0 auto; }
      .cardbtn .crules { flex: 1 1 auto; min-height: 0; overflow: hidden; }
      .cardbtn .cplate .cn, .offercard .cplate .cn { font-size: 13.5px; }
      .cardbtn .crules, .offercard .crules { font-size: 10.5px; }
      .offerbox { padding: 14px; max-width: 94vw; }
      .offerrow { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; gap: 10px;
        /* overflow-x:auto forces overflow-y to clip, which would cut the SELECTED card's ring +
           glow at the top/bottom — pad so the highlight renders inside the scroll box. */
        padding: 15px 6px; margin-top: 4px;
        scroll-snap-type: x mandatory; scrollbar-width: none; }
      .offerrow::-webkit-scrollbar { display: none; }
      .offercard { width: min(46vw, 172px); flex: 0 0 auto; align-self: flex-start; scroll-snap-align: center; }
      .offercard .cart { height: auto; flex: 0 0 auto; }
      .offercard .crules { flex: 1 1 auto; min-height: 0; overflow: hidden; }
    }
    /* PHONE LANDSCAPE: almost no height — compact top panels, short card carousel. */
    @media (orientation: landscape) and (max-height: 520px) {
      .hint { display: none; }
      .hud { top: 6px; left: 6px; }
      .logdrop { max-width: min(60vw, 340px); }
      .logdrop .loglist { font-size: 9.5px; line-height: 1.35; max-height: 40vh; }
      .actionbar { bottom: 6px; left: 6px; right: 6px; transform: none; flex-direction: row; width: auto; gap: 5px; padding: 5px 7px; flex-wrap: nowrap; justify-content: space-between; }
      .actionbar .abgroup { flex-direction: row; width: auto; }
      .actionbar .abtn { min-height: 38px; padding: 4px 9px; }
      .actionbar .abtn .blabel { font-size: 11.5px; }
      .actionbar .abtn .bcost { font-size: 10px; }
      .handbar { bottom: 6px; left: 6px; right: 6px; transform: none; max-width: none; padding: 4px 6px; gap: 4px; }
      .handhead { display: flex; }
      .handfilter { flex-wrap: nowrap; overflow-x: auto; justify-content: safe center; align-self: stretch; scrollbar-width: none; }
      .handfilter::-webkit-scrollbar { display: none; }
      .fchip { font-size: 10px; padding: 2px 7px; }
      .handcarousel { align-self: stretch; }
      .handnav { display: none; }
      .handlist { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
        justify-content: flex-start; max-height: none; max-width: none; scroll-snap-type: x mandatory; scrollbar-width: none; }
      .handlist::-webkit-scrollbar { display: none; }
      /* Landscape phones: same fixed 5:7 shape, just a smaller width so a card fits
         the short viewport; text kept small so it still all shows. */
      .cardbtn { width: 132px; flex: 0 0 auto; align-self: flex-start; scroll-snap-align: center; }
      .cardbtn .cart, .offercard .cart { height: auto; flex: 0 0 auto; }
      .cardbtn .cplate, .offercard .cplate { padding: 4px 7px 1px; }
      .cardbtn .cplate .cn, .offercard .cplate .cn { font-size: 12px; }
      .cardbtn .crules, .offercard .crules { font-size: 8.5px; margin: 2px 6px 6px; padding: 4px 6px; line-height: 1.28; flex: 1 1 auto; min-height: 0; overflow: hidden; }
      .offercard { width: 132px; align-self: flex-start; }   /* same size as a hand card */
      .handpreview { padding: 5px 9px; }
      .handpreview .hplabel, .handpreview .hpdesc { font-size: 10px; }
    }

    /* ============================================================
       Start-of-run species picker — overlay shown before a run.
       Everything is namespaced (#speciesSelect / .ss-*) so it never
       collides with the in-game .card / .overlay UI above.
       ============================================================ */
    #speciesSelect {
      --ss-mint:#7fe6a3; --ss-mint-hi:#c8fff0; --ss-ink:#d7e6dc; --ss-ink-dim:#8aa193; --ss-ink-faint:#57685f;
      --ss-gold:#e6b45c; --ss-water:#7fd0e0; --ss-white-rim:rgba(226,238,232,0.9);
      --ss-serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
      --ss-sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
      position:fixed; inset:0; z-index:1000; overflow-y:auto; overscroll-behavior:contain;
      display:flex; justify-content:center; align-items:flex-start; padding:clamp(14px,3vw,40px);
      background:radial-gradient(120% 80% at 50% 118%, rgba(127,230,163,0.12), transparent 60%),
                 radial-gradient(90% 70% at 50% -20%, rgba(60,111,80,0.10), transparent 55%), #05070d;
      color:var(--ss-ink); font-family:var(--ss-sans); -webkit-font-smoothing:antialiased;
      animation:ssIn .5s ease both;
    }
    @keyframes ssIn { from { opacity:0; } to { opacity:1; } }
    #speciesSelect *, #speciesSelect *::before, #speciesSelect *::after { box-sizing:border-box; }

    .ss-dev { position:fixed; top:14px; right:16px; z-index:1003; cursor:pointer; font-family:var(--ss-sans);
      font-size:11.5px; font-weight:600; letter-spacing:.03em; color:var(--ss-ink-dim);
      background:rgba(12,18,15,0.8); border:1px dashed rgba(130,230,166,0.4); border-radius:999px;
      padding:6px 13px; backdrop-filter:blur(4px); }
    .ss-dev:hover { color:var(--ss-mint-hi); border-color:var(--ss-mint); background:rgba(18,28,22,0.9); }

    .ss-console { position:relative; width:min(1060px,100%);
      background:radial-gradient(140% 60% at 50% 0%, rgba(127,230,163,0.05), transparent 60%), #05070d;
      border:1.5px solid rgba(127,230,163,0.55); border-radius:18px;
      box-shadow:0 0 22px -2px rgba(127,230,163,0.45), 0 0 60px -10px rgba(127,230,163,0.35),
        inset 0 0 40px -14px rgba(127,230,163,0.18), 0 30px 80px -30px rgba(0,0,0,0.9); overflow:hidden; }

    .ss-head { padding:clamp(18px,3vw,30px) clamp(20px,4vw,44px) 18px; }
    .ss-eyebrow { font-size:11px; letter-spacing:0.34em; text-transform:uppercase; color:var(--ss-mint); font-weight:600;
      opacity:0.85; display:flex; align-items:center; gap:10px; }
    .ss-eyebrow::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, rgba(127,230,163,0.4), transparent); }
    .ss-head h1 { font-family:var(--ss-serif); font-weight:600; font-size:clamp(28px,5vw,44px); line-height:1.02;
      margin:12px 0 6px; color:#eaf6ee; text-wrap:balance; text-shadow:0 0 26px rgba(127,230,163,0.28); }
    .ss-lede { font-size:14px; color:var(--ss-ink-dim); max-width:62ch; line-height:1.5; margin:0; }
    .ss-lede b { color:var(--ss-ink); font-weight:600; }

    .ss-body { padding:6px clamp(20px,4vw,44px) clamp(28px,4vw,44px); }
    .ss-section { margin-top:clamp(22px,3vw,34px); }
    .ss-section:first-child { margin-top:8px; }
    .ss-rowlabel { display:flex; align-items:baseline; gap:12px; margin-bottom:14px; }
    .ss-lk { font-size:12px; letter-spacing:0.2em; text-transform:uppercase; font-weight:700; color:var(--ss-ink); }
    .ss-locked-label .ss-lk { color:var(--ss-ink-dim); font-weight:600; }
    .ss-badge { font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--ss-mint); font-weight:700;
      padding:3px 9px; border-radius:999px; border:1px solid rgba(127,230,163,0.35); background:rgba(127,230,163,0.08); }
    .ss-hint { font-size:12px; color:var(--ss-ink-faint); margin-left:auto; letter-spacing:.02em; }
    .ss-rule { flex:1; height:1px; background:rgba(120,160,140,0.14); align-self:center; }
    .ss-lock { color:var(--ss-ink-faint); font-size:12px; }

    .ss-grid { display:grid; gap:14px; grid-template-columns:repeat(4,1fr); }

    .ss-card { position:relative; aspect-ratio:16/10; border-radius:13px; overflow:hidden; text-align:left; padding:0;
      color:inherit; font:inherit; background:#04060a; border:1px solid var(--ss-white-rim); cursor:pointer;
      box-shadow:0 0 16px -3px rgba(216,232,226,0.35), 0 0 40px -12px rgba(200,255,240,0.28), 0 14px 30px -20px rgba(0,0,0,0.9);
      transition:transform .18s cubic-bezier(.2,.7,.2,1), box-shadow .22s, border-color .22s; }
    .ss-card:hover, .ss-card:focus-visible { transform:translateY(-4px); border-color:#fff; outline:none;
      box-shadow:0 0 22px -2px rgba(230,244,238,0.55), 0 0 60px -10px rgba(200,255,240,0.4), 0 22px 44px -22px rgba(0,0,0,0.95); }
    .ss-card-art { position:absolute; inset:0; }
    .ss-card-art img { width:100%; height:100%; object-fit:cover; display:block; filter:saturate(1.05) contrast(1.02); }
    .ss-card-art::after { content:""; position:absolute; inset:0;
      background:linear-gradient(180deg, transparent 38%, rgba(6,10,9,0.55) 66%, rgba(5,8,8,0.94) 100%); }
    .ss-card.warm .ss-card-art::after { background:linear-gradient(180deg, transparent 38%, rgba(12,9,6,0.55) 66%, rgba(9,6,4,0.94) 100%); }
    .ss-card-info { position:absolute; left:0; right:0; bottom:0; z-index:2; padding:9px 11px 10px; display:flex; flex-direction:column; gap:1px; }
    .ss-sp-name { font-family:var(--ss-serif); font-size:15.5px; font-weight:600; line-height:1.06; color:#eef7f1; text-shadow:0 1px 6px rgba(0,0,0,0.75); }
    .ss-sp-latin { font-family:var(--ss-serif); font-style:italic; font-size:10.5px; color:var(--ss-mint); opacity:0.92; text-shadow:0 1px 5px rgba(0,0,0,0.85); }
    .ss-card.warm .ss-sp-latin { color:var(--ss-gold); }
    .ss-choose { position:absolute; top:8px; right:9px; z-index:3; font-size:9.5px; font-weight:700; letter-spacing:0.1em;
      text-transform:uppercase; color:var(--ss-mint); background:rgba(5,9,8,0.7); border:1px solid rgba(127,230,163,0.4);
      border-radius:999px; padding:3px 8px; backdrop-filter:blur(3px); opacity:0; transform:translateY(-3px); transition:opacity .2s, transform .2s; }
    .ss-card.warm .ss-choose { color:var(--ss-gold); border-color:rgba(230,180,92,0.45); }
    .ss-card:hover .ss-choose, .ss-card:focus-visible .ss-choose { opacity:1; transform:none; }

    .ss-card.ss-locked { border-color:rgba(120,160,140,0.22);
      box-shadow:0 0 0 1px rgba(255,255,255,0.02), 0 12px 26px -18px rgba(0,0,0,0.9); }
    .ss-card.ss-locked .ss-card-art img { filter:grayscale(0.45) brightness(0.52) saturate(0.75); }
    .ss-card.ss-locked .ss-card-art::after { background:linear-gradient(180deg, rgba(6,10,9,0.35) 20%, rgba(5,8,8,0.92) 100%); }
    .ss-card.ss-locked .ss-sp-name { color:#cbdbd1; }
    .ss-card.ss-locked .ss-sp-latin { color:var(--ss-ink-dim); }
    .ss-card.ss-locked:hover, .ss-card.ss-locked:focus-visible { transform:translateY(-3px); border-color:rgba(127,230,163,0.5);
      box-shadow:0 0 16px -6px rgba(127,230,163,0.4), 0 18px 32px -20px rgba(0,0,0,0.95); }
    .ss-lockbadge { position:absolute; top:8px; left:8px; z-index:3; display:inline-flex; align-items:center; gap:5px;
      font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ss-mint);
      background:rgba(5,9,8,0.72); border:1px solid rgba(127,230,163,0.4); border-radius:999px; padding:3px 9px 3px 8px; backdrop-filter:blur(3px); }

    /* no display:flex on the box — Safari lets a flex child's min-height override
       aspect-ratio (→ "?" cards taller than the available cards). Match .ss-card's
       box model: aspect-ratio only, with the ? absolutely centred. */
    .ss-lock-card { position:relative; aspect-ratio:16/10; border-radius:13px; overflow:hidden;
      background:radial-gradient(90% 120% at 50% 40%, rgba(24,34,30,0.5), rgba(6,9,14,0.85)); border:1px solid rgba(120,160,140,0.16); }
    .ss-q { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-family:var(--ss-serif); font-size:clamp(30px,6vw,44px); font-weight:700; color:rgba(127,230,163,0.55);
      text-shadow:0 0 14px rgba(127,230,163,0.45), 0 0 30px rgba(127,230,163,0.25); animation:ssQ 4.2s ease-in-out infinite; }
    .ss-lock-card:nth-child(3n) .ss-q { animation-delay:-1.4s; } .ss-lock-card:nth-child(3n+1) .ss-q { animation-delay:-2.6s; }
    @keyframes ssQ { 0%,100% { opacity:0.5; } 50% { opacity:0.95; } }

    .ss-detailwrap { position:fixed; inset:0; z-index:1002; display:flex; align-items:center; justify-content:center;
      padding:clamp(12px,3vw,36px); background:rgba(3,5,9,0.72); backdrop-filter:blur(7px);
      opacity:0; visibility:hidden; transition:opacity .28s, visibility .28s; }
    .ss-detailwrap.open { opacity:1; visibility:visible; }
    .ss-detail { position:relative; width:min(880px,100%); max-height:calc(100vh - clamp(24px,6vw,72px)); display:grid; grid-template-columns:42% 1fr; grid-template-rows:minmax(0,1fr);
      background:linear-gradient(160deg, rgba(15,22,20,0.96), rgba(7,11,10,0.98)); border:1.5px solid var(--ss-white-rim); border-radius:18px; overflow:hidden;
      box-shadow:0 0 26px -2px rgba(230,244,238,0.4), 0 0 80px -16px rgba(200,255,240,0.35), 0 40px 90px -30px rgba(0,0,0,0.95);
      transform:translateY(14px) scale(.97); opacity:0; transition:transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s; }
    .ss-detailwrap.open .ss-detail { transform:none; opacity:1; }
    .ss-detail.warm { border-color:rgba(240,210,150,0.75); box-shadow:0 0 26px -2px rgba(240,200,130,0.4), 0 0 80px -16px rgba(224,162,74,0.3), 0 40px 90px -30px rgba(0,0,0,0.95); }
    .ss-detail.aqua { border-color:rgba(150,215,230,0.7); box-shadow:0 0 26px -2px rgba(150,215,230,0.4), 0 0 80px -16px rgba(127,208,224,0.3), 0 40px 90px -30px rgba(0,0,0,0.95); }
    .ss-detail.spore { border-color:rgba(205,175,235,0.7); box-shadow:0 0 26px -2px rgba(205,175,235,0.4), 0 0 80px -16px rgba(199,155,230,0.3), 0 40px 90px -30px rgba(0,0,0,0.95); }

    .ss-d-art { position:relative; background:#04060a; min-height:220px; }
    .ss-d-art img { width:100%; height:100%; object-fit:cover; display:block; }
    .ss-d-art::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 60%, rgba(7,11,10,0.7)), linear-gradient(90deg, transparent 72%, rgba(7,11,10,0.9)); }
    .ss-d-body { padding:clamp(18px,2.6vw,28px); overflow-y:auto; min-height:0; display:flex; flex-direction:column; gap:14px; }
    .ss-d-name { font-family:var(--ss-serif); font-size:clamp(24px,3.4vw,32px); font-weight:600; line-height:1.04; color:#eef7f1; }
    .ss-d-latin { font-family:var(--ss-serif); font-style:italic; font-size:13.5px; color:var(--ss-mint); margin-top:2px; }
    .ss-detail.warm .ss-d-latin { color:var(--ss-gold); }
    .ss-detail.aqua .ss-d-latin { color:#9fdcea; }
    .ss-detail.spore .ss-d-latin { color:#d6bff0; }
    .ss-d-blurb { font-size:14px; line-height:1.62; color:var(--ss-ink-dim); margin:0; }
    .ss-d-blurb b { color:var(--ss-ink); font-weight:600; }

    .ss-hand { border-top:1px solid rgba(120,160,140,0.16); padding-top:14px; }
    .ss-hand h3 { font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--ss-mint); margin:0 0 4px; font-weight:700; }
    .ss-sub { font-size:12px; color:var(--ss-ink-faint); margin:0 0 12px; }
    .ss-resprow { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .ss-respill { display:inline-flex; align-items:center; gap:6px; padding:5px 12px 5px 9px; border-radius:999px;
      background:linear-gradient(150deg, rgba(18,28,22,0.9), rgba(8,14,11,0.9)); border:1.5px solid rgba(130,230,166,0.4); font-variant-numeric:tabular-nums; }
    .ss-respill .ss-ri { width:16px; height:16px; flex:0 0 auto; }
    .ss-rv { font-weight:700; font-size:15px; }
    .ss-rk { font-size:11px; color:var(--ss-ink-dim); letter-spacing:.02em; }
    .ss-respill.energy { border-color:rgba(230,180,92,0.45); } .ss-respill.energy .ss-rv { color:var(--ss-gold); }
    .ss-respill.water { border-color:rgba(127,208,224,0.45); } .ss-respill.water .ss-rv { color:var(--ss-water); }
    .ss-respill.phos { border-color:rgba(199,155,230,0.45); } .ss-respill.phos .ss-rv { color:#c79be6; }

    .ss-deck { display:flex; flex-wrap:wrap; gap:16px 22px; padding:2px 8px 8px 0; }
    .ss-gc { position:relative; width:116px; aspect-ratio:5/7; flex:0 0 auto; border-radius:10px; overflow:hidden; display:flex; flex-direction:column;
      background:linear-gradient(162deg, rgba(20,28,26,0.92), rgba(8,13,12,0.97)); border:1px solid rgba(150,180,165,0.32);
      box-shadow:0 0 12px -4px rgba(127,230,163,0.4), 0 10px 22px -14px rgba(0,0,0,0.9); }
    .ss-detail.warm .ss-gc { border-color:rgba(230,180,92,0.34); box-shadow:0 0 12px -4px rgba(230,180,92,0.4), 0 10px 22px -14px rgba(0,0,0,0.9); }
    .ss-detail.aqua .ss-gc { border-color:rgba(127,208,224,0.32); box-shadow:0 0 12px -4px rgba(127,208,224,0.4), 0 10px 22px -14px rgba(0,0,0,0.9); }
    .ss-detail.spore .ss-gc { border-color:rgba(199,155,230,0.32); box-shadow:0 0 12px -4px rgba(199,155,230,0.4), 0 10px 22px -14px rgba(0,0,0,0.9); }
    .ss-gc.ss-multi { box-shadow:3px 3px 0 -1px rgba(10,15,13,0.96), 3px 3px 0 0 rgba(150,180,165,0.22),
      6px 6px 0 -1px rgba(8,12,11,0.96), 6px 6px 0 0 rgba(150,180,165,0.16), 0 10px 22px -14px rgba(0,0,0,0.9); }
    .ss-gc-art { position:relative; aspect-ratio:3/2; overflow:hidden; background:#04060a; flex:0 0 auto; }
    .ss-gc-art img { width:100%; height:100%; object-fit:cover; display:block; }
    .ss-gc-art::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 64%, rgba(8,13,12,0.92)); }
    .ss-gc-name { font-family:var(--ss-serif); font-size:11.5px; font-weight:600; line-height:1.12; color:#eef7f1; padding:6px 8px 3px; }
    .ss-gc-eff { font-size:9px; line-height:1.34; color:var(--ss-ink-dim); padding:0 8px 8px; flex:1 1 auto; overflow:hidden;
      display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; }
    .ss-gc-count { position:absolute; top:6px; right:6px; z-index:3; font-size:10.5px; font-weight:700; font-variant-numeric:tabular-nums;
      color:var(--ss-mint); background:rgba(5,9,8,0.82); border:1px solid rgba(127,230,163,0.5); border-radius:999px; padding:2px 7px; box-shadow:0 0 10px -3px rgba(127,230,163,0.5); }
    .ss-detail.warm .ss-gc-count { color:var(--ss-gold); border-color:rgba(230,180,92,0.5); box-shadow:0 0 10px -3px rgba(230,180,92,0.5); }
    .ss-detail.aqua .ss-gc-count { color:#9fdcea; border-color:rgba(127,208,224,0.5); box-shadow:0 0 10px -3px rgba(127,208,224,0.5); }
    .ss-detail.spore .ss-gc-count { color:#d6bff0; border-color:rgba(199,155,230,0.5); box-shadow:0 0 10px -3px rgba(199,155,230,0.5); }
    .ss-gc-type { position:absolute; bottom:6px; left:6px; z-index:3; font-size:8px; letter-spacing:.12em; text-transform:uppercase; color:var(--ss-ink);
      background:rgba(5,9,8,0.7); border:1px solid rgba(120,160,140,0.3); border-radius:5px; padding:2px 5px; }
    .ss-cost { position:absolute; top:6px; left:6px; z-index:3; display:inline-flex; gap:4px; }
    .ss-cpip { display:inline-flex; align-items:center; gap:2px; font-size:10.5px; font-weight:700; font-variant-numeric:tabular-nums; color:#bfeaf2;
      background:rgba(5,9,8,0.82); border:1px solid rgba(127,208,224,0.5); border-radius:999px; padding:2px 6px 2px 5px; box-shadow:0 0 8px -3px rgba(127,208,224,0.45); }
    .ss-cpip.p { color:#dcc4f2; border-color:rgba(199,155,230,0.5); box-shadow:0 0 8px -3px rgba(199,155,230,0.45); }
    .ss-cost .ss-ri { width:12px; height:12px; }

    .ss-actions { display:flex; gap:10px; margin-top:4px; padding-top:14px; border-top:1px solid rgba(120,160,140,0.16); }
    .ss-btn { flex:1; font:inherit; cursor:pointer; border-radius:13px; padding:13px 16px; font-size:14px; font-weight:600; letter-spacing:.01em;
      transition:background .16s, border-color .16s, box-shadow .16s, transform .06s; }
    .ss-btn:active { transform:translateY(1px); }
    .ss-btn.ghost { background:rgba(255,255,255,0.03); border:1px solid rgba(120,160,140,0.3); color:var(--ss-ink); }
    .ss-btn.ghost:hover { background:rgba(255,255,255,0.07); border-color:rgba(160,190,175,0.5); }
    .ss-btn.primary { flex:1.6; color:#06120b; border:1px solid rgba(127,230,163,0.5);
      background:linear-gradient(180deg, #a9f2c4, #6fdc9a); box-shadow:0 0 18px -3px rgba(127,230,163,0.6), inset 0 1px 0 rgba(255,255,255,0.4); }
    .ss-btn.primary:hover { background:linear-gradient(180deg, #bdf7d3, #7fe6a3); box-shadow:0 0 26px -2px rgba(127,230,163,0.8), inset 0 1px 0 rgba(255,255,255,0.5); }
    .ss-detail.warm .ss-btn.primary { color:#1c1204; border-color:rgba(230,180,92,0.55); background:linear-gradient(180deg, #f4d79a, #e6b45c); box-shadow:0 0 18px -3px rgba(230,180,92,0.6), inset 0 1px 0 rgba(255,255,255,0.4); }
    .ss-detail.aqua .ss-btn.primary { color:#06181c; border-color:rgba(127,208,224,0.55); background:linear-gradient(180deg, #bfeaf2, #7fd0e0); box-shadow:0 0 18px -3px rgba(127,208,224,0.6), inset 0 1px 0 rgba(255,255,255,0.4); }
    .ss-detail.spore .ss-btn.primary { color:#150c1c; border-color:rgba(199,155,230,0.55); background:linear-gradient(180deg, #e6d4f5, #c79be6); box-shadow:0 0 18px -3px rgba(199,155,230,0.6), inset 0 1px 0 rgba(255,255,255,0.4); }
    .ss-detail .ss-btn.primary.is-locked { background:rgba(30,40,36,0.7); color:var(--ss-ink-dim); border-color:rgba(120,160,140,0.28); box-shadow:none; cursor:not-allowed; }

    .ss-close { position:absolute; top:12px; right:12px; z-index:3; width:34px; height:34px; border-radius:999px; cursor:pointer;
      background:rgba(6,10,14,0.7); border:1px solid rgba(160,190,175,0.35); color:var(--ss-ink); font-size:18px; line-height:1;
      display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    .ss-close:hover { background:rgba(20,28,26,0.9); border-color:var(--ss-mint); color:var(--ss-mint-hi); }

    /* between-level: level-complete / game-won panel (reuses the .ss-detailwrap backdrop) */
    .ss-lc { position:relative; width:min(560px,100%); max-height:calc(100vh - clamp(24px,6vw,72px)); overflow-y:auto;
      background:linear-gradient(160deg, rgba(15,22,20,0.97), rgba(7,11,10,0.99)); border:1.5px solid rgba(127,230,163,0.55);
      border-radius:18px; padding:clamp(22px,3.5vw,34px); text-align:center;
      box-shadow:0 0 26px -2px rgba(127,230,163,0.45), 0 0 80px -16px rgba(127,230,163,0.3), 0 40px 90px -30px rgba(0,0,0,0.95);
      transform:translateY(14px) scale(.97); opacity:0; animation:ssLcIn .34s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes ssLcIn { to { transform:none; opacity:1; } }
    .ss-lc-badge { display:inline-block; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; font-weight:700;
      color:var(--ss-mint); border:1px solid rgba(127,230,163,0.4); background:rgba(127,230,163,0.08);
      border-radius:999px; padding:4px 12px; margin-bottom:14px; }
    .ss-lc-title { font-family:var(--ss-serif); font-size:clamp(22px,3.4vw,30px); font-weight:600; line-height:1.1;
      color:#eef7f1; margin:0 0 10px; text-wrap:balance; }
    .ss-lc-sub { font-size:14px; line-height:1.55; color:var(--ss-ink-dim); margin:0 auto; max-width:46ch; }
    .ss-lc-unlock-head { margin:18px 0 5px; font-family:var(--ss-serif); font-size:clamp(20px,2.7vw,25px);
      font-weight:600; color:#eef7f1; letter-spacing:.01em; display:flex; align-items:center; justify-content:center; gap:9px; }
    .ss-lc-star { color:var(--ss-mint); font-size:0.9em; text-shadow:0 0 14px rgba(127,230,163,0.85); }
    .ss-lc-unlock-sub { margin:0 auto; font-size:13.5px; line-height:1.5; color:var(--ss-ink-dim); max-width:46ch; }
    .ss-lc-cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 188px)); justify-content:center; gap:14px; margin:14px auto 4px; max-width:420px; }
    .ss-lc-actions { margin-top:22px; display:flex; justify-content:center; }
    .ss-lc-actions .ss-btn { flex:0 0 auto; min-width:240px; }

    /* TEMP dev button: instantly clear the current level (amber dashed = dev affordance) */
    #devWin { position:fixed; top:14px; right:14px; z-index:31; cursor:pointer;
      font:600 11.5px "Segoe UI", system-ui, sans-serif; letter-spacing:.03em; color:#e6cf9a;
      background:rgba(14,18,12,0.82); border:1px dashed rgba(230,180,92,0.6); border-radius:999px;
      padding:6px 12px; backdrop-filter:blur(4px); }
    #devWin:hover { color:#fff; border-color:#e6b45c; background:rgba(24,26,18,0.92); }

    /* HUD campaign level chip (top-centre, non-interactive) */
    #levelChip { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:26; pointer-events:none;
      font-family:"Segoe UI", system-ui, sans-serif; font-size:12px; font-weight:700; letter-spacing:0.12em;
      text-transform:uppercase; color:#bfeecb; background:linear-gradient(150deg, rgba(18,28,22,0.92), rgba(8,14,11,0.92));
      border:1.5px solid rgba(130,230,166,0.5); border-radius:999px; padding:6px 14px;
      box-shadow:0 0 14px -3px rgba(127,230,163,0.5), 0 6px 20px -8px rgba(0,0,0,0.7); backdrop-filter:blur(6px); }

    @media (max-width:720px) {
      .ss-grid { grid-template-columns:repeat(2,1fr); }
      .ss-detail { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
      .ss-d-art { max-height:34vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      #speciesSelect, #speciesSelect * { animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
