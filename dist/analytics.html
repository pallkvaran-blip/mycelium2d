<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mycelium — Run Analytics</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0f0d; color: #e7efe9;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 24px 8px; }
  h1 { margin: 0 0 2px; font-size: 20px; letter-spacing: .01em; }
  .sub { color: #7f948a; font-size: 13px; }
  .bar-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  button { font: inherit; font-size: 13px; font-weight: 600; color: #0b0f0d; background: #6fe0b0;
    border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button:hover { background: #86ecc1; }
  main { padding: 8px 24px 48px; max-width: 1000px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 14px 0 26px; }
  .tile { background: #12181500; background: #121a16; border: 1px solid #1f2a24; border-radius: 12px; padding: 14px 16px; }
  .tile .n { font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
  .tile .l { color: #8aa093; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
  section { margin: 26px 0; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: #9fb5a8; margin: 0 0 12px;
    border-bottom: 1px solid #1f2a24; padding-bottom: 8px; }
  .row { display: grid; grid-template-columns: 175px 1fr 56px; align-items: center; gap: 10px; margin: 5px 0; }
  .row .k { color: #cfe0d6; font-size: 13px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .v { color: #cfe0d6; font-size: 13px; font-weight: 700; }
  .track { background: #182420; border-radius: 6px; height: 18px; overflow: hidden; }
  .fill { height: 100%; background: linear-gradient(90deg, #2e7d5b, #6fe0b0); border-radius: 6px; min-width: 2px; }
  .fill.warn { background: linear-gradient(90deg, #7d552e, #e0a86f); }
  .muted { color: #7f948a; }
  .note { background: #121a16; border: 1px solid #1f2a24; border-radius: 12px; padding: 16px 18px; margin: 16px 0; }
  code, pre { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  pre { background: #0e1512; border: 1px solid #1f2a24; border-radius: 10px; padding: 14px; overflow: auto; color: #bcd; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #16211c; white-space: nowrap; }
  th { color: #8aa093; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
  .err { color: #e0a86f; }
</style>
</head>
<body>
<header>
  <h1>Mycelium — Run Analytics</h1>
  <div class="sub">Anonymous run telemetry (no names). Reads the Supabase <code>events</code> table.</div>
  <div class="bar-top">
    <button id="refresh">Refresh</button>
    <span class="sub" id="status">Loading…</span>
  </div>
</header>
<main id="out"></main>

<script id="speciesNames" type="application/json">{"marasmius":"Fairy Ring Champignon","armillaria":"Honey Fungus","ganoderma":"Artist's Conk","pleurotus":"Oyster Mushroom","suillus":"Slippery Jack","schizophyllum":"Split Gill","hydnellum":"Bleeding Tooth Fungus","stropharia":"Wine Cap","cortinarius":"Violet Webcap","serpula":"Dry Rot","scleroderma":"Earthball","psilocybe":"Magic Mushroom"}</script>
<script>
'use strict';
// Same public Supabase project as the game (anon key is safe to expose; read-only here).
var G = (typeof globalThis !== 'undefined' && globalThis.MYCELIUM_SUPABASE) || {};
var URL_ = G.url || 'https://daebrdzdoewpuedhxwud.supabase.co';
var KEY = G.anonKey || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhZWJyZHpkb2V3cHVlZGh4d3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzcwNDAsImV4cCI6MjEwMDI1MzA0MH0.sOYQLy4_IedoR3mEX_-kxheXvRUYt3N4evxz_wUU8Uw';
var out = document.getElementById('out');
var statusEl = document.getElementById('status');
var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
// Species id -> common name (injected by build.mjs; falls back to the id).
var SPECIES_NAMES = {};
try { SPECIES_NAMES = JSON.parse(document.getElementById('speciesNames').textContent || '{}'); } catch (e) {}
var spName = function (id) { return (id && SPECIES_NAMES[id]) || id || '—'; };
// Friendly labels for death causes (run_end.cause when it isn't 'won').
var CAUSE_LABELS = { water: 'Ran out of water', energy: 'Ran out of energy', nocards: 'Ran out of cards',
  infected: 'Mould (Trichoderma)', devoured: 'Eaten by worms/ants', abandon: 'Abandoned run',
  starved: 'Ran out of energy', stall: 'Stuck (no moves)', died: 'Other / unknown' };   // starved/stall = legacy aliases
var causeLabel = function (c) { return CAUSE_LABELS[c] || c || 'Unknown'; };

var SETUP_SQL =
  "create table if not exists public.events (\n" +
  "  id bigint generated always as identity primary key,\n" +
  "  created_at timestamptz not null default now(),\n" +
  "  client_id text, session_id text,\n" +
  "  kind text not null,          -- run_start | level_clear | run_end | purchase\n" +
  "  species text, level int, cause text, turns int\n" +
  ");\n" +
  "alter table public.events enable row level security;\n" +
  "create policy events_insert on public.events for insert to anon with check (\n" +
  "  char_length(kind) <= 24 and coalesce(char_length(species),0) <= 32\n" +
  "  and coalesce(level,0) between 0 and 1000 );\n" +
  "create policy events_read on public.events for select to anon using (true);";

function fetchEvents() {
  statusEl.textContent = 'Loading…';
  var url = URL_.replace(/\/+$/, '') + '/rest/v1/events?select=created_at,client_id,session_id,kind,species,level,cause,turns&order=created_at.desc&limit=10000';
  return fetch(url, { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

function bar(k, v, max, warn) {
  var pct = max > 0 ? Math.round(v / max * 100) : 0;
  return '<div class="row"><div class="k">' + esc(k) + '</div>' +
    '<div class="track"><div class="fill' + (warn ? ' warn' : '') + '" style="width:' + pct + '%"></div></div>' +
    '<div class="v">' + v + '</div></div>';
}
function tile(n, l) { return '<div class="tile"><div class="n">' + n + '</div><div class="l">' + esc(l) + '</div></div>'; }
function countBy(arr, keyFn) { var m = {}; arr.forEach(function (e) { var k = keyFn(e); if (k == null) return; m[k] = (m[k] || 0) + 1; }); return m; }
function sortedEntries(m) { return Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1]; }); }

// ---- New-player funnel + retention (per-player first-run reconstruction) ----
var UPDATE_TS = Date.parse('2026-07-23T19:40:00Z');   // Jul 23 update: starter-hand buff + death-carry (one deploy)
var isDeath = function (c) { return !!c && c !== 'won'; };
function median(a) { if (!a.length) return null; var b = a.slice().sort(function (x, y) { return x - y; }); var m = Math.floor(b.length / 2); return b.length % 2 ? b[m] : Math.round((b[m - 1] + b[m]) / 2); }

// One record per player, describing their FIRST run (first run_start -> next run_start).
function firstRuns(rows) {
  var by = {};
  rows.forEach(function (e) { if (e.client_id) (by[e.client_id] = by[e.client_id] || []).push(e); });
  var out = [];
  Object.keys(by).forEach(function (cid) {
    var evs = by[cid].slice().sort(function (a, b) { return Date.parse(a.created_at) - Date.parse(b.created_at); });
    var s0 = -1; for (var i = 0; i < evs.length; i++) { if (evs[i].kind === 'run_start') { s0 = i; break; } }
    if (s0 < 0) return;
    var s1 = evs.length; for (var j = s0 + 1; j < evs.length; j++) { if (evs[j].kind === 'run_start') { s1 = j; break; } }
    var start = evs[s0], run = evs.slice(s0, s1), maxClear = 0, end = null;
    run.forEach(function (e) {
      if (e.kind === 'level_clear' && (e.level || 0) > maxClear) maxClear = e.level || 0;
      if (e.kind === 'run_end' && !end) end = e;
    });
    if (end && (end.level || 1) - 1 > maxClear) maxClear = (end.level || 1) - 1;   // died on L>=2 => cleared L1
    out.push({
      client: cid,
      species: start.species || '—', startMs: Date.parse(start.created_at), startLevel: start.level || 1,
      maxClear: maxClear, clearedL1: maxClear >= 1, leftMid: !end,
      endCause: end ? end.cause : null, turns: end ? (end.turns || 0) : null,
      returned: s1 < evs.length, sameSess: s1 < evs.length && evs[s1].session_id === start.session_id,
      nEvents: evs.length
    });
  });
  return out;
}

function retentionPanel(rows) {
  var fr = firstRuns(rows), N = fr.length;
  if (!N) return '';
  var html = '';

  // Funnel — share of new players whose FIRST run cleared >= L levels.
  var maxDepth = fr.reduce(function (m, r) { return Math.max(m, r.maxClear); }, 0);
  var fun = bar('Started first run', N, N);
  for (var L = 1; L <= Math.min(maxDepth, 10); L++) {
    fun += bar('Cleared level ' + L + '+', fr.filter(function (r) { return r.maxClear >= L; }).length, N, L === 1);
  }
  html += '<section><h2>New-player funnel (how deep the first run gets)</h2>' + fun +
    '<div class="muted" style="margin-top:8px">' + pct(fr.filter(function (r) { return r.clearedL1; }).length, N) +
    ' of ' + N + ' new players clear level 1 on their first run. The gap from “Started” to “Cleared level 1+” is the level-1 drop-off.</div></section>';

  // First run on level 1 — outcome split.
  var l1 = fr.filter(function (r) { return r.startLevel === 1; });
  var cl = l1.filter(function (r) { return r.clearedL1; }).length;
  var diedL1 = l1.filter(function (r) { return !r.clearedL1 && !r.leftMid; }).length;
  var leftL1 = l1.filter(function (r) { return !r.clearedL1 && r.leftMid; }).length;
  var oMax = Math.max(cl, diedL1, leftL1, 1);
  html += '<section><h2>First run on level 1 — what happens</h2>' +
    bar('Cleared level 1', cl, oMax) + bar('Died on level 1', diedL1, oMax, true) +
    bar('Left mid-level-1 (closed tab)', leftL1, oMax, true) +
    '<div class="muted" style="margin-top:8px">' + pct(leftL1, l1.length) +
    ' of new players close the tab during level 1 without finishing it — the biggest single leak (death-carry can’t reach them; they never die).</div></section>';

  // After a first-run death — did they come back? (death-carry KPI)
  var deaths = fr.filter(function (r) { return isDeath(r.endCause); });
  var ret = deaths.filter(function (r) { return r.returned; }).length;
  var retSame = deaths.filter(function (r) { return r.sameSess; }).length;
  html += '<section><h2>After a first-run death — did they come back?</h2>' +
    bar('Died on first run', deaths.length, deaths.length || 1, true) +
    bar('Played another run', ret, deaths.length || 1) +
    bar('…same session (Next-run button)', retSame, deaths.length || 1) +
    '<div class="muted" style="margin-top:8px">' + pct(ret, deaths.length) +
    ' of players who die on their first run play again — the death-carry retention KPI.</div></section>';

  // Before vs after the Jul 23 update.
  function grp(pred) {
    var g = fr.filter(pred), l1g = g.filter(function (r) { return r.startLevel === 1; }), dg = g.filter(function (r) { return isDeath(r.endCause); });
    // engagement gauge: turns survived among deaths that happened ON level 1 (didn't clear it)
    var mt = dg.filter(function (r) { return r.turns != null && !r.clearedL1; }).map(function (r) { return r.turns; });
    return { n: g.length,
      clr: l1g.length ? Math.round(l1g.filter(function (r) { return r.clearedL1; }).length / l1g.length * 100) : null,
      ret: dg.length ? Math.round(dg.filter(function (r) { return r.returned; }).length / dg.length * 100) : null,
      bounce: g.length ? Math.round(g.filter(function (r) { return r.nEvents === 1; }).length / g.length * 100) : null,
      med: median(mt) };
  }
  var bfr = grp(function (r) { return r.startMs < UPDATE_TS; }), aft = grp(function (r) { return r.startMs >= UPDATE_TS; });
  var cell = function (v, suf) { return v == null ? '<td class="muted">—</td>' : '<td>' + v + (suf || '') + '</td>'; };
  html += '<section><h2>Before vs after the Jul 23 update</h2>' +
    '<table><thead><tr><th>Metric</th><th>Before</th><th>After</th></tr></thead><tbody>' +
    '<tr><td>New players</td>' + cell(bfr.n) + cell(aft.n) + '</tr>' +
    '<tr><td>Cleared level 1</td>' + cell(bfr.clr, '%') + cell(aft.clr, '%') + '</tr>' +
    '<tr><td>First-death → returned</td>' + cell(bfr.ret, '%') + cell(aft.ret, '%') + '</tr>' +
    '<tr><td>Instant bounce (1 event)</td>' + cell(bfr.bounce, '%') + cell(aft.bounce, '%') + '</tr>' +
    '<tr><td>Median turns at level-1 death</td>' + cell(bfr.med) + cell(aft.med) + '</tr>' +
    '</tbody></table>' +
    '<div class="note" style="margin-top:12px"><b>Read with care.</b> The starter-hand buff and death-carry shipped in the <i>same</i> deploy, so their effects can’t be separated here. The “after” window also drew lower-intent traffic (instant-bounce rose), which drags clear-rate down independently of difficulty — “median turns at level-1 death” gauges real engagement. Samples are small; watch these stabilise over more days.</div></section>';

  // Level-1 drop-off by starting species.
  var bySp = {};
  l1.forEach(function (r) { (bySp[r.species] = bySp[r.species] || []).push(r); });
  var spRows = Object.keys(bySp).map(function (k) {
    var g = bySp[k];
    return { sp: k, n: g.length,
      clr: Math.round(g.filter(function (r) { return r.clearedL1; }).length / g.length * 100),
      left: Math.round(g.filter(function (r) { return !r.clearedL1 && r.leftMid; }).length / g.length * 100) };
  }).sort(function (x, y) { return y.n - x.n; });
  html += '<section><h2>Level-1 drop-off by starting species</h2><table><thead><tr><th>Species</th><th>New players</th><th>Cleared L1</th><th>Left mid-L1</th></tr></thead><tbody>' +
    spRows.map(function (r) { return '<tr><td>' + esc(spName(r.sp)) + '</td><td>' + r.n + '</td><td>' + r.clr + '%</td><td>' + r.left + '%</td></tr>'; }).join('') +
    '</tbody></table></section>';

  html += jul25Panel(fr);
  html += lagPanel(rows, fr);
  return html;
}

// ---- Jul 25: the three deploys, and what moved --------------------------------
// Deliberately three cohorts rather than one before/after, because the changes went out at
// different times and pull on different things: PLAY should lift the clear rate (single-click
// play + more starting resources), PERF should lift the sub-minute bounce IF lag was driving it.
var JUL25 = [
  { key: 'pre',  label: 'Before today',            from: 0,                                      to: Date.parse('2026-07-25T11:49:00Z') },
  { key: 'perf1',label: '+ substrate perf fix',    from: Date.parse('2026-07-25T11:49:00Z'),     to: Date.parse('2026-07-25T12:16:00Z') },
  { key: 'play', label: '+ 1-click play & buff',   from: Date.parse('2026-07-25T12:16:00Z'),     to: Date.parse('2026-07-25T13:13:00Z') },
  { key: 'all',  label: '+ resolution cap & 30fps',from: Date.parse('2026-07-25T13:13:00Z'),     to: Infinity }
];
var MIN_COHORT = 30;    // below this, differences are noise — the panel says so rather than implying a trend

function jul25Panel(fr) {
  var cols = JUL25.map(function (c) {
    var g = fr.filter(function (r) { return r.startMs >= c.from && r.startMs < c.to; });
    var l1 = g.filter(function (r) { return r.startLevel === 1; });
    var deaths = g.filter(function (r) { return r.turns != null && !r.clearedL1; }).map(function (r) { return r.turns; });
    return {
      label: c.label, n: g.length,
      clr: g.length ? Math.round(g.filter(function (r) { return r.clearedL1; }).length / g.length * 100) : null,
      bounce: g.length ? Math.round(g.filter(function (r) { return r.nEvents <= 1; }).length / g.length * 100) : null,
      left: l1.length ? Math.round(l1.filter(function (r) { return !r.clearedL1 && r.leftMid; }).length / l1.length * 100) : null,
      med: median(deaths), thin: g.length < MIN_COHORT
    };
  });
  var th = cols.map(function (c) { return '<th>' + esc(c.label) + '</th>'; }).join('');
  var row = function (name, pick, suf) {
    return '<tr><td>' + name + '</td>' + cols.map(function (c) {
      var v = pick(c);
      if (v == null) return '<td class="muted">—</td>';
      return '<td' + (c.thin ? ' class="muted"' : '') + '>' + v + (suf || '') + '</td>';
    }).join('') + '</tr>';
  };
  var thin = cols.filter(function (c) { return c.n > 0 && c.thin; }).length;
  return '<section><h2>Jul 25 deploys — did they move anything?</h2>' +
    '<table><thead><tr><th>Metric</th>' + th + '</tr></thead><tbody>' +
    row('New players', function (c) { return c.n; }) +
    row('Cleared level 1', function (c) { return c.clr; }, '%') +
    row('Instant bounce (1 event)', function (c) { return c.bounce; }, '%') +
    row('Left mid-level-1', function (c) { return c.left; }, '%') +
    row('Median turns at L1 death', function (c) { return c.med; }) +
    '</tbody></table>' +
    '<div class="note" style="margin-top:12px"><b>Two things to keep in mind.</b> ' +
    '<b>(1) The itch build only changes when a new zip is uploaded</b> — until then these “after” ' +
    'columns are almost entirely hosted-build traffic, so a flat result says nothing about the ' +
    'players who are actually complaining. ' +
    '<b>(2)</b> Cohorts under ' + MIN_COHORT + ' players are greyed out' +
    (thin ? ' (' + thin + ' of these are)' : '') + ': with this few players a 10-point swing is noise. ' +
    'What to watch: <i>Cleared level 1</i> for the play/balance changes (single-click play, +10⚡/+10W), ' +
    'and <i>Instant bounce</i> for the perf work — if lag was driving people off in the first minute, ' +
    'that is the number that should fall.</div></section>';
}

// ---- Does lag actually drive players away? -----------------------------------
// Needs the `perf` event (kind 'perf'): turns = median frame cost in tenths of a ms,
// level = device pixels in hundredths of a Mpx, cause = ok | slow | bad.
function lagPanel(rows, fr) {
  var perf = rows.filter(function (e) { return e.kind === 'perf'; });
  if (!perf.length) {
    return '<section><h2>Does lag drive players away?</h2><div class="note">' +
      'No <code>perf</code> samples yet — the build that reports them has to be live, and each player ' +
      'sends one about 90 rendered frames into their first level. Once data arrives this compares ' +
      'frame cost against level-1 drop-off, which is the only way to actually test whether laggy ' +
      'players are the ones leaving.</div></section>';
  }
  // one sample per player (the first), joined to that player's first run
  var seen = {}, byClient = {};
  perf.slice().sort(function (a, b) { return Date.parse(a.created_at) - Date.parse(b.created_at); })
    .forEach(function (e) { if (!seen[e.client_id]) { seen[e.client_id] = 1; byClient[e.client_id] = e; } });
  var runByClient = {};
  rows.forEach(function (e) { if (e.kind === 'run_start' && !runByClient[e.client_id]) runByClient[e.client_id] = e; });

  var buckets = { ok: [], slow: [], bad: [] };
  Object.keys(byClient).forEach(function (cid) {
    var b = byClient[cid].cause; if (buckets[b]) buckets[b].push(byClient[cid]);
  });
  var frByClient = {};
  fr.forEach(function (r) { if (r.client) frByClient[r.client] = r; });

  var label = { ok: 'Smooth (&lt;8ms/frame)', slow: 'Sluggish (8–20ms)', bad: 'Bad (&gt;20ms)' };
  var body = ['ok', 'slow', 'bad'].map(function (b) {
    var list = buckets[b]; if (!list.length) return '';
    var ms = median(list.map(function (e) { return (e.turns || 0) / 10; }));
    var mpx = median(list.map(function (e) { return (e.level || 0) / 100; }));
    var runs = list.map(function (e) { return frByClient[e.client_id]; }).filter(Boolean);
    var clr = runs.length ? Math.round(runs.filter(function (r) { return r.clearedL1; }).length / runs.length * 100) : null;
    var left = runs.length ? Math.round(runs.filter(function (r) { return !r.clearedL1 && r.leftMid; }).length / runs.length * 100) : null;
    var thin = list.length < 15;
    var c = function (v, suf) { return v == null ? '<td class="muted">—</td>' : '<td' + (thin ? ' class="muted"' : '') + '>' + v + (suf || '') + '</td>'; };
    return '<tr><td>' + label[b] + '</td><td>' + list.length + '</td><td>' + (ms == null ? '—' : ms + ' ms') +
      '</td><td>' + (mpx == null ? '—' : mpx + ' Mpx') + '</td>' + c(clr, '%') + c(left, '%') + '</tr>';
  }).join('');
  return '<section><h2>Does lag drive players away?</h2>' +
    '<table><thead><tr><th>Frame cost</th><th>Players</th><th>Median frame</th><th>Median canvas</th>' +
    '<th>Cleared L1</th><th>Left mid-L1</th></tr></thead><tbody>' +
    (body || '<tr><td colspan="6" class="muted">—</td></tr>') + '</tbody></table>' +
    '<div class="note" style="margin-top:12px">Frame cost is measured, not inferred — and it is cost, ' +
    'not frame rate, because an idle board is paced to 30fps deliberately, so fps would read ~30 even ' +
    'on a fast machine. If the “Bad” row is both sizeable and drops out of level 1 more often than ' +
    '“Smooth”, lag is a real cause of early churn; if the rows behave alike, it is not.</div></section>';
}

function render(rows) {
  statusEl.textContent = rows.length + ' events · ' + new Date().toLocaleString();
  if (!rows.length) { out.innerHTML = '<div class="note">No events yet. Once players run the current build (and the <code>events</code> table exists), data appears here.</div>' + setupBlock(); return; }

  var starts = rows.filter(function (e) { return e.kind === 'run_start'; });
  var ends = rows.filter(function (e) { return e.kind === 'run_end'; });
  var clears = rows.filter(function (e) { return e.kind === 'level_clear'; });
  var buys = rows.filter(function (e) { return e.kind === 'purchase'; });
  var wins = ends.filter(function (e) { return e.cause === 'won'; });
  var deaths = ends.filter(function (e) { return e.cause && e.cause !== 'won'; });

  var players = {}; rows.forEach(function (e) { if (e.client_id) players[e.client_id] = 1; });
  var sessions = {}; rows.forEach(function (e) { if (e.session_id) sessions[e.session_id] = 1; });
  var nPlayers = Object.keys(players).length;

  // retention: runs per player, and distinct days per player
  var runsByPlayer = countBy(starts, function (e) { return e.client_id; });
  var daysByPlayer = {}; rows.forEach(function (e) {
    if (!e.client_id || !e.created_at) return;
    (daysByPlayer[e.client_id] = daysByPlayer[e.client_id] || {})[String(e.created_at).slice(0, 10)] = 1;
  });
  var repeatPlayers = Object.keys(runsByPlayer).filter(function (c) { return runsByPlayer[c] >= 2; }).length;
  var returningPlayers = Object.keys(daysByPlayer).filter(function (c) { return Object.keys(daysByPlayer[c]).length >= 2; }).length;

  var html = '';
  html += '<div class="grid">' +
    tile(nPlayers, 'Players') + tile(Object.keys(sessions).length, 'Sessions') +
    tile(starts.length, 'Runs started') + tile(wins.length, 'Wins') +
    tile(deaths.length, 'Deaths') + tile(buys.length, 'Purchases') + '</div>';

  // Run-length: distribution of the level a run ENDED on (how far people get)
  var endLevels = countBy(ends, function (e) { return e.level; });
  var maxLvl = Math.max.apply(null, Object.keys(endLevels).map(Number).concat([1]));
  var rl = '';
  var maxEnd = Math.max.apply(null, Object.keys(endLevels).map(function (k) { return endLevels[k]; }).concat([1]));
  for (var L = 1; L <= maxLvl; L++) rl += bar('Level ' + L, endLevels[L] || 0, maxEnd);
  html += '<section><h2>How far runs get (level reached at run end)</h2>' + (ends.length ? rl : '<div class="muted">No finished runs yet.</div>') + '</section>';

  // Outcome
  var oMax = Math.max(deaths.length, wins.length, 1);
  html += '<section><h2>Outcome</h2>' + bar('Died', deaths.length, oMax, true) + bar('Won (beat L100)', wins.length, oMax) + '</section>';

  // How players die — breakdown of the death cause
  var dc = sortedEntries(countBy(deaths, function (e) { return e.cause; }));
  var dcMax = dc.length ? dc[0][1] : 1;
  html += '<section><h2>How players die</h2>' + (dc.length ? dc.map(function (e) { return bar(causeLabel(e[0]), e[1], dcMax, true); }).join('') : '<div class="muted">No deaths yet.</div>') + '</section>';

  // Species picked
  var sp = sortedEntries(countBy(starts, function (e) { return e.species || '—'; }));
  var spMax = sp.length ? sp[0][1] : 1;
  html += '<section><h2>Species picked (run starts)</h2>' + (sp.length ? sp.map(function (e) { return bar(spName(e[0]), e[1], spMax); }).join('') : '<div class="muted">—</div>') + '</section>';

  // Purchases by species
  var pb = sortedEntries(countBy(buys, function (e) { return e.species || '—'; }));
  var pbMax = pb.length ? pb[0][1] : 1;
  html += '<section><h2>Species purchased</h2>' + (pb.length ? pb.map(function (e) { return bar(spName(e[0]), e[1], pbMax); }).join('') : '<div class="muted">No purchases recorded yet.</div>') + '</section>';

  // Retention
  html += '<section><h2>Retention</h2>' +
    bar('All players', nPlayers, nPlayers || 1) +
    bar('≥2 runs', repeatPlayers, nPlayers || 1) +
    bar('Returned (≥2 days)', returningPlayers, nPlayers || 1) +
    '<div class="muted" style="margin-top:8px">' + pct(repeatPlayers, nPlayers) + ' started a second run · ' + pct(returningPlayers, nPlayers) + ' came back on another day.</div></section>';

  // New-player funnel + retention panel (first-run reconstruction).
  html += retentionPanel(rows);

  // Recent events
  var recent = rows.slice(0, 40);
  html += '<section><h2>Recent events</h2><table><thead><tr><th>When</th><th>Kind</th><th>Species</th><th>Lvl</th><th>Cause</th></tr></thead><tbody>' +
    recent.map(function (e) { return '<tr><td>' + esc(String(e.created_at).replace('T', ' ').slice(0, 16)) + '</td><td>' + esc(e.kind) + '</td><td>' + esc(e.species ? spName(e.species) : '') + '</td><td>' + (e.level == null ? '' : e.level) + '</td><td>' + esc(e.cause || '') + '</td></tr>'; }).join('') +
    '</tbody></table></section>';

  out.innerHTML = html;
}
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) + '%' : '0%'; }
function setupBlock() {
  return '<div class="note"><b>Set up the <code>events</code> table</b> (run once in the Supabase SQL editor):<pre>' + esc(SETUP_SQL) + '</pre></div>';
}

function load() {
  fetchEvents().then(render).catch(function (err) {
    statusEl.textContent = '';
    out.innerHTML = '<div class="note err">Could not read the <code>events</code> table (' + esc(err.message) + '). If this is the first time, create it:</div>' + setupBlock();
  });
}
document.getElementById('refresh').addEventListener('click', load);
load();
</script>
</body>
</html>
