      const n = this.nodes[i];
      if (n.infected) continue;                 // infected (dead) strands can't grow
      const col = substrate.colAtX(n.x), row = substrate.rowAtY(n.y);
      const k = key(col, row);
      let b = buckets.get(k);
      if (!b) buckets.set(k, (b = []));
      b.push(n);
    }
    const reach = Math.ceil(g.sensingRadius / substrate.cellSize) + 1;
    const sense2 = g.sensingRadius * g.sensingRadius;
    const kill2 = g.killDistance * g.killDistance;

    // 3) For each attractor, find its nearest node within the sensing radius.
    //    Unsatisfied attractors (no node within killDistance) pull that node.
    const influence = new Map(); // node.id -> {dx, dy, w}
    for (const a of attractors) {
      const col = substrate.colAtX(a.x), row = substrate.rowAtY(a.y);
      let nearest = null, nd2 = sense2;
      for (let r = row - reach; r <= row + reach; r++) {
        for (let c = col - reach; c <= col + reach; c++) {
          const b = buckets.get(key(c, r));
          if (!b) continue;
          for (const n of b) {
            const dx = a.x - n.x, dy = a.y - n.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < nd2) { nd2 = d2; nearest = n; }
          }
        }
      }
      if (!nearest) continue;
      if (nd2 <= kill2) continue; // attractor satisfied — already reached
      const d = Math.sqrt(nd2) || 1;
      let inf = influence.get(nearest.id);
      if (!inf) influence.set(nearest.id, (inf = { dx: 0, dy: 0, w: 0 }));
      const w = a.w;
      inf.dx += ((a.x - nearest.x) / d) * w;
      inf.dy += ((a.y - nearest.y) / d) * w;
      inf.w += w;
    }

    // 4) Grow one new node from each influenced node toward its attractors.
    let created = 0;
    const newNodes = [];
    for (const [nodeId, inf] of influence) {
      const node = this.byId.get(nodeId);
      if (!node) continue;
      const len = Math.hypot(inf.dx, inf.dy);
      if (len < 1e-4) continue;
      let ang = Math.atan2(inf.dy, inf.dx) + rng.range(-g.branchJitter, g.branchJitter);
      let nx = node.x + Math.cos(ang) * g.segmentLength;
      let ny = node.y + Math.sin(ang) * g.segmentLength;
      // Keep growth underground and inside the world.
      ny = Math.max(substrate.surfaceY + 2, Math.min(substrate.worldHeight - 2, ny));
      nx = Math.max(2, Math.min(substrate.worldWidth - 2, nx));
      // Can't grow through rock or across an active ant trail.
      const tcell = substrate.cellAtWorld(nx, ny);
      if (tcell && (tcell.rock || tcell.antTrail)) continue;
      // Don't pile nodes on top of each other.
      if (this._tooClose(nx, ny, g.minTipSpacing, substrate, buckets, key, reach)) continue;
      const child = this.addNode(nx, ny, node);
      newNodes.push(child);
      created++;
      if (this.nodes.length >= g.maxNodes) break;
    }
    return created;
  }

  // === Card-layer growth primitives (C1) ==================================
  // Uninfected tip nodes (the advancing frontier).
  tips() {
    const t = [];
    // Exclude `colon` mat hyphae (dense fill sprayed into claimed food piles):
    // they aren't the advancing frontier and would skew aim / growth direction /
    // the frontier centroid.
    for (const n of this.nodes) if (!n.infected && !n.colon && n.children.length === 0) t.push(n);
    return t.length ? t : this.nodes.filter((n) => !n.infected);
  }
  // Nearest uninfected node to a world point.
  nearestNode(x, y) {
    let best = null, bd = Infinity;
    for (const n of this.nodes) {
      if (n.infected) continue;
      const d = (n.x - x) ** 2 + (n.y - y) ** 2;
      if (d < bd) { bd = d; best = n; }
    }
    return best;
  }
  // Nearest frontier TIP (childless strand end) to a world point — the source for
  // aimed plays, so growth/placement always originates from the strand closest to
  // where you're aiming. Returns a node, or null if the network has no tips.
  nearestTip(x, y) {
    let best = null, bd = Infinity;
    for (const n of this.tips()) {
      const d = (n.x - x) ** 2 + (n.y - y) ** 2;
      if (d < bd) { bd = d; best = n; }
    }
    return best;
  }
  // Centroid of the frontier (origin for directional plays / substrate placement).
  frontierPoint() {
    const src = this.tips();
    if (!src.length) return null;
    let sx = 0, sy = 0;
    for (const n of src) { sx += n.x; sy += n.y; }
    return { x: sx / src.length, y: sy / src.length };
  }

  _placeOk(substrate, nx, ny) {
    if (ny <= substrate.surfaceY + 2 || ny >= substrate.worldHeight - 2) return false;
    if (nx <= 2 || nx >= substrate.worldWidth - 2) return false;
    const cell = substrate.cellAtWorld(nx, ny);
    if (!cell) return true;
    if (cell.bored) return true;   // rock a punch has bored a channel through — passable, still drawn as rock
    return !(cell.rock || cell.antTrail);
  }

  // Grow a chain of `steps` segments in direction (dx,dy). The chain starts from
  // `startTip` when given (aimed plays pass the tip nearest the aim point, so growth
  // originates from the strand you aimed from); otherwise it starts from the frontier
  // tip furthest along (dx,dy). straight=true ignores jitter; returns nodes created.
  growDirected(substrate, rng, dx, dy, steps, straight = false, startTip = null) {
    const g = this.config.growth;
    const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    const tips = this.tips();
    if (!tips.length) return 0;
    let parent;
    if (startTip && !startTip.infected) {
      parent = startTip;   // grow from the given node (a branch, even if it isn't a tip)
    } else {
      parent = tips[0]; let bestProj = -Infinity;
      for (const n of tips) { const p = n.x * dx + n.y * dy; if (p > bestProj) { bestProj = p; parent = n; } }
    }
    const baseAng = Math.atan2(dy, dx);
    let created = 0;
    for (let i = 0; i < steps; i++) {
      if (this.nodes.length >= g.maxNodes) break;
      const ang = straight ? baseAng : baseAng + rng.range(-g.branchJitter, g.branchJitter);
      const nx = parent.x + Math.cos(ang) * g.segmentLength;
      const ny = parent.y + Math.sin(ang) * g.segmentLength;
      if (!this._segmentClear(substrate, parent.x, parent.y, nx, ny)) break;   // blocked — rock/edge anywhere along the segment, not just its end
      parent = this.addNode(nx, ny, parent);
      created++;
    }
    // Directed growth also colonises any substrate pile it brought within reach.
    created += this.colonizeReachablePiles(substrate, rng);
    if (created) this.recomputeVitality();
    return created;
  }

  // Foraging Fan: EVERY frontier strand fans OUTWARD at once — a slow even ring of
  // probing tips (no food needed). Each current tip sprouts a small outward fan of
  // short probe-chains (`foragingFanCells` deep): the straight-out chain guarantees
  // the strand advances, wider side chains bush it out where there's room and route
  // around rock. Growing along each tip's real OUTWARD heading (away from its parent)
  // with a relaxed min-spacing is what makes it work on a DENSE colony — the old
  // 8-fixed-compass-ray burst fell back over existing tissue and was crowd-rejected
  // everywhere except a lone isolated tip, so only one strand appeared to grow.
  // Fanning the ORIGINAL tips once (not re-fanning each new child) keeps it bounded
  // instead of exploding exponentially over the depth.
  growRadial(substrate, rng) {
    const g = this.config.growth;
    const cells = Math.max(1, g.foragingFanCells || 3);          // probe depth per ray
    const spacing = Math.max(4, g.minTipSpacing * 0.55);         // relaxed so a packed frontier can still push out
    const key = (c, r) => c + ',' + r;
    const buckets = new Map();
    const bucket = (n) => { const k = key(substrate.colAtX(n.x), substrate.rowAtY(n.y)); let b = buckets.get(k); if (!b) buckets.set(k, (b = [])); b.push(n); };
    for (const n of this.nodes) if (!n.infected) bucket(n);
    // Colony centroid — outward fallback for a tip with no parent (a free fragment).
    let cx = 0, cy = 0; for (const n of this.nodes) { cx += n.x; cy += n.y; } cx /= this.nodes.length || 1; cy /= this.nodes.length || 1;
    // Grow a chain of up to `cells` segments from `start` toward `ang0`; returns count.
    const growChain = (start, ang0) => {
      let parent = start, made = 0;
      for (let step = 0; step < cells; step++) {
        if (this.nodes.length >= g.maxNodes) break;
        const ang = ang0 + rng.range(-g.branchJitter, g.branchJitter) * 0.5;
        const nx = parent.x + Math.cos(ang) * g.segmentLength, ny = parent.y + Math.sin(ang) * g.segmentLength;
        if (!this._segmentClear(substrate, parent.x, parent.y, nx, ny)) break;   // rock/edge/surface
        if (this._tooClose(nx, ny, spacing, substrate, buckets, key, 1)) break;   // already occupied
        parent = this.addNode(nx, ny, parent); bucket(parent); made++;
      }
      return made;
    };
    const ARC = [0, 0.6, -0.6, 1.15, -1.15];   // outward fan: straight out first, then widening spread rays
    const tips = this.tips();
    let created = 0;
    for (const t of tips) {
      if (this.nodes.length >= g.maxNodes) break;
      const p = t.parentId != null ? this.byId.get(t.parentId) : null;
      let ox = p ? t.x - p.x : t.x - cx, oy = p ? t.y - p.y : t.y - cy;
      if (ox * ox + oy * oy < 1e-6) { ox = t.x - cx; oy = t.y - cy; if (ox * ox + oy * oy < 1e-6) ox = 1; }  // rootless tip at centroid → arbitrary outward
      const base = Math.atan2(oy, ox);
      let advanced = false;
      for (const off of ARC) {
        if (this.nodes.length >= g.maxNodes) break;
        // If the straight-out ray is blocked, dodge wider so the strand still advances.
        if (off === 0 && !this._segmentClear(substrate, t.x, t.y, t.x + Math.cos(base) * g.segmentLength, t.y + Math.sin(base) * g.segmentLength)) {
          for (const d of [0.9, -0.9, 1.6, -1.6]) { if (growChain(t, base + d) > 0) { advanced = true; created++; break; } }
          continue;
        }
        if (growChain(t, base + off) > 0) { advanced = true; created++; }
        else if (off === 0) break;   // straight-out truly walled in (rock+crowd) → skip the side rays too
      }
      void advanced;
    }
    // Fanning out also fully colonises any substrate pile within reach, in one step.
    created += this.colonizeReachablePiles(substrate, rng);
    if (created) this.recomputeVitality();
    return created;
  }

  // Why couldn't the fan grow anywhere? (Only called when growRadial returned 0,
  // so the caller can report the real reason instead of a flat "no room".)
  //   'cap'     — at the hard node limit, growth can't add more.
  //   'rock'    — every frontier tip is walled in by rock / edge / the surface.
  //   'crowded' — open directions exist, but they'd fall back over existing
  //               strands (min-spacing), i.e. the colony is packed solid here.
  // NOTE: any single frontier tip with an open, un-crowded direction means the
  // fan WOULD have grown there — partial growth always succeeds — so reaching
  // this at all means no tip anywhere could advance.
  fanBlockReason(substrate) {
    const g = this.config.growth;
    if (this.nodes.length >= g.maxNodes) return 'cap';
    const rays = Math.max(3, g.foragingFanRays || 8);
    for (const t of this.tips()) {
      for (let k = 0; k < rays; k++) {
        const ang = (k / rays) * Math.PI * 2;
        const nx = t.x + Math.cos(ang) * g.segmentLength;
        const ny = t.y + Math.sin(ang) * g.segmentLength;
        // A placeable direction that's merely crowded means the frontier is
        // boxed by its own mass, not by rock.
        if (this._placeOk(substrate, nx, ny)) return 'crowded';
      }
    }
    return 'rock';
  }

  // Any NEW (unreached) food left on the map? Colonised cells are excluded to
  // match growToNearestFood — the lunge only targets food it hasn't reached yet,
  // so this distinguishes "blocked by rock" from "nothing new to lunge toward".
  hasFood(substrate) {
    for (const cell of substrate.cells) if (cell.nutrient > 0 && !cell.colonized && !cell.rock && !cell.hazard) return true;
    return false;
  }

  // How many `steps` a straight runner from `node` toward (dx,dy) could place
  // before rock/edge/surface stops it (a dry run — adds no nodes).
  _reachableSteps(substrate, node, dx, dy, steps) {
    const g = this.config.growth;
    const len = Math.hypot(dx, dy) || 1; const ux = dx / len, uy = dy / len;
    let px = node.x, py = node.y, n = 0;
    for (let i = 0; i < steps; i++) {
      const nx = px + ux * g.segmentLength, ny = py + uy * g.segmentLength;
      if (!this._segmentClear(substrate, px, py, nx, ny)) break;
      px = nx; py = ny; n++;
    }
    return n;
  }

  // True only if the WHOLE segment from (x0,y0) to (x1,y1) is placeable — sampled
  // every ~third of a cell. Endpoint-only checks let a strand hop over or graze a
  // rock cell (a segment whose ends land in adjacent free cells but whose line
  // clips the rock between them), which read as "grew through the rock". Only a
  // punch/dig (which marks cells `bored`) may cross rock; _placeOk allows those.
  _segmentClear(substrate, x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0;
    const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (substrate.cellSize / 3)));
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      if (!this._placeOk(substrate, x0 + dx * t, y0 + dy * t)) return false;
    }
    return true;
  }

  // Grow `steps` from the frontier tip nearest to food, toward that food (works
  // anywhere on the map, even out of sensing range). Considers EVERY (tip, food)
  // pair ordered by distance and lunges from the first one that can actually
  // advance — so the closest tip-to-food approach wins, but if that path is walled
  // off by rock it falls through to the next-closest: a different tip, OR the same
  // colony aiming at a different (slightly farther) food pile. This matters when the
  // whole colony's nearest pile is boxed in — the lunge then heads for the next pile
  // instead of giving up. Ties go to the tip closer to the goal (larger x). Returns
  // nodes grown; 0 means no unreached food, or every approach is walled off.
  growToNearestFood(substrate, rng, steps) {
    const g = this.config.growth;
    const tips = this.tips();
    if (!tips.length) return 0;
    let food = [];
    substrate.forEachCell((cell, col, row) => {
      // Only NEW food the colony hasn't reached yet. Colonised cells still carry
      // nutrient (it drains over turns), so counting them would make the lunge
      // chase the pile it's already sitting on.
      if (cell.nutrient > 0 && !cell.colonized && !cell.rock && !cell.hazard) food.push(substrate.cellCenter(col, row));
    });
    if (!food.length) return 0;
    // Bound the pair count on huge colonies: keep only the food cells nearest the
    // colony centroid (the far ones are irrelevant while nearer food is reachable).
    const cap = 80000;
    if (tips.length * food.length > cap) {
      let cx = 0, cy = 0; for (const t of tips) { cx += t.x; cy += t.y; } cx /= tips.length; cy /= tips.length;
      const keep = Math.max(20, Math.floor(cap / tips.length));
      food.sort((a, b) => ((a.x - cx) ** 2 + (a.y - cy) ** 2) - ((b.x - cx) ** 2 + (b.y - cy) ** 2));
      food = food.slice(0, keep);
    }
    // ALL (tip, food) pairs, nearest first.
    const cand = [];
    for (const t of tips) for (const f of food) cand.push({ n: t, nt: f, nd: (f.x - t.x) ** 2 + (f.y - t.y) ** 2 });
    // Order by distance; ties (within ~2px) go to the tip closer to the goal (larger
    // x). Quantised distance keeps the comparator transitive.
    const EPS2 = 4;
    cand.sort((a, b) => { const qa = Math.round(a.nd / EPS2), qb = Math.round(b.nd / EPS2); return qa !== qb ? qa - qb : b.n.x - a.n.x; });
    // Lunge from the closest approach that actually makes progress. An approach is
    // "viable" only if the tip can REACH the food or get a full clear runway toward
    // it — a tip that can merely nudge a step or two into a wall before stopping is
    // treated as blocked, so we fall through to the next-closest approach (a
    // different tip, or a different pile). Only if NOTHING is viable do we fall back
    // to the furthest partial advance, so a genuinely half-walled path still lunges
    // as far as it can rather than erroring.
    let best = null, bestReach = 0;
    for (const c of cand) {
      const dx = c.nt.x - c.n.x, dy = c.nt.y - c.n.y;
      const reach = this._reachableSteps(substrate, c.n, dx, dy, steps);
      if (reach <= 0) continue;   // walled in immediately toward this food
      const need = Math.ceil(Math.sqrt(c.nd) / g.segmentLength);
      if (reach >= Math.min(need, steps)) {   // reaches the food, or a full clear lunge
        return this.growDirected(substrate, rng, dx, dy, steps, false, c.n);
      }
      if (reach > bestReach) { bestReach = reach; best = c; }   // remember the best partial
    }
    if (best) return this.growDirected(substrate, rng, best.nt.x - best.n.x, best.nt.y - best.n.y, steps, false, best.n);
    return 0;   // unreached food exists but every approach to it is walled off
  }

  // Clear the contiguous rock feature (of an allowed class) nearest a tapped point
  // and bridge a node into it so growth can pass. classes ⊆ {boulder,formation,column,lakeBasin}.
  digThrough(substrate, x, y, classes, cap = 90) {
    const isClass = (cell) => cell && cell.rock && (
      (classes.includes('boulder') && !cell.formation && !cell.column && !cell.water) ||
      (classes.includes('formation') && cell.formation) ||
      (classes.includes('column') && cell.column) ||
      (classes.includes('lakeBasin') && cell.water));
    const c0 = substrate.colAtX(x), r0 = substrate.rowAtY(y);
    let start = null;
    outer:
    for (let rad = 0; rad <= 8 && !start; rad++) {
      for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
        if (rad > 0 && Math.max(Math.abs(dr), Math.abs(dc)) !== rad) continue;
        if (isClass(substrate.cellAt(c0 + dc, r0 + dr))) { start = { col: c0 + dc, row: r0 + dr }; break outer; }
      }
    }
    if (!start) return 0;
    const seen = new Set(), stack = [start], cleared = [];
    while (stack.length && cleared.length < cap) {
      const { col, row } = stack.pop();
      if (!substrate.inBounds(col, row)) continue;
      const idx = substrate.index(col, row);
      if (seen.has(idx)) continue; seen.add(idx);
      const cell = substrate.cells[idx];
      if (!isClass(cell)) continue;
      cell.rock = false; cell.formation = false; cell.column = false;
      if (cell.water && classes.includes('lakeBasin')) cell.water = false;
      cleared.push(substrate.cellCenter(col, row));
      stack.push({ col: col + 1, row }, { col: col - 1, row }, { col, row: row + 1 }, { col, row: row - 1 });
    }
    if (cleared.length) {
      const entry = cleared[0];
      const near = this.nearestNode(entry.x, entry.y);
      if (near) this.addNode(entry.x, entry.y, near);
      this.recomputeVitality();
    }
    return cleared.length;
  }

  // Appressorial Punch: bore through the nearest ROCK near a tap and THREAD a
  // visible strand from the colony, through the cleared rock, out the far side —
  // so you actually see hyphae penetrate it. Works on ANY solid rock the colony
  // must get past — loose boulders, big rock formations and path-blocking columns
  // all read the same to the player, so they clear the same way (lakes/water are
  // not rock and are left alone). The whole connected rock feature is cleared (up
  // to a cap so one punch can't wipe out half the map).
  // Returns: >0 nodes threaded on success; 0 if there's no rock near the tap;
  // -1 if rock is there but no colony strand is in range to reach it.
  punchThrough(substrate, rng, x, y) {
    const g = this.config.growth;
    const isRock = (cell) => cell && cell.rock && !cell.water;
    // nearest rock cell to the tap (rocks render as sprites that spill well beyond
    // their cells, so search a generous radius around the click)
    const c0 = substrate.colAtX(x), r0 = substrate.rowAtY(y);
    let start = null;
    outer:
    for (let rad = 0; rad <= 8 && !start; rad++) {
      for (let dr = -rad; dr <= rad; dr++) for (let dc = -rad; dc <= rad; dc++) {
        if (rad > 0 && Math.max(Math.abs(dr), Math.abs(dc)) !== rad) continue;
        if (isRock(substrate.cellAt(c0 + dc, r0 + dr))) { start = { col: c0 + dc, row: r0 + dr }; break outer; }
      }
    }
    if (!start) return 0;
    // flood-fill the contiguous rock feature
    const seen = new Set(), stack = [start], cells = [];
    while (stack.length && cells.length < 120) {
      const { col, row } = stack.pop();
      if (!substrate.inBounds(col, row)) continue;
      const idx = substrate.index(col, row);
      if (seen.has(idx)) continue; seen.add(idx);
      if (!isRock(substrate.cells[idx])) continue;
      const ctr = substrate.cellCenter(col, row);
      cells.push({ col, row, x: ctr.x, y: ctr.y });
      stack.push({ col: col + 1, row }, { col: col - 1, row }, { col, row: row + 1 }, { col, row: row - 1 });
    }
    if (!cells.length) return 0;
    // Anchor: the colony strand closest to the rock. Require it to be in range
    // (within the colony's sensing/lit reach, + a cell of slack) — matches the
    // card's "in-range" and the lit area the player sees.
    let anchor = null, bestD = Infinity;
    for (const cell of cells) {
      const nn = this.nearestNode(cell.x, cell.y);
      if (!nn) continue;
      const d = Math.hypot(nn.x - cell.x, nn.y - cell.y);
      if (d < bestD) { bestD = d; anchor = nn; }
    }
    if (!anchor) return -1;
    if (bestD > g.sensingRadius + substrate.cellSize) return -1;   // rock present but out of range
    // Direction of travel: from the anchor toward the point the PLAYER AIMED AT, so
    // the strand bores ACROSS the rock in the chosen direction and emerges on that
    // side. (Aiming at the rock's centroid instead dragged the strand down a long
    // column's whole length rather than out the side you picked.)
    const cs = substrate.cellSize;
    let dx = x - anchor.x, dy = y - anchor.y;
    if (Math.hypot(dx, dy) < 1) { dx = 1; dy = 0; }
    const ux = dx / Math.hypot(dx, dy), uy = dy / Math.hypot(dx, dy);
    // The rock ends, ALONG THE AIM DIRECTION, at the far edge of the CLICKED
    // feature. Walk the ray and track the last point that lands in THIS feature, so
    // we cross the whole feature and emerge on the chosen side — not stop at the
    // centroid, follow a long column's length, or halt on some other rock we pass
    // through on the way.
    const featSet = new Set(cells.map((c) => substrate.index(c.col, c.row)));
    let maxCellDist = 0;
    for (const c of cells) { const d = Math.hypot(c.x - anchor.x, c.y - anchor.y); if (d > maxCellDist) maxCellDist = d; }
    let far = 0, reached = false;
    for (let t = 0; t <= maxCellDist + cs * 2; t += cs / 3) {
      const cc = substrate.colAtX(anchor.x + ux * t), rr = substrate.rowAtY(anchor.y + uy * t);
      if (!substrate.inBounds(cc, rr)) continue;
      if (featSet.has(substrate.index(cc, rr))) { far = t; reached = true; }
    }
    if (!reached) far = Math.min(maxCellDist, Math.hypot(x - anchor.x, y - anchor.y));
    // Bore a passable channel along the ray up to that exit — any rock on the way
    // (the feature itself, or something we pass through to reach it) is opened but
    // stays drawn as rock, so the strand overlays it instead of the rock vanishing.
    for (let t = 0; t <= far + cs * 0.5; t += cs / 3) {
      const cell = substrate.cellAtWorld(anchor.x + ux * t, anchor.y + uy * t);
      if (cell && cell.rock) cell.bored = true;
    }
    // Thread a straight strand from the anchor, through the rock, and STOP where the

// Threats — Trichoderma, the one Phase 1 threat (A2/A5, B6).
//
// Trichoderma is modelled as a small number of discrete, roughly fixed-size
// CLOUDS that roam the cross-section:
//   - Each cloud creeps toward the nearest food source it can SEE (rock blocks
//     a cloud's line of sight, so food behind a boulder stays hidden).
//   - It devours any substrate it passes over (a pile it sits on is gone in
//     ~2 turns) but eating barely grows it — a small cloud that eats a giant
//     pile stays small.
//   - The moment a cloud's outer edge touches your network it infects you
//     (turning a chunk of strands green/dead), then spends itself: it keeps
//     drifting toward food while fading away completely over ~2 turns. So each
//     cloud infects you at most once.
//   - Once the rot is inside you it races along your filaments (several rings a
//     turn) until you Amputate the infected branch.
//
// The discrete clouds are projected into a per-cell intensity field
// (cell.trich) every turn purely so the renderer and recovery checks can read
// a simple scalar. Countered by:
//   - Amputate (cut out the infected branch — the only cure once inside)
//   - Melanize (a chance to resist the initial contact)
//
// Renderer-agnostic: operates only on substrate cells + the Network objects,
// with the live cloud list living on `state.clouds`.
// =============================================================================

// (not on food) and a good way from the colony, so each one visibly creeps in
// toward its nearest target. Returns the cloud list (stored on state.clouds)
// and stamps the field for first paint.
function seedTrichoderma(substrate, config, rng, network) {

    clouds.push(makeCloud(spot.x, spot.y, rng.range(t.cloudRadiusMin, t.cloudRadiusMax)));

// spent cloud, then re-project the clouds into the cell.trich field.

  sub.forEachCell((cell, col, row) => {

  // CLOSEST of (substrate, you) and never sits idle while a target exists.

    // SIGHT — rock blocks a cloud's senses, so it can't home in on food hidden
    // behind a boulder. If nothing is visible, wander until something is sensed.
    // (sightRadius is shown on screen; LOS is only tested on a distance
    // improvement, to keep the cost down.)

    }

      // through rock) so they route around formations instead of tunnelling.

    // pile visibly shrinks cell-by-cell as the cloud crawls across it. Eating
    // barely grows the cloud, hard-capped so it never gets giant.

  // is eventually replaced by a fresh one creeping in from elsewhere, so the
  // threat never just ends and there's always something on the move.

// thin wall. If the straight move is blocked, slide along the obstacle (x-only
// then y-only) so the cloud rounds rock formations. Returns true if it moved.

  const minY = sub.surfaceY + cs, maxY = sub.worldHeight - cs;

    const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (cs * 0.5)));

      const c = sub.cellAtWorld(x, y);

// Ants — a fixed territorial threat + food rival (A2/B6).

// (BFS around rock). The ants harvest that food; when it's gone they retarget
// the next-nearest food, so an un-bombed nest works through the whole map
// (nests see everything — no sight limit). The trail is IMPASSABLE to your
// growth, so you can't pierce it; you go around, race them to the food (so they
// relocate), or bomb the nest (Attack Ants action).

      const top = substrate.cellAt(col, 0);

    }

    const nest = {
      col, x: ctr.x, y: substrate.surfaceY,
      hp: a.maxHp, maxHp: a.maxHp,
      target: null, path: [], phase: 0, dormant: false,
    };
    retarget(substrate, nest);
    nests.push(nest);
  }
  setTrailFields(substrate, nests);
  return nests;
}

// then we re-stamp the trail barrier and eat any strands a trail moved onto.

    if (!cell || cell.nutrient <= 0) {

      cell = nest.target ? sub.cellAt(nest.target.col, nest.target.row) : null;

      cell.antProof -= 1;
      nest.dormant = false;

// {target, path} (path is a list of {col,row} from nest to food) or null.

    if ((a.cd || 0) > 0) msg = `On cooldown — ${a.cd} round${a.cd > 1 ? 's' : ''} left.`;

    else if (a.cost && (net[a.res] || 0) < a.cost) msg = `Need ${a.cost - Math.floor(net[a.res] || 0)} more ${RES_LABEL[a.res] || a.res}.`;
    return { ok: false, message: msg };
  }
  // Targeted abilities need a map point. The first call (from the Use button) has
  // no ctx → ask the caller to aim; the second call (map tap) carries {x,y}. Cost
  // and cooldown are only spent once the effect actually resolves, below.
  if (a.target && (!ctx || ctx.x == null)) return { ok: false, needTarget: true, index: i, message: `Tap a target for ${a.name}.` };
  const res = a.apply ? a.apply(state, ctx) : { ok: true, message: `${a.name}.` };
  if (!res || !res.ok) return { ok: false, message: (res && res.message) || 'Nothing happened.' };
  if (a.cost) net[a.res] -= a.cost;      // pay the price
  if (a.per) a.used = (a.used || 0) + 1;  // spend a use
  if (a.every) a.cd = a.every;            // start the cooldown
  state.log(`Action: ${a.name}. ${res.message || ''}`, 'action');
  return { ok: true, message: res.message };
}

// --- WIN: a strand reaches the goal zone; LOSE: card-dry & broke ------------
function checkGoalReached(state) {
  if (state.runOver || !state.cards) return;
  const net = state.active; if (!net || !net.alive) return;
  const sub = state.substrate;
  const f = state.config.actions.fruit;
  for (const n of net.nodes) {
    if (n.infected) continue;
    const surf = sub.surfaceColumnAtX(n.x);
    if (surf && surf.goal) {
      const depth = n.y - sub.surfaceY;
      if (depth >= 0 && depth <= f.reachDepth) {
        net.fruited = true; net.alive = false;
        state.runOver = true; state.won = true;
        state.runResult = { won: true, turns: state.turn };
        state.log('A fruiting body breaks the surface at the goal — you win the level!', 'good');
        return;
      }
    }
  }
  // Stall death: the world can no longer be advanced. You can't afford to DRAW
  // (deck empty OR too little Energy), can't SKIP, have no playable card, and no
  // free draft is pending. (Gating on deck-emptiness alone missed the freeze where
  // the deck still has cards but Energy is below the draw cost — Draw costs 16 > skip 12.)
  const C = state.cards;
  const cc = state.config.cards;
  const canDraw = C.drawDeck.length > 0 && net.energy >= drawCost(state);
  const canSkip = net.energy >= cc.skipCostEnergy;
  const canPlay = C.hand.some((h) => !cardBlockedReason(state, h.name) && EFFECTS[h.name]);
  const hasDraft = C.pendingOffers && C.pendingOffers.length > 0;   // a free card is still coming
  if (!canDraw && !canSkip && !canPlay && !hasDraft) {
    net.alive = false; state.runOver = true;
    state.runResult = { won: false, died: true, turns: state.turn };
    state.log('Out of Energy with no playable move — the colony stalls. Run over.', 'warn');
  }
}

// --- shared effect helpers --------------------------------------------------
// Aimed plays originate from the part of the ALIVE colony nearest the tapped
// point (any node, not only a frontier tip — whichever strand is closest to
// where you clicked), and grow from there toward the tap. Falls back to the
// frontier centroid only if the network somehow has no nodes. Returns the source
// point `fp`, the source `tip` node (for growth to start from), and the direction
// from that source to the tapped point.
function dirFrom(state, ctx) {
  // Directional drag-aim plays (Apical Drive, Rhizomorph Lance, Fruiting Vigil,
  // Leading Cord) carry a press ORIGIN in ctx.srcX/srcY: the player pressed to pick
  // where growth starts, then dragged to pick which way it heads. The source is the
  // living strand nearest that press point, and growth aims from there toward the
  // drag point (ctx.x/y). Single-tap plays (no origin — e.g. substrate caches) keep
  // the old behaviour: source = strand nearest the tap, direction toward the tap.
  const hasOrigin = ctx.srcX != null && ctx.srcY != null;
  const tip = state.active.nearestNode(hasOrigin ? ctx.srcX : ctx.x, hasOrigin ? ctx.srcY : ctx.y);
  const fp = tip ? { x: tip.x, y: tip.y } : (state.active.frontierPoint() || { x: 0, y: state.substrate.surfaceY });
  let dx = ctx.x - fp.x, dy = ctx.y - fp.y;
  if (Math.hypot(dx, dy) < 1) { dx = 1; dy = 0; }
  return { fp, tip, dx, dy };
}
function depositAtSensingEdge(state, ctx, amount, radiusCells) {
  const sub = state.substrate;
  const g = state.config.growth;
  const { fp, dx, dy } = dirFrom(state, ctx);
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const clampX = (x) => Math.max(sub.cellSize, Math.min(sub.worldWidth - sub.cellSize, x));
  const clampY = (y) => Math.max(sub.surfaceY + sub.cellSize, Math.min(sub.worldHeight - sub.cellSize, y));
  // Where we'd LIKE it: just inside the sensing edge, in the aimed direction.
  const target = { x: clampX(fp.x + ux * g.sensingRadius * 0.85), y: clampY(fp.y + uy * g.sensingRadius * 0.85) };
  // But growth senses food strictly WITHIN the sensing radius, so the cache MUST
  // land on soil that the colony can actually reach. Scan the soil cells within
  // sensing range of the source tip (excluding cells already at/inside it) and pick
  // the one nearest the aimed target. This guarantees a reachable, on-soil cache —
  // never buried in rock, off the map, or dropped exactly on the un-reachable edge.
  const reachCells = Math.ceil(g.sensingRadius / sub.cellSize);
  const tc = sub.colAtX(fp.x), tr = sub.rowAtY(fp.y);
  const inMin = g.killDistance + sub.cellSize, inMax = g.sensingRadius * 0.9;
  let best = null, bestD = Infinity;
  for (let r = tr - reachCells; r <= tr + reachCells; r++) {
    for (let c = tc - reachCells; c <= tc + reachCells; c++) {
      const cell = sub.cellAt(c, r);
      if (!cell || cell.rock || cell.water) continue;
      const cc = sub.cellCenter(c, r);
      const dTip = Math.hypot(cc.x - fp.x, cc.y - fp.y);
      if (dTip < inMin || dTip > inMax) continue;   // reachable and not already occupied
      const dTgt = (cc.x - target.x) ** 2 + (cc.y - target.y) ** 2;
      if (dTgt < bestD) { bestD = dTgt; best = cc; }
    }
  }
  const at = best || target;   // fallback only if the colony is fully walled in
  sub.deposit(at.x, at.y, amount, radiusCells);
  return { px: at.x, py: at.y };
}
function nodeTouches(state, pred) {
  const sub = state.substrate;
  for (const n of state.active.nodes) {
    if (n.infected) continue;
    const col = sub.colAtX(n.x), row = sub.rowAtY(n.y);
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const cell = sub.cellAt(col + dc, row + dr);
      if (cell && pred(cell)) return true;
    }
  }
  return false;
}
const touchesLake = (state) => nodeTouches(state, (c) => c.water);
const touchesMineral = (state) => nodeTouches(state, (c) => c.rock && !c.water);
function digNearestRock(state, classes) {
  const fp = state.active.frontierPoint(); if (!fp) return 0;
  return state.active.digThrough(state.substrate, fp.x, fp.y, classes);
}
// Remove every node of the active network within radius `r` of the tap. Refuses
// to wipe the whole colony (aim tighter). The key anti-Trichoderma tool: cut off
// an infected region before it spreads. _removeNodes recomputes vitality.
function amputateAt(state, ctx, r) {
  const net = state.active;
  const doomed = new Set();
  for (const n of net.nodes) if ((n.x - ctx.x) ** 2 + (n.y - ctx.y) ** 2 <= r * r) doomed.add(n.id);
  if (!doomed.size) return { ok: false, message: 'No mycelium there to amputate.' };
  if (doomed.size >= net.nodes.length) return { ok: false, message: 'That would remove the whole colony — aim tighter.' };
  net._removeNodes(doomed);
  return { ok: true, message: `Amputated ${doomed.size} strand${doomed.size > 1 ? 's' : ''}.` };
}
function cureRadius(state, ctx, r) {
  let healed = 0;
  for (const n of state.active.nodes) {
    if ((n.x - ctx.x) ** 2 + (n.y - ctx.y) ** 2 <= r * r) {
      if (n.infected) { n.infected = false; healed++; }
      n.health = 1;
    }
  }
  state.substrate.cellsInRadius(ctx.x, ctx.y, r, (cell) => { cell.trich = 0; });
  state.active.recomputeVitality();
  return healed;
}

// --- the effect registry (all 40 cards) -------------------------------------
const grow = (fn) => ({ apply: fn });
const targeted = (fn) => ({ target: true, apply: fn });
// directional(): a targeted grow whose target is set by a PRESS-AND-DRAG gesture
// (aim:'drag') instead of a single tap — the press picks where growth starts in the
// colony, the drag picks the direction. `reachFn(state)` returns the segment count
// it grows, for the UI aim-line preview. See dirFrom + main.js drawAimLine.
const directional = (reachFn, fn) => ({ target: true, aim: 'drag', reachFn, apply: fn });
const engine = (produce, msg) => ({ apply: () => ({ ok: true, install: { ...produce }, message: msg }) });
// abilityUpgrade(): a one-shot card that permanently shortens ONE chosen installed
// ability's "every N rounds" wait by `n` (min 1). `scope` picks the eligible list
// ('action' → cards.actions, 'engine' → cards.engines); the UI shows a picker and
// replays playCard with ctx.ability = the chosen index. Goes to the discard.
const abilityUpgrade = (scope, n) => ({
  abilityScope: scope,
  abilityAmount: n,
  apply: (state, c, ctx) => {
    const list = scope === 'action' ? state.cards.actions : state.cards.engines;
    const t = list[ctx.ability];
    if (!t) return { ok: false, message: 'That ability is no longer installed.' };
    // "Max 1 speed up per card": each installed ability can be sped up by exactly
    // ONE tempo card, of any kind, ever.
    if (t.tempoUsed) return { ok: false, message: `${t.name} has already been sped up — max 1 speed up per card.` };
    if (!(t.every > 1)) return { ok: false, message: `${t.name} is already at its minimum wait.` };
    const before = t.every;
    t.every = Math.max(1, t.every - n);
    t.tempoUsed = true;
    return { ok: true, message: `${t.name}: wait ${before} → ${t.every} round${t.every > 1 ? 's' : ''}.` };
  },
});
// action(): a card that, when PLAYED, installs a repeatable ability into the
// Actions menu (right) instead of firing once. `spec` holds the activation gating —
// `every` (once-per-N-rounds cooldown), `cost`+`res` (resource price per use),
// `per` (uses per round), `target` (aim a point on the map) — plus a short `effect`
// label for the menu row. `run(state, ctx)` is the ability's effect. The card's
// buy/W/P cost is the one-time INSTALL price (charged by playCard); per-activation
// costs come from `spec.cost`.
const action = (spec, run) => ({ apply: () => ({ ok: true, installAction: { ...spec, apply: run }, message: 'Installed — added to your Actions menu.' }) });
// The colony is at its hard node cap — growth can't add more. Grow cards check
// this first so they report the real reason instead of a misleading "no room".
const maxedOut = (s) => s.active.nodes.length >= s.config.growth.maxNodes;
const MAXED_MSG = 'The colony has reached its maximum size.';

const EFFECTS = {
  // --- grow (Water) ---
  'Hyphal Extension': grow((s) => {
    if (maxedOut(s)) return { ok: false, message: MAXED_MSG };
    const c = s.active.grow(s.substrate, s.rng);
    return c > 0 ? { ok: true, message: `Grew ${c} filaments toward food.` } : { ok: false, message: 'No food within sensing range.' };
  }),
  'Apical Drive': directional((s) => s.config.cards.directionalSteps, (s, c, ctx) => {
    if (maxedOut(s)) return { ok: false, message: MAXED_MSG };
    const { dx, dy, tip } = dirFrom(s, ctx);
    const n = s.active.growDirected(s.substrate, s.rng, dx, dy, s.config.cards.directionalSteps, false, tip);
    return n > 0 ? { ok: true, message: `Grew ${n} in your chosen direction.` } : { ok: false, message: 'Blocked — nothing grew that way.' };
  }),
  'Foraging Fan': grow((s) => {
    if (maxedOut(s)) return { ok: false, message: MAXED_MSG };
    // Partial growth always succeeds: every frontier tip with open ground fans
    // out, even if rock walls off the others. Only when NOT ONE tip anywhere can
    // advance do we fail — and then we name the real reason (rock vs. too dense).
    const n = s.active.growRadial(s.substrate, s.rng);
    if (n > 0) return { ok: true, message: `Fanned out and colonised ${n} filaments.` };
    const reason = s.active.fanBlockReason(s.substrate);
    if (reason === 'cap') return { ok: false, message: MAXED_MSG };
    if (reason === 'crowded') return { ok: false, message: 'The colony is packed too tightly here to fan out any further.' };
    return { ok: false, message: 'Rock walls the colony in on every side — nowhere to fan out.' };
  }),
  'Tropic Lunge': grow((s) => {
    // Lunge from the strand closest to ANY food it hasn't reached yet, toward that
    // food — regardless of range (the nearest UNREACHED food on the whole map, even
    // far out of sensing range). Already-colonised piles don't count, so the lunge
    // strikes out toward fresh food instead of doubling back over what it already
    // holds. If a rock walls off the path it still grows as far as it can.
    if (maxedOut(s)) return { ok: false, message: MAXED_MSG };
    const n = s.active.growToNearestFood(s.substrate, s.rng, s.config.cards.lungeSegments);
    if (n > 0) return { ok: true, message: `Lunged ${n} toward the nearest food.` };
    if (s.active.hasFood(s.substrate)) return { ok: false, message: 'Blocked — rock walls off the path to every food source.' };
    return { ok: false, message: 'Every food pile has already been reached — nothing new to lunge toward.' };
  }),
  'Appressorial Punch': targeted((s, c, ctx) => {
    if (maxedOut(s)) return { ok: false, message: MAXED_MSG };
    const n = s.active.punchThrough(s.substrate, s.rng, ctx.x, ctx.y);
    if (n > 0) return { ok: true, message: `Bored through the rock — threaded ${n} hyphae.` };
    if (n < 0) return { ok: false, message: 'That rock is out of range — grow closer first.' };
    return { ok: false, message: 'No rock there to punch through.' };
  }),
  'Rhizomorph Lance': directional((s) => s.config.cards.reachSegments, (s, c, ctx) => {
    if (maxedOut(s)) return { ok: false, message: MAXED_MSG };
    const { dx, dy, tip } = dirFrom(s, ctx);
    const n = s.active.growDirected(s.substrate, s.rng, dx, dy, s.config.cards.reachSegments, true, tip);
    return n > 0 ? { ok: true, message: `Lanced ${n} cells forward.` } : { ok: false, message: 'Blocked — the lance hit rock.' };
  }),
  'Fruiting Vigil': directional(() => 24, (s, c, ctx) => {   // "up to 8 steps" (8 × 3 segments)
    if (maxedOut(s)) return { ok: false, message: MAXED_MSG };
    const { dx, dy, tip } = dirFrom(s, ctx);
    const n = s.active.growDirected(s.substrate, s.rng, dx, dy, 24, true, tip);
    checkGoalReached(s);
    return { ok: true, message: s.won ? 'Reached the goal!' : `Grew ${n} in your chosen direction.` };
  }),

  // --- substrate (Water) ---
  'Leaf Litter Cache': targeted((s, c, ctx) => { depositAtSensingEdge(s, ctx, s.config.cards.substrateSmall, 1); return { ok: true, message: 'Dropped a small patch at the sensing edge.' }; }),
  'Acorn Cache': targeted((s, c, ctx) => { depositAtSensingEdge(s, ctx, s.config.cards.substrateSmall, 1); return { ok: true, message: 'Buried a small nut cache at the sensing edge.' }; }),
  'Humus Bed': targeted((s, c, ctx) => { depositAtSensingEdge(s, ctx, s.config.cards.substrateMedium, 2); return { ok: true, message: 'Laid a medium patch at the sensing edge.' }; }),
  'Mycorrhizal Mat': targeted((s, c, ctx) => { depositAtSensingEdge(s, ctx, s.config.cards.substrateLarge, 3); return { ok: true, message: 'Spread a large mat at the sensing edge.' }; }),

  // --- digest (Phosphorus) ---
  'Saprotrophic Digest': grow((s) => {
    const net = s.active, sub = s.substrate;
    const cells = sub.cells.filter((c) => c.colonized > 0 && c.nutrient > 0 && !c.hazard);
    if (!cells.length) return { ok: false, message: 'No colonised substrate to digest.' };
    const d = s.config.actions.digest;
    let gained = 0;
    for (const cell of cells) { const take = Math.min(cell.nutrient, cell.maxNutrient * d.drainFraction); cell.nutrient -= take; gained += take; }
    const energy = Math.round(gained * s.config.energy.incomeEfficiency * 2);   // doubled
    net.energy += energy;
    return { ok: true, message: `Digest: +${energy}⚡.` };
  }),

  // --- harvest ---
  'Condense': grow((s) => {
    const cc = s.config.cards, before = s.active.water;
    s.active.water = gain(s.active.water, 5, cc.softCapWater);
    const got = s.active.water - before;
    return got > 0 ? { ok: true, message: `+${got} Water.` } : { ok: false, message: 'Water is already full.' };
  }),
  'Hyphal Imbibition': grow((s) => {
    const cc = s.config.cards; const amt = touchesLake(s) ? cc.harvestWaterLake : cc.harvestWaterSoil;
    const before = s.active.water;
    s.active.water = gain(s.active.water, amt, cc.softCapWater);
    const got = s.active.water - before;
    return got > 0 ? { ok: true, message: `+${got} Water${amt === cc.harvestWaterLake ? ' (lake)' : ''}.` } : { ok: false, message: 'Water is already full.' };
  }),
  'Phosphate Tap': grow((s) => {
    if (!touchesMineral(s)) return { ok: false, message: 'Not in contact with mineral rock.' };
    const cc = s.config.cards, before = s.active.phosphorus;
    s.active.phosphorus = gain(s.active.phosphorus, cc.harvestPhosphorus, cc.softCapPhosphorus);
    const got = s.active.phosphorus - before;
    return got > 0 ? { ok: true, message: `+${got} Phosphorus.` } : { ok: false, message: 'Phosphorus is already full.' };
  }),

  // --- energy ---
  'Rhizomorph Trunkline': engine({ energy: 2 }, 'Installed: +2⚡/round.'),
  'Osmotic Cashout': grow((s) => { s.active.energy += 22; return { ok: true, message: '+22⚡.' }; }),

  // --- resource engines ---
  'Aquaporin Channels': engine({ water: 1, every: 2 }, 'Installed: +1 Water every 2 rounds.'),
  'Phosphatase Cushion': engine({ phosphorus: 2, every: 8 }, 'Installed: +2 Phosphorus every 8 rounds.'),
  'Mineralizing Saprobe': engine({ phosphorus: 1, every: 5 }, 'Installed: +1 Phosphorus every 5 rounds.'),

  // --- installed ACTION: bore through an in-range rock on a cooldown ---
  // (Was an auto dig-engine; now a player-triggered ability per the card text.)
  'Tap-Root Rhizomorph': action({ effect: 'grow through an in-range rock', every: 10, cost: 2, res: 'phosphorus', target: true }, (s, ctx) => {
    const n = s.active.punchThrough(s.substrate, s.rng, ctx.x, ctx.y);
    if (n > 0) return { ok: true, message: `Bored through the rock — threaded ${n} hyphae.` };
    if (n < 0) return { ok: false, message: 'That rock is out of range — grow closer first.' };
    return { ok: false, message: 'No rock there to grow through.' };
  }),

  // --- utility (installed ACTION → Actions menu, right) ---
  // Once per round, spend 2 of your larger resource pool to gain 1 of the other.
  'Nutrient Transmutation': action({ effect: 'convert 2 of one resource → 1 of the other', per: 1 }, (s) => {
    const net = s.active;
    const pools = [['water', net.water], ['phosphorus', net.phosphorus]];
    pools.sort((a, b) => b[1] - a[1]);
    const from = pools[0], to = pools[1];
    if (from[1] < 2) return { ok: false, message: 'Need 2 of a resource to convert.' };
    net[from[0]] -= 2; net[to[0]] += 1;
    return { ok: true, message: `Converted 2 ${from[0]} → 1 ${to[0]}.` };
  }),

  // --- defense (best-effort v1) ---
  // Sclerotial Crust (basic) + Rehydration Pulse (event) stay one-shot plays.
  'Sclerotial Crust': targeted((s, c, ctx) => {
    const h = cureRadius(s, ctx, 60);
    // Permanent immunity to BOTH infection (mouldProof) and eating (hardened →
    // worms/ants skip these cells in nematodes.js / ants.js).
    s.substrate.cellsInRadius(ctx.x, ctx.y, 60 + s.substrate.cellSize, (cl) => { cl.mouldProof = 9999; cl.hardened = true; });
    return { ok: true, message: h ? `Hardened & cleared ${h} strands — permanently immune.` : 'Hardened the patch — permanently immune.' };
  }),
  'Rehydration Pulse': targeted((s, c, ctx) => { const h = cureRadius(s, ctx, 60); return { ok: true, message: h ? `Rehydrated ${h} strands.` : 'Rehydrated the area.' }; }),
  // --- installed ACTIONS (→ Actions menu, right) ---
  // Suberin Wall: every 3 rounds, tap a point → cure all infection in radius 80 AND
  // ward the cells there against reinfection for 2 rounds (cell.mouldProof).
  'Suberin Wall': action({ effect: 'clear mould + permanent ward', every: 8, cost: 3, res: 'phosphorus', target: true }, (s, ctx) => {
    const h = cureRadius(s, ctx, 80);
    // Ward a hair wider than the cure (cure tests node position, the ward tests cell
    // centre) so every cured node's cell is warded — no cured-but-unwarded rim.
    s.substrate.cellsInRadius(ctx.x, ctx.y, 80 + s.substrate.cellSize, (cl) => { cl.mouldProof = 9999; });   // permanent reinfection ward
    return { ok: true, message: h ? `Cured ${h} strands; permanently warded.` : 'Permanently warded the area against mould.' };
  }),
  // Constricting Ring: every 6 rounds (free), tap empty ground → lay a trap; the first
  // nematode to enter its radius is digested for +2 Phosphorus (resolved in tickWorld).
  'Constricting Ring': action({ effect: 'trap a nematode → +2✦', every: 6, target: true }, (s, ctx) => {
    const r = s.substrate.cellSize * 2.5;
    const cell = s.substrate.cellAtWorld(ctx.x, ctx.y);
    if (!cell || cell.rock) return { ok: false, message: 'Set the trap on open ground (not rock).' };
    const worms = s.nematodes || [];
    if (worms.some((w) => (w.x - ctx.x) ** 2 + (w.y - ctx.y) ** 2 <= r * r)) {
      return { ok: false, message: 'A nematode is already there — set the trap on empty ground.' };
    }
    (s.traps || (s.traps = [])).push({ x: ctx.x, y: ctx.y, r, reward: 2 });
    return { ok: true, message: 'Set a constricting trap — the next worm to enter is digested.' };
  }),
  // Sclerotial Seal: spend 1 Phosphorus, once per 4 rounds, tap a food pile → ant-proof it for 3 rounds.
  'Sclerotial Seal': action({ effect: 'permanently seal a food pile from ants', every: 10, cost: 1, res: 'phosphorus', target: true }, (s, ctx) => {
    const cell = s.substrate.cellAtWorld(ctx.x, ctx.y);
    if (!cell || cell.nutrient <= 0) return { ok: false, message: 'Tap a food pile to seal it.' };
    s.substrate.cellsInRadius(ctx.x, ctx.y, s.substrate.cellSize * 2, (cl) => { if (cl.nutrient > 0) cl.antProof = 9999; });
    return { ok: true, message: 'Sealed the pile — permanently ant-proof.' };
  }),
};

// Draw-engine cards (ARCHIVED only): shuffle 5 copies of a basic into the draw deck.
for (const [name, payload] of Object.entries(DRAW_ENGINES)) {
  EFFECTS[name] = grow((s) => {
    for (let i = 0; i < 5; i++) s.cards.drawDeck.push(payload);
    shuffle(s.cards.drawDeck, s.rng);
    return { ok: true, message: `Shuffled 5 ${payload} into the draw deck.` };
  });
}

// --- converted extenders --------------------------------------------------
// The former "draw 5 copies of X" extenders are now INSTALLED cards that repeat
// their effect every 6 rounds. Growth / bore / cache / defense ones install as
// player-triggered ACTIONS (right menu): ready every 6 rounds, aim + pay a per-use
// resource. Harvest ones install as passive resource ENGINES (left ledger). All

// =============================================================================

// and the trap is spent. Runs after the worms have moved this step.

//

// reveal window, so a single tendril is one soft hit while a big fan builds a
// layered swell. Hard caps keep it from overloading: at most MAX_LAYERS hits per

// Background music — lazy and non-blocking.
//
// The game boots and is fully playable BEFORE any music is fetched: initMusic()
// is called only after the map is ready. It then streams ONE random track in
// the background and starts it as soon as it can. Browser autoplay policy
// usually needs the first tap/click, so we also (re)try on the first user
// gesture. When a track ends, another random one loads — one at a time, so the
// whole ~13 MB playlist is never force-downloaded. A persisted mute toggle lets
// the player turn it off (and then nothing is fetched at all).

  'assets/music/backrooms-vol7.mp3',
  'assets/music/backrooms-vol10.mp3',
  'assets/music/backrooms-vol23.mp3',
  'assets/music/backrooms-vol29.mp3',
];

// the URL — music is large and rarely changes, so let the browser cache it
// across refreshes/deploys instead of re-downloading megabytes each time.

  let i = 0;
