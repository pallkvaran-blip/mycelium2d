'use strict';
// ===================== src/config.js =====================
const __m_config = (function () {
// =============================================================================
// CONFIG — every gameplay number lives here.

const CONFIG = {

  trichoderma: {

  render: {

// SLIDERS — the ~8 key constants exposed as live on-screen sliders (B7).
// Each references CONFIG by dotted path so edits take effect immediately.
// -----------------------------------------------------------------------------
const SLIDERS = [
  { path: 'energy.start',                label: 'Starting Energy',     min: 0,   max: 400, step: 5 },
  { path: 'turn.movesPerTurn',           label: 'Moves / Turn',        min: 1,   max: 8,   step: 1 },
  { path: 'energy.passiveIncomeRate',    label: 'Passive Income Rate', min: 0,   max: 30,  step: 1 },
  { path: 'actions.grow.energyCost',     label: 'Grow Energy Cost',    min: 0,   max: 40,  step: 1 },
  { path: 'trichoderma.spreadRate',      label: 'Trichoderma Spread',  min: 0,   max: 2,   step: 0.05 },
  { path: 'actions.fruit.payoutPerBody', label: 'Fruit Payout / Body', min: 0,   max: 40,  step: 1 },
  { path: 'actions.digest.burstSize',    label: 'Digest Burst Size',   min: 0,   max: 200, step: 5 },
  { path: 'actions.digest.energyCost',   label: 'Digest Energy Cost',  min: 0,   max: 40,  step: 1 },
  { path: 'actions.fruit.shadeMultiplier', label: 'Shade Multiplier',  min: 1,   max: 3,   step: 0.1 },
  { path: 'render.ambientLight',          label: 'Ambient Light',       min: 0.1, max: 1,   step: 0.05 },
];

// Read/write CONFIG by dotted path (used by the dev sliders).
function getByPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
}
function setByPath(obj, path, value) {
  const keys = path.split('.');
  const last = keys.pop();
  const target = keys.reduce((o, k) => o[k], obj);
  target[last] = value;
}

  return { CONFIG, SLIDERS, getByPath, setByPath };
})();

// ===================== src/engine/rng.js =====================
const __m_engine_rng = (function () {
// Tiny seedable PRNG (mulberry32). Kept in the engine so simulation is fully
// deterministic given a seed — important for reproducible runs and headless
// tests. The browser seeds it from the clock; tests seed it with a constant.
function makeRng(seed = 1) {
  let a = seed >>> 0;
  const rng = function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.int = (min, max) => Math.floor(rng() * (max - min + 1)) + min;
  rng.range = (min, max) => min + rng() * (max - min);
  rng.chance = (p) => rng() < p;
  rng.pick = (arr) => arr[Math.floor(rng() * arr.length)];
  return rng;
}

  return { makeRng };
})();

// ===================== src/engine/substrate.js =====================
const __m_engine_substrate = (function () {
// =============================================================================
// Substrate — the side-on cross-section field + surface line (A4, B1).
//
// Renderer-agnostic. Holds a grid of underground cells (nutrient / hazard /
// Trichoderma intensity) and a per-column surface description (soil vs non-soil,
// shade vs sun). All spatial queries the rest of the engine needs live here.
//
// Grid coordinate model:
//   - Columns span the full world width (col 0 at world x in [0, cellSize)).
//   - Rows span underground only: row 0 starts at world y = surfaceY.
// =============================================================================

class Substrate {
  constructor(config) {
    const { width, height, surfaceY, cellSize } = config.world;
    this.cellSize = cellSize;
    this.surfaceY = surfaceY;
    this.worldWidth = width;
    this.worldHeight = height;
    this.cols = Math.floor(width / cellSize);
    this.rows = Math.floor((height - surfaceY) / cellSize);
    // Flat cell array, indexed [row * cols + col].
    this.cells = new Array(this.cols * this.rows);
    for (let i = 0; i < this.cells.length; i++) {
      this.cells[i] = { nutrient: 0, maxNutrient: 0, hazard: false, rock: false, trich: 0, held: 0, colonized: 0 };
    }
    // Surface descriptor per column.
    this.surface = new Array(this.cols);
    for (let c = 0; c < this.cols; c++) this.surface[c] = { soil: true, shade: false };
  }

  // --- coordinate helpers --------------------------------------------------
  index(col, row) { return row * this.cols + col; }
  inBounds(col, row) { return col >= 0 && col < this.cols && row >= 0 && row < this.rows; }

  colAtX(x) { return Math.floor(x / this.cellSize); }
  rowAtY(y) { return Math.floor((y - this.surfaceY) / this.cellSize); }

  cellCenter(col, row) {
    return {
      x: col * this.cellSize + this.cellSize / 2,
      y: this.surfaceY + row * this.cellSize + this.cellSize / 2,
    };
  }

  cellAt(col, row) {
    return this.inBounds(col, row) ? this.cells[this.index(col, row)] : null;
  }
  cellAtWorld(x, y) {
    return this.cellAt(this.colAtX(x), this.rowAtY(y));
  }

  surfaceColumnAtX(x) {
    const c = this.colAtX(x);
    return c >= 0 && c < this.cols ? this.surface[c] : null;
  }

  // Iterate every cell with its grid coordinates.
  forEachCell(cb) {
    for (let row = 0; row < this.rows; row++) {
      for (let col = 0; col < this.cols; col++) {
        cb(this.cells[this.index(col, row)], col, row);
      }

  //    then mark shade on some soil columns.

  const hazards = [];

    const hc = rng.int(2, sub.cols - 3);
    const hr = rng.int(1, Math.max(1, sub.rows - 2));

    const rc = rng.int(2, sub.cols - 3);
    const rr = rng.int(2, Math.max(2, sub.rows - 2)); // keep off the very top row

      cc = nonSoilCols.length ? rng.pick(nonSoilCols) : rng.int(2, sub.cols - 3);
      cr = rng.int(1, Math.min(4, sub.rows - 1));

//

// touches, and avoids firmly-held ground. It is countered by:
//   - Amputate  (cut off infected strands)            -> network.amputate*
//   - Express -> Antifungal (slows & damages the mold) -> traits.antifungal
//   - Express -> Melanize  (reduces the damage it deals)-> traits.melanize

    octx.fillStyle = grad;
    octx.fillRect(0, 0, W, sy);

    // the sun — a soft daylight disc high in the sky
    const sunX = W * 0.72, sunY = sy * 0.32, sunR = sy * 0.42;
    const sg = octx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR);
    sg.addColorStop(0, r.sun);
    sg.addColorStop(0.07, r.sun);
    sg.addColorStop(1, 'rgba(255,250,232,0)');
    octx.fillStyle = sg;
    octx.fillRect(0, 0, W, sy);

    // warm daylight haze hugging the horizon
    const hg = octx.createLinearGradient(0, sy - 160, 0, sy);
    hg.addColorStop(0, 'rgba(0,0,0,0)');
    hg.addColorStop(1, r.horizonGlow);
    octx.fillStyle = hg;
    octx.fillRect(0, sy - 160, W, 160);

    // per-column light: warm over sunny soil, cool + canopy over shaded soil
    const cs = sub.cellSize;
    for (let c = 0; c < sub.cols; c++) {
      const surf = sub.surface[c];
      if (!surf.soil) continue;
      const x = c * cs;
      const wash = octx.createLinearGradient(0, sy - 150, 0, sy);
      wash.addColorStop(0, 'rgba(0,0,0,0)');
      wash.addColorStop(1, surf.shade ? r.shadeWash : r.sunWash);
      octx.fillStyle = wash;
      octx.fillRect(x, sy - 150, cs + 1, 150);
    }

    // soft foliage silhouettes above shaded runs
    octx.fillStyle = r.canopy;
    for (let c = 0; c < sub.cols; c++) {
      if (!(sub.surface[c].soil && sub.surface[c].shade)) continue;
      const x = c * cs + cs / 2;
      for (let k = 0; k < 2; k++) {
        const cy = 10 + this.rng() * 26;
        octx.globalAlpha = 0.5;
        octx.beginPath();
        octx.arc(x + this.rng() * cs - cs / 2, cy, cs * (0.5 + this.rng() * 0.5), 0, Math.PI * 2);
        octx.fill();
      }
    }
    octx.globalAlpha = 1;
  }

  // Earth painted as a colour field: depth gradient modulated by fbm + strata.
  _bakeEarth() {
    const sub = this.substrate;
    const r = this.config.render;
    const W = this.base.width, sy = sub.surfaceY, gh = this.base.height - sy;
    const scale = 4;
    const tw = Math.ceil(W / scale), th = Math.ceil(gh / scale);
    const tex = makeCanvas(tw, th);
    const tctx = tex.getContext('2d');
    const img = tctx.createImageData(tw, th);
    const d = img.data;
    const top = hexToRgb(r.soilTop), mid = hexToRgb(r.soilMid), deep = hexToRgb(r.soilDeep);

    for (let ty = 0; ty < th; ty++) {
      const worldY = sy + (ty / th) * gh;
      const depth = (worldY - sy) / gh;
      const col = depth < 0.35
        ? lerpRgb(top, mid, depth / 0.35)
        : lerpRgb(mid, deep, (depth - 0.35) / 0.65);
      for (let tx = 0; tx < tw; tx++) {
        const wx = (tx / tw) * W;
        const n = this.noise.fbm(wx * 0.006, worldY * 0.006, 4);
        const strata = Math.sin(worldY * 0.03 + this.noise.noise2(wx * 0.002, worldY * 0.01) * 3) * 0.5;
        const b = 1 + n * 0.22 + strata * 0.08;
        const i = (ty * tw + tx) * 4;
        d[i] = clamp255(col[0] * b);
        d[i + 1] = clamp255(col[1] * b);
        d[i + 2] = clamp255(col[2] * b);
        d[i + 3] = 255;
      }
    }
    tctx.putImageData(img, 0, 0);
    this.baseCtx.imageSmoothingEnabled = true;
    this.baseCtx.drawImage(tex, 0, 0, tw, th, 0, sy, W, gh);
  }

  _bakeVeins() {
    const octx = this.baseCtx;
    const r = this.config.render;
    const sub = this.substrate;
    const W = this.base.width, sy = sub.surfaceY, H = this.base.height;
    octx.strokeStyle = r.vein;
    octx.lineCap = 'round';
    const veins = Math.max(4, Math.floor(W / 380));
    for (let v = 0; v < veins; v++) {
      let x = this.rng() * W;
      let y = sy + this.rng() * (H - sy) * 0.4;
      let ang = Math.PI / 2 + (this.rng() - 0.5);
      const steps = 20 + Math.floor(this.rng() * 30);
      octx.lineWidth = this.rng() * 1.2 + 0.5;
      octx.globalAlpha = this.rng() * 0.3 + 0.2;
      octx.beginPath();
      octx.moveTo(x, y);
      for (let s = 0; s < steps; s++) {
        ang += (this.noise.noise2(x * 0.01, y * 0.01)) * 0.6;
        x += Math.cos(ang) * 14;
        y += Math.abs(Math.sin(ang)) * 14 + 4;
        if (y > H) break;
        octx.lineTo(x, y);
      }
      octx.stroke();
    }
    octx.globalAlpha = 1;
  }

  _bakeRocks() {
    const octx = this.baseCtx;
    const r = this.config.render;
    const sub = this.substrate;
    const W = this.base.width, sy = sub.surfaceY, gh = this.base.height - sy;
    const count = Math.floor((W * gh) / 26000);
    for (let i = 0; i < count; i++) {
      const x = this.rng() * W;
      const y = sy + Math.pow(this.rng(), 0.8) * gh;
      const rr = this.rng() * 7 + 2;
      const rot = this.rng() * Math.PI;
      // body
      octx.save();
      octx.translate(x, y);
      octx.rotate(rot);
      octx.fillStyle = r.rock;
      octx.beginPath();
      octx.ellipse(0, 0, rr, rr * (0.6 + this.rng() * 0.3), 0, 0, Math.PI * 2);
      octx.fill();
      // bottom shadow
      octx.fillStyle = 'rgba(0,0,0,0.28)';
      octx.beginPath();
      octx.ellipse(0, rr * 0.25, rr * 0.9, rr * 0.45, 0, 0, Math.PI * 2);
      octx.fill();
      // top lip highlight
      octx.fillStyle = r.rockLip;
      octx.globalAlpha = 0.5;
      octx.beginPath();
      octx.ellipse(-rr * 0.2, -rr * 0.3, rr * 0.5, rr * 0.25, 0, 0, Math.PI * 2);
      octx.fill();
      octx.restore();
    }
    octx.globalAlpha = 1;
  }

  _bakeFlecks() {
    const octx = this.baseCtx;
    const r = this.config.render;
    const sub = this.substrate;
    const W = this.base.width, sy = sub.surfaceY, gh = this.base.height - sy;
    octx.fillStyle = r.fleck;
    const count = Math.floor((W * gh) / 2600);
    for (let i = 0; i < count; i++) {
      octx.globalAlpha = this.rng() * 0.4 + 0.1;
      octx.fillRect(this.rng() * W, sy + this.rng() * gh, 1, 1);
    }
    octx.globalAlpha = 1;
  }

  // Impassable rock formations — solid faceted stone the mycelium routes around.
  _bakeRockFormations() {
    const octx = this.baseCtx;
    const r = this.config.render;
    const sub = this.substrate;
    const cs = sub.cellSize, sy = sub.surfaceY;

    const cells = [];
    sub.forEachCell((cell, col, row) => { if (cell.rock) cells.push([col, row]); });
    if (!cells.length) return;

    const unionPath = () => {
      octx.beginPath();
      for (const [col, row] of cells) {
        const cx = col * cs + cs / 2, cy = sy + row * cs + cs / 2;
        octx.moveTo(cx + cs * 0.78, cy);
        octx.arc(cx, cy, cs * 0.78, 0, Math.PI * 2);
      }
    };

    // solid body with a soft drop shadow so it sits in the earth
    octx.save();
    octx.shadowColor = r.rockShadow;
    octx.shadowBlur = 9;
    octx.shadowOffsetY = 4;
    octx.fillStyle = r.rockMass;
    unionPath();
    octx.fill();
    octx.restore();

    // facets, cracks and top-light, clipped to the formation
    octx.save();
    unionPath();
    octx.clip();
    // angular facets
    for (const [col, row] of cells) {
      const cx = col * cs + cs / 2, cy = sy + row * cs + cs / 2;
      octx.fillStyle = r.rockFacet;
      octx.globalAlpha = 0.2 + h2(col, row) * 0.3;
      const a0 = h2(col, row) * 6.283;
      octx.beginPath();
      octx.moveTo(cx, cy);
      for (let k = 0; k < 3; k++) {
        const a = a0 + k * 2.1;
        octx.lineTo(cx + Math.cos(a) * cs * 0.55, cy + Math.sin(a) * cs * 0.5);
      }
      octx.closePath();
      octx.fill();
    }
    octx.globalAlpha = 1;
    // cracks
    octx.strokeStyle = r.rockEdge;
    octx.lineWidth = 1.4;
    for (const [col, row] of cells) {
      if (h2(col * 3, row * 3) < 0.55) continue;
      const cx = col * cs + cs / 2, cy = sy + row * cs + cs / 2;
      const a = h2(col, row) * 3.14;
      octx.beginPath();
      octx.moveTo(cx - Math.cos(a) * cs * 0.5, cy - Math.sin(a) * cs * 0.5);
      octx.lineTo(cx + Math.cos(a) * cs * 0.6, cy + Math.sin(a) * cs * 0.55);
      octx.stroke();
    }
    // top highlight -> bottom shadow across the whole formation
    const gg = octx.createLinearGradient(0, sy, 0, this.base.height);
    gg.addColorStop(0, 'rgba(255,255,255,0.10)');
    gg.addColorStop(0.5, 'rgba(0,0,0,0)');
    gg.addColorStop(1, 'rgba(0,0,0,0.28)');
    octx.fillStyle = gg;
    octx.fillRect(0, sy, this.base.width, this.base.height - sy);
    octx.restore();
  }

  _bakeHazards() {
    const octx = this.baseCtx;
    const r = this.config.render;
    const sub = this.substrate;
    const cs = sub.cellSize, sy = sub.surfaceY;

    // Collect hazard cells; bail early if there are none.
    const cells = [];
    sub.forEachCell((cell, col, row) => { if (cell.hazard) cells.push([col, row]); });
    this.hazardLightPoints = cells.map(([col, row]) => sub.cellCenter(col, row));
    if (!cells.length) return;

    // Build one path that is the UNION of soft circles over the hazard cells.
    const unionPath = () => {
      octx.beginPath();
      for (const [col, row] of cells) {
        const cx = col * cs + cs / 2, cy = sy + row * cs + cs / 2;
        octx.moveTo(cx + cs * 0.82, cy);
        octx.arc(cx, cy, cs * 0.82, 0, Math.PI * 2);
      }
    };

    // 1) Body + a single continuous caustic glow around the whole pool.
    octx.save();
    octx.shadowColor = r.hazardCaustic;
    octx.shadowBlur = 13;
    octx.fillStyle = r.hazardDeep;
    unionPath();
    octx.fill();
    octx.restore();

    // 2) Everything else is clipped to the pool so it reads as one liquid body.
    octx.save();
    unionPath();
    octx.clip();

    // dappled lit surface
    for (const [col, row] of cells) {
      const cx = col * cs + cs / 2, cy = sy + row * cs + cs / 2;
      const rad = cs * 0.9;
      const g = octx.createRadialGradient(cx, cy - cs * 0.2, 0, cx, cy, rad);
      g.addColorStop(0, withAlpha(hexToRgb(r.hazardMid), 0.8));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      octx.fillStyle = g;
      octx.beginPath();
      octx.arc(cx, cy, rad, 0, Math.PI * 2);
      octx.fill();
    }

    // caustic ripples + bubbles
    octx.strokeStyle = r.hazardCaustic;
    octx.lineWidth = 1;
    for (const [col, row] of cells) {
      const x0 = col * cs, y0 = sy + row * cs;
      octx.globalAlpha = 0.45;
      for (let k = 0; k < 2; k++) {
        const yy = y0 + this.rng() * cs;
        octx.beginPath();
        octx.moveTo(x0, yy);
        octx.quadraticCurveTo(x0 + cs * 0.5, yy - 3, x0 + cs, yy);
        octx.stroke();
      }
      octx.fillStyle = r.hazardBubble;
      octx.globalAlpha = 0.5;
      for (let k = 0; k < 2; k++) {
        octx.beginPath();
        octx.arc(x0 + this.rng() * cs, y0 + this.rng() * cs, this.rng() * 1.6 + 0.6, 0, Math.PI * 2);
        octx.fill();
      }
    }
    octx.globalAlpha = 1;
    octx.restore();
  }

  _bakeSurface() {
    const octx = this.baseCtx;
    const r = this.config.render;
    const sub = this.substrate;
    const cs = sub.cellSize, sy = sub.surfaceY;

    for (let c = 0; c < sub.cols; c++) {
      const surf = sub.surface[c];
      const x = c * cs;
      const jitter = this.noise.noise2(c * 0.32, 7) * 4;
      const lineY = sy + jitter;

      if (surf.soil) {
        // topsoil crust + rim light
        const cg = octx.createLinearGradient(0, lineY - 2, 0, lineY + 16);
        cg.addColorStop(0, r.crust);
        cg.addColorStop(1, r.soilTop);
        octx.fillStyle = cg;
        octx.fillRect(x, lineY, cs + 1, 18);
        octx.fillStyle = r.crustLip;
        octx.globalAlpha = 0.6;
        octx.fillRect(x, lineY - 1, cs + 1, 1.5);
        octx.globalAlpha = 1;
        // grass blades
        const blades = 3 + Math.floor(this.rng() * 3);
        for (let b = 0; b < blades; b++) {
          const bx = x + this.rng() * cs;
          const h = 6 + this.rng() * 9;
          const sway = (this.rng() - 0.5) * 7;
          octx.strokeStyle = surf.shade ? r.grassShade : r.grassSun;
          octx.globalAlpha = 0.85;
          octx.lineWidth = 1.4;
          octx.beginPath();
          octx.moveTo(bx, lineY);
          octx.quadraticCurveTo(bx + sway * 0.5, lineY - h * 0.6, bx + sway, lineY - h);
          octx.stroke();
        }
        octx.globalAlpha = 1;
      } else {
        // non-soil: a hard concrete/rock cap — no fruiting here
        octx.fillStyle = r.concrete;
        octx.fillRect(x, lineY - 4, cs + 1, 20);
        octx.fillStyle = 'rgba(255,255,255,0.06)';
        octx.fillRect(x, lineY - 4, cs + 1, 2);
        octx.strokeStyle = r.concreteCrack;
        octx.lineWidth = 1;
        for (let k = 0; k < 2; k++) {
          const cxs = x + this.rng() * cs;
          octx.beginPath();
          octx.moveTo(cxs, lineY - 4);
          octx.lineTo(cxs + (this.rng() - 0.5) * 6, lineY + 12);
          octx.stroke();
        }
        octx.fillStyle = 'rgba(0,0,0,0.25)';
        for (let k = 0; k < 3; k++) octx.fillRect(x + this.rng() * cs, lineY + this.rng() * 12, 1, 1);
      }
    }
  }

  // =========================================================================
  // DYNAMIC LAYER (nutrient + Trichoderma)
  // =========================================================================
  _bakeDynamic() {
    const octx = this.dynCtx;
    const r = this.config.render;
    const sub = this.substrate;
    const cs = sub.cellSize, sy = sub.surfaceY;
    octx.clearRect(0, 0, this.dyn.width, this.dyn.height);
    this.foodLightPoints = [];
    octx.lineCap = 'round';

    // Substrate = decaying organic matter (rotting wood + leaf litter) that the
    // mycelium colonises and overgrows. Per-cell detail is hashed from the
    // cell coords so it stays put between re-bakes (no shimmer).
    sub.forEachCell((cell, col, row) => {
      if (cell.hazard || cell.maxNutrient <= 0) return;
      const cx = col * cs + cs / 2, cy = sy + row * cs + cs / 2;
      const rem = Math.min(1, cell.nutrient / this.nutrientRef);  // matter left
      const colo = cell.colonized;                                 // 0..1

      // --- the decaying matter itself (shrinks as it's digested) ---
      if (rem > 0.02) {
        if (rem > 0.2) this.foodLightPoints.push({ x: cx, y: cy, i: rem });
        const base = cs * (0.45 + rem * 0.5);
        // dark rotting mass (overlapping lumps — packed dense)
        octx.fillStyle = withAlpha(hexToRgb(r.detritusBase), 0.62 + 0.35 * rem);
        for (let k = 0; k < 6; k++) {
          const ox = (h2(col + k * 4, row + k) * 2 - 1) * base * 0.5;
          const oy = (h2(col + k, row + k * 4) * 2 - 1) * base * 0.5;
          octx.beginPath();
          octx.arc(cx + ox, cy + oy, base * (0.45 + 0.35 * h2(col + k, row - k)), 0, Math.PI * 2);
          octx.fill();
        }
        // woody chips / twigs
        octx.strokeStyle = r.detritusWood;
        for (let k = 0; k < 5; k++) {
          const a = h2(col * 2 + k, row + k * 5) * 6.283;
          const len = cs * 0.26 * (0.6 + rem);
          const px = cx + (h2(col + k * 7, row + k) * 2 - 1) * base * 0.6;
          const py = cy + (h2(col + k, row + k * 7) * 2 - 1) * base * 0.6;
          octx.lineWidth = 1.6 + h2(col + k, row * 2 + k) * 2;
          octx.beginPath();
          octx.moveTo(px - Math.cos(a) * len, py - Math.sin(a) * len);
          octx.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len);
          octx.stroke();
        }
        // leaf-litter flecks
        octx.fillStyle = r.detritusLeaf;
        for (let k = 0; k < 8; k++) {
          const px = cx + (h2(col * 3 + k, row + k) * 2 - 1) * base;
          const py = cy + (h2(col + k, row * 3 + k) * 2 - 1) * base;
          octx.save();
          octx.translate(px, py);
          octx.rotate(h2(col + k, row + k) * 6.283);
          octx.fillStyle = withAlpha(hexToRgb(r.detritusLeaf), 0.85);
          octx.fillRect(-2.6, -1.1, 5.2, 2.2);
          octx.restore();
        }
      }

      // --- mycelial mat threading through + thickening as it colonises ---
      if (colo > 0.02) {
        // Soft radial falloff (not a hard disc) so adjacent colonised cells
        // blend into one continuous mat instead of a grid of white circles.
        const matA = 0.04 + 0.16 * colo * colo;
        const matR = cs * 0.85;
        const mg = octx.createRadialGradient(cx, cy, 0, cx, cy, matR);
        mg.addColorStop(0, `rgba(${r.mat},${matA})`);
        mg.addColorStop(0.6, `rgba(${r.mat},${matA * 0.6})`);
        mg.addColorStop(1, `rgba(${r.mat},0)`);
        octx.fillStyle = mg;
        octx.beginPath();
        octx.arc(cx, cy, matR, 0, Math.PI * 2);
        octx.fill();
        const threads = Math.floor(1 + colo * colo * 11);  // sparse early, dense when full
        octx.strokeStyle = `rgba(${r.mat},${0.18 * colo + 0.06})`;
        octx.lineWidth = 0.7 + colo * 0.9;
        for (let k = 0; k < threads; k++) {
          const a = h2(col + k * 13, row + k * 5) * 6.283;
          const lx = cx + (h2(col * 5 + k, row + k) * 2 - 1) * cs * 0.5;
          const ly = cy + (h2(col + k, row * 5 + k) * 2 - 1) * cs * 0.5;
          octx.beginPath();
          octx.moveTo(lx - Math.cos(a) * cs * 0.42, ly - Math.sin(a) * cs * 0.42);
          octx.quadraticCurveTo(lx, ly, lx + Math.cos(a) * cs * 0.42, ly + Math.sin(a) * cs * 0.42);
          octx.stroke();
        }
        if (colo > 0.4) {
          octx.fillStyle = `rgba(${r.mat},${0.5 * colo})`;
          for (let k = 0; k < 3; k++) {
            octx.beginPath();
            octx.arc(cx + (h2(col + k, row + k * 2) * 2 - 1) * cs * 0.4,
                     cy + (h2(col + k * 2, row + k) * 2 - 1) * cs * 0.4, 0.9 + colo, 0, Math.PI * 2);
            octx.fill();
          }
        }
      }
    });

    // Trichoderma — fuzzy speckled growth.
    sub.forEachCell((cell, col, row) => {
      if (cell.trich <= 0) return;
      const a = Math.min(0.8, cell.trich);
      const cx = col * cs + cs / 2, cy = sy + row * cs + cs / 2;
      const rad = cs * 0.8;
      const g = octx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, withAlpha(hexToRgb(r.trich), a));
      g.addColorStop(1, withAlpha(hexToRgb(r.trich), 0));
      octx.fillStyle = g;
      octx.beginPath();
      octx.arc(cx, cy, rad, 0, Math.PI * 2);
      octx.fill();
      octx.fillStyle = withAlpha(hexToRgb(r.trichSpore), a * 0.7);
      for (let k = 0; k < 4; k++) {
        octx.beginPath();
        octx.arc(col * cs + this.rng() * cs, sy + row * cs + this.rng() * cs, this.rng() * 1.3 + 0.4, 0, Math.PI * 2);
        octx.fill();
      }
      octx.fillStyle = r.trichSpore;
    });

    this.dynamicDirty = false;
  }

  // =========================================================================
  // ATMOSPHERE (drifting spores in the air, motes in the earth)
  // =========================================================================
  _initParticles() {
    const sub = this.substrate;
    const n = this.config.render.particleCount;
    const arr = [];
    for (let i = 0; i < n; i++) {
      const air = this.rng() < 0.42;
      arr.push({
        x: this.rng() * sub.worldWidth,
        y: air ? this.rng() * sub.surfaceY : sub.surfaceY + this.rng() * (sub.worldHeight - sub.surfaceY),
        r: (air ? 1.0 : 0.8) + this.rng() * 1.1,
        phase: this.rng() * Math.PI * 2,
        ax: this.rng() * 18 + 8,
        ay: this.rng() * 12 + 5,
        spd: this.rng() * 0.0004 + 0.00018,
        air,
      });
    }
    return arr;
  }

  drawAtmosphere(ctx, camera, time) {
    const r = this.config.render;
    const vw = camera.viewW, vh = camera.viewH;
    for (const p of this.particles) {
      const wx = p.x + Math.sin(time * p.spd + p.phase) * p.ax;
      const wy = p.y + Math.cos(time * p.spd * 0.8 + p.phase) * p.ay;
      const s = camera.worldToScreen(wx, wy);
      if (s.x < -8 || s.x > vw + 8 || s.y < -8 || s.y > vh + 8) continue;
      const rad = p.r * camera.zoom * (0.7 + 0.3 * Math.sin(time * 0.003 + p.phase));
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rad * 3);
      g.addColorStop(0, p.air ? r.spore : r.mote);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(s.x, s.y, rad * 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// --- helpers ---------------------------------------------------------------
function makeCanvas(w, h) {
  const c = document.createElement('canvas');

// vitality/brightness (A5) without change.

// --- Fruiting bodies rising through the soil line (A8) ----------------------
function drawFruitBodies(ctx, camera, points, time, preview = false) {
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const base = camera.worldToScreen(p.x, p.y);
    const grow = preview ? 0.5 : Math.min(1, (Math.sin(time * 0.003 + i) * 0.1 + 0.9));
    const h = 26 * camera.zoom * grow;
    const capR = 10 * camera.zoom * grow;
    const stalkW = 3.5 * camera.zoom;
    const topY = base.y - h;
    ctx.save();
    ctx.globalAlpha = preview ? 0.45 : 1;
    // stalk
    ctx.strokeStyle = '#e8e0d0';
    ctx.lineWidth = stalkW;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(base.x, base.y);
    ctx.lineTo(base.x, topY);
    ctx.stroke();

    ctx.fillStyle = p.shade ? '#9a6cff' : '#caa15a';
    ctx.beginPath();
    ctx.ellipse(base.x, topY, capR, capR * 0.7, 0, Math.PI, 0);
    ctx.fill();
    ctx.restore();
  }
}

const __m_render_lighting = (function () {
// =============================================================================
// Lighting — dynamic 2D lighting for the cross-section (render only).
//
// The underground is dimmed to an ambient darkness, then light is added back
// where things glow: the living network (mint), nutrient pockets (warm) and
// toxic pools (teal). Composited over the scene with a multiply pass, so areas
// far from any light fall into shadow and the colony reads as a light source in
// the dark — which also makes distant food/danger glow as points of interest.
//
// Performance: lights are drawn from a few pre-rendered radial "glow sprites"
// (one drawImage each) instead of building a gradient per light per frame, so
// it stays cheap even on phones.
// =============================================================================

class Lighting {
  constructor(config) {
    this.config = config;
    this.canvas = document.createElement('canvas');
    this.lctx = this.canvas.getContext('2d');
    const r = config.render;
    this.spriteNetwork = makeGlowSprite(r.networkLight);
    this.spriteFood = makeGlowSprite(r.foodLight);
    this.spriteHazard = makeGlowSprite(r.hazardLight);
  }

  // Dim the scene already drawn to `ctx` and add the colony's light back in.
  compose(ctx, camera, state, networkRenderers, substrateRenderer, time = 0) {
    const r = this.config.render;
    if (!r.lighting || r.ambientLight >= 1) return; // lighting off / no darkening
    const breath = 0.86 + 0.14 * Math.sin(time * (Math.PI * 2 / 4200)); // slow glow breath
    const W = camera.viewW, H = camera.viewH;
    if (this.canvas.width !== W || this.canvas.height !== H) {
      this.canvas.width = W; this.canvas.height = H;
    }
    const lc = this.lctx;

    // 1) Darken ONLY the underground; the daytime sky above stays bright (the
    //    light map is white over the sky, so the multiply leaves it untouched).
    const a = r.ambientLight;
    // warm tint so unlit earth reads as brown, not cold black
    const amb = `rgb(${clamp255(255 * a)},${clamp255(255 * a * 0.92)},${clamp255(255 * a * 0.8)})`;
    lc.globalCompositeOperation = 'source-over';
    const surfY = camera.worldToScreen(0, state.substrate.surfaceY).y;
    const band = 50; // soft transition across the soil line
    const ay = Math.max(0, Math.min(H, surfY - band));
    const by = Math.max(0, Math.min(H, surfY + band));
    lc.fillStyle = '#ffffff';
    lc.fillRect(0, 0, W, ay);
    if (by > ay) {
      const tg = lc.createLinearGradient(0, ay, 0, by);
      tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, amb);
      lc.fillStyle = tg; lc.fillRect(0, ay, W, by - ay);
    }
    lc.fillStyle = amb;
    lc.fillRect(0, by, W, H - by);

    // 2) Add light from every emitter (additive).
    lc.globalCompositeOperation = 'lighter';
    const baseR = r.lightRadius * camera.zoom;

    // Nutrient pockets — warm glow.
    if (substrateRenderer) {
      for (const p of substrateRenderer.foodLightPoints) {
        this._light(lc, camera, this.spriteFood, p.x, p.y, baseR * (0.7 + p.i * 0.6), 0.5 + p.i * 0.4, W, H);
      }
      // Toxic pools — teal glow.
      const hp = substrateRenderer.hazardLightPoints;
      const hs = Math.max(1, Math.ceil(hp.length / 60));
      for (let i = 0; i < hp.length; i += hs) {
        this._light(lc, camera, this.spriteHazard, hp[i].x, hp[i].y, baseR * 1.0, 0.6, W, H);
      }
    }

    // The living network — mint glow following the filaments.
    for (const net of state.networks) {
      if (!net.alive && !net.fruited) continue;
      const bright = (0.35 + 0.65 * net.vitality) * breath;
      const nodes = net.nodes;
      const stride = Math.max(1, Math.ceil(nodes.length / 160));
      for (let i = 0; i < nodes.length; i += stride) {
        const n = nodes[i];
        this._light(lc, camera, this.spriteNetwork, n.x, n.y, baseR * 0.95, bright * 0.85 * n.health, W, H);
      }
    }

    // 3) Multiply the light map over the scene.
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(this.canvas, 0, 0);
    ctx.restore();

    // 4) Gentle additive bloom from the same lights for a soft halo.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.18;
    ctx.drawImage(this.canvas, 0, 0);
    ctx.restore();
  }

  _light(lc, camera, sprite, wx, wy, rad, alpha, W, H) {
    const s = camera.worldToScreen(wx, wy);
    if (s.x < -rad || s.x > W + rad || s.y < -rad || s.y > H + rad) return;
    lc.globalAlpha = Math.max(0, Math.min(1, alpha));
    lc.drawImage(sprite, s.x - rad, s.y - rad, rad * 2, rad * 2);
  }
}

// A radial glow sprite: solid colour at the centre fading to transparent.
function makeGlowSprite(color) {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  const rgb = color.replace(/rgba?\(/, '').replace(')', '').split(',').slice(0, 3).map((s) => s.trim());
  grd.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},1)`);
  grd.addColorStop(0.5, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.35)`);
  grd.addColorStop(1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  return c;
}

  return { Lighting };
})();

    this.el.endBtn = endBtn;
    const restartBtn = button('btn restart', 'New Map ↻');
    restartBtn.onclick = () => this.handlers.onRestart();
    ctrl.appendChild(endBtn);
    ctrl.appendChild(restartBtn);
    bar.appendChild(ctrl);

    root.appendChild(bar);

    // ---- Hint line ----
    this.el.hint = div('hint');
    this.el.hint.textContent = 'Hover an action for details. Grow extends the network toward sensed food.';
    root.appendChild(this.el.hint);

    // ---- Right column: event log ----
    const logPanel = div('panel logpanel');
    logPanel.innerHTML = `<div class="title">Event Log</div><div class="loglist" id="loglist"></div>`;
    root.appendChild(logPanel);
    this.el.loglist = logPanel.querySelector('#loglist');

    // ---- "What we're testing" (pinned, collapsible) ----
    const testing = div('panel testing' + maybeCollapsed);
    testing.innerHTML = `<div class="title clickable">What we're testing <span class="chev">▾</span></div>`;
    const list = div('testing-list');
    list.innerHTML = TESTING_QUESTIONS.map((q, i) => `<div class="q"><b>${i + 1}.</b> ${q}</div>`).join('');
    testing.appendChild(list);
    testing.querySelector('.title').onclick = () => testing.classList.toggle('collapsed');
    root.appendChild(testing);

    // ---- Dev panel (cheats + sliders), clearly marked ----
    if (this.state.config.dev.enabled) {
      const dev = div('panel dev' + maybeCollapsed);
      dev.innerHTML = `<div class="title clickable">DEV TOOLS <span class="warn">(remove for release)</span> <span class="chev">▾</span></div>`;
      const body = div('dev-body');

      const cheats = div('cheats');
      const c1 = button('btn dev-btn', `+${this.state.config.dev.cheatEnergy} Energy`);
      c1.onclick = () => this.handlers.onCheat('energy');
      const c2 = button('btn dev-btn', `+${this.state.config.dev.cheatSpores} Spores`);
      c2.onclick = () => this.handlers.onCheat('spores');
      const c3 = button('btn dev-btn', 'Spawn Trichoderma');
      c3.onclick = () => this.handlers.onCheat('trichoderma');
      cheats.append(c1, c2, c3);
      body.appendChild(cheats);

      const sliders = div('sliders');
      for (const s of SLIDERS) {
        const wrap = div('slider');
        const val = getByPath(this.state.config, s.path);
        wrap.innerHTML = `<label>${s.label} <span class="sv">${val}</span></label>`;
        const input = document.createElement('input');
        input.type = 'range';
        input.min = s.min; input.max = s.max; input.step = s.step; input.value = val;
        const sv = wrap.querySelector('.sv');
        input.oninput = () => {
          const v = parseFloat(input.value);
          setByPath(this.state.config, s.path, v);
          sv.textContent = v;
          this.handlers.onSliderChange(s.path, v);
        };
        wrap.appendChild(input);
        sliders.appendChild(wrap);
      }
      body.appendChild(sliders);
      dev.appendChild(body);
      dev.querySelector('.title').onclick = () => dev.classList.toggle('collapsed');
      root.appendChild(dev);
    }

    // ---- Run-over overlay ----
    this.el.overlay = div('overlay hidden');
    root.appendChild(this.el.overlay);
  }

  _actionButton(name) {
    const a = ACTIONS[name];
    const b = button('btn act', '');
    b.dataset.action = name;
    b.title = a.desc;
    b.onclick = () => this.handlers.onAction(name);
    if (name === 'fruit') {
      b.onmouseenter = () => this.handlers.onFruitPreview(true);
      b.onmouseleave = () => this.handlers.onFruitPreview(false);
    }
    this.el.buttons[name] = b;
    return b;
  }

  setSelectedAction(name) {
    this.selectedAction = name;
    for (const [key, btn] of Object.entries(this.el.buttons)) {
      btn.classList.toggle('selected', key === name);
    }
    const hints = {
      addSubstrate: 'Click underground to place a food patch and lure growth there.',
      amputate: 'Click a strand to cut it (and everything downstream).',
    };
    if (name && hints[name]) this.setHint(hints[name]);
  }

  setHint(text) { this.el.hint.textContent = text; }

  showOverlay(result) {
    const o = this.el.overlay;
    o.classList.remove('hidden');
    const died = result && result.died;
    o.innerHTML = `
      <div class="card">
        <h1>${died ? 'The colony has died' : 'The network has fruited'}</h1>
        <p>${died
          ? 'Trichoderma and hazards overwhelmed the network before it could fruit.'
          : `It pushed up <b>${result.bodies}</b> fruiting bodies and released <b>${result.spores}</b> spores.`}</p>
        <p class="dim">Total Spores this run: <b>${this.state.spores}</b></p>
        <p class="dim small">In the full game these spores would seed the next generation. Phase 1 ends here.</p>
        <button class="btn big" id="overlay-restart">Begin a new colony ↻</button>
      </div>`;
    o.querySelector('#overlay-restart').onclick = () => this.handlers.onRestart();
  }
  hideOverlay() { this.el.overlay.classList.add('hidden'); }

  update() {
    const s = this.state;
    const net = s.active;
    text('hud-energy', Math.floor(net.energy));
    text('hud-spores', Math.floor(s.spores));
    text('hud-turn', s.turn);
    text('hud-moves', `${s.movesLeft}/${s.config.turn.movesPerTurn}`);
    const vfill = document.getElementById('hud-vitality');
    if (vfill) {
      vfill.style.width = `${Math.round(net.vitality * 100)}%`;
      vfill.style.background = vitalityColor(net.vitality);
    }

    // Express trait readout
    const traitsEl = document.getElementById('hud-traits');
    if (traitsEl) {
      traitsEl.innerHTML = TRAITS.map((t) => {
        const lvl = net.traits[t.key];
        return `<span class="tr ${lvl > 0 ? 'on' : ''}">${t.label[0]}${t.label[1]}<b>${lvl}</b></span>`;
      }).join('');
    }

    // Button states / costs
    for (const name of ['grow', 'addSubstrate', 'amputate', 'digest', 'fruit']) {
      const btn = this.el.buttons[name];
      if (!btn) continue;
      const { moves, energy } = actionCost(s, name);
      btn.innerHTML = `${ACTIONS[name].label} <span class="cost">${energy}⚡ ${moves}◆</span>`;
      btn.disabled = s.runOver || s.movesLeft < moves || net.energy < energy || !net.alive;
    }
    // Express trait buttons (dynamic cost)
    for (const t of TRAITS) {
      const btn = this.el.buttons['express:' + t.key];
      if (!btn) continue;
      const lvl = net.traits[t.key];
      const cost = net.expressCost(t.key);
      const maxed = lvl >= s.config.actions.express.maxLevel;
      btn.innerHTML = `${t.label} <span class="lvl">L${lvl}</span> <span class="cost">${maxed ? 'MAX' : cost + '⚡'}</span>`;
      btn.disabled = s.runOver || maxed || s.movesLeft < s.config.actions.express.moveCost
        || net.energy < cost || !net.alive;
    }
    this.el.endBtn.disabled = s.runOver;

    this._renderLog();
  }

  _renderLog() {
    const list = this.el.loglist;
    if (!list) return;
    const entries = this.state.logEntries.slice(-40);
    list.innerHTML = entries
      .map((e) => `<div class="le ${e.kind}"><span class="t">T${e.turn}</span> ${escapeHtml(e.message)}</div>`)
      .join('');
    list.scrollTop = list.scrollHeight;
  }
}

// --- DOM helpers ------------------------------------------------------------
function div(cls) { const d = document.createElement('div'); d.className = cls; return d; }
function span(t, cls) { const s = document.createElement('span'); s.className = cls; s.textContent = t; return s; }
function button(cls, html) { const b = document.createElement('button'); b.className = cls; b.innerHTML = html; return b; }
function text(id, v) { const el = document.getElementById(id); if (el) el.textContent = v; }
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function vitalityColor(v) {
  const r = Math.round(200 - v * 140), g = Math.round(70 + v * 150), b = Math.round(60 + v * 40);
  return `rgb(${r},${g},${b})`;
}

  return { UI };
})();

// ===================== src/main.js =====================
const __m_main = (function () {
  const { CONFIG } = __m_config;
  const { createState, newRun } = __m_engine_state;
  const { performAction, devSpawnTrichoderma, ACTIONS } = __m_engine_actions;
  const { endTurn } = __m_engine_turn;
  const { Camera } = __m_render_camera;
  const { SubstrateRenderer } = __m_render_substrate;
  const { NetworkRenderer, drawFruitBodies } = __m_render_network;
  const { Lighting } = __m_render_lighting;
  const { UI } = __m_render_ui;
// =============================================================================
// main.js — wiring (A9).
//
// Connects input -> actions (mutating engine state) -> renderers (reading
// state). Keeps simulation and rendering strictly separated: this file is the
// only place they meet. The render loop draws the world (canvas) every frame;
// the DOM UI updates only when state changes.
// =============================================================================


const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const camera = new Camera();
const lighting = new Lighting(CONFIG);

let state, ui, substrateRenderer;
const networkRenderers = new Map();

let uiDirty = true;
let previewFruit = false;
let previewFruitPoints = [];
const mouse = { x: 0, y: 0, down: false, moved: false, startX: 0, startY: 0 };
const pointers = new Map();          // active pointers (touch/mouse) by id
let pinchDist = 0;                    // last two-finger spread, for pinch-zoom
let lastTapTime = 0, lastTapX = 0, lastTapY = 0; // double-tap-to-refit

// --- setup / restart --------------------------------------------------------
function start(seed) {
  state = createState(CONFIG, seed);
  buildRenderers();
  if (CONFIG.dev.enabled) window.__game = { get state() { return state; }, camera, performAction, endTurn };
  if (ui) ui.setState(state); else ui = new UI(state, handlers);
  ui.hideOverlay();
  ui.setSelectedAction(null);
  previewFruit = false;
  previewFruitPoints = [];
  resize();
  camera.fitBounds(expandedBounds(), 120);
  uiDirty = true;
}

function buildRenderers() {
  substrateRenderer = new SubstrateRenderer(state.substrate, CONFIG, state.seed);
  networkRenderers.clear();
  for (const net of state.networks) networkRenderers.set(net.id, new NetworkRenderer(net, CONFIG));
}

function rendererFor(net) {
  let r = networkRenderers.get(net.id);
  if (!r) { r = new NetworkRenderer(net, CONFIG); networkRenderers.set(net.id, r); }
  return r;
}

// A bounding box around the network, clamped to show some surrounding map.
function expandedBounds() {
  const b = state.active.bounds() || { minX: 0, minY: state.substrate.surfaceY, maxX: 600, maxY: 600 };
  return {
    minX: b.minX - 200, minY: state.substrate.surfaceY - 80,
    maxX: b.maxX + 200, maxY: b.maxY + 200,
  };
}

// --- input handlers (passed to UI) -----------------------------------------
const handlers = {
  onAction(name, ctx) {
    const a = ACTIONS[name];
    // Targeted actions: first click selects targeting mode; the canvas click
    // supplies coordinates.
    if ((a.target === 'point' || a.target === 'node') && (!ctx || ctx.x === undefined)) {
      ui.setSelectedAction(ui.selectedAction === name ? null : name);
      uiDirty = true;
      return;
    }
    const res = performAction(state, name, ctx || {});
    afterAction(name, res);
  },
  onEndTurn() {
    endTurn(state);
    substrateRenderer.markDirty();
    for (const net of state.networks) rendererFor(net).markStructureDirty();
    if (state.runOver) ui.showOverlay(state.runResult);
    uiDirty = true;
  },
  onRestart() {
    start((Date.now() & 0x7fffffff) || 1);
  },
  onCheat(type) {
    const net = state.active;
    if (type === 'energy') { net.energy += CONFIG.dev.cheatEnergy; state.log(`DEV: +${CONFIG.dev.cheatEnergy} Energy.`, 'dev'); }
    else if (type === 'spores') { state.spores += CONFIG.dev.cheatSpores; state.log(`DEV: +${CONFIG.dev.cheatSpores} Spores.`, 'dev'); }
    else if (type === 'trichoderma') {
      const n = net.nodes.length ? net.nodes[Math.floor(state.rng() * net.nodes.length)] : null;
      const x = n ? n.x + state.rng.range(-40, 40) : camera.x;
      const y = n ? n.y + state.rng.range(20, 80) : camera.y;
      devSpawnTrichoderma(state, x, y);
      substrateRenderer.markDirty();
    }
    uiDirty = true;
  },
  onSliderChange() { uiDirty = true; },
  onFruitPreview(on) {
    previewFruit = on;
    // Compute the candidate fruit points once, on hover-start (a UI event, not
    // the render loop), so the per-frame draw just reuses this cache.
    if (on && !state.runOver) previewFruitPoints = state.active.computeFruitPoints(state.substrate);
  },
};

function afterAction(name, res) {
  if (!res || !res.ok) { uiDirty = true; return; }
  if (name === 'grow' || name === 'amputate') rendererFor(state.active).markStructureDirty();
  if (name === 'addSubstrate' || name === 'digest') substrateRenderer.markDirty();
  if (name === 'fruit') { state.active.computeFruitPoints(state.substrate); if (state.runOver) ui.showOverlay(state.runResult); }
  uiDirty = true;
}

// --- canvas interaction -----------------------------------------------------
function onCanvasClick(worldX, worldY) {
  const sel = ui.selectedAction;
  if (!sel) return;
  const a = ACTIONS[sel];
  if (a.target === 'point' || a.target === 'node') {
    const res = performAction(state, sel, { x: worldX, y: worldY });
    afterAction(sel, res);
    if (state.movesLeft <= 0 || state.active.energy < 0) ui.setSelectedAction(null);
  }
}

function pointerSpread() {
  const p = [...pointers.values()];
  if (p.length < 2) return 0;
  return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
}
function pointerMid() {
  const p = [...pointers.values()];
  return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
}

function setupInput() {
  canvas.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.setPointerCapture(e.pointerId);
    if (pointers.size === 1) {
      mouse.down = true; mouse.moved = false;
      mouse.startX = e.clientX; mouse.startY = e.clientY;
      mouse.x = e.clientX; mouse.y = e.clientY;
    } else if (pointers.size === 2) {
      pinchDist = pointerSpread();
      mouse.moved = true; // a second finger cancels tap/pan
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size >= 2) {
      // Pinch to zoom about the midpoint of the two fingers.
      const d = pointerSpread();
      if (pinchDist > 0 && d > 0) {
        const rect = canvas.getBoundingClientRect();
        const mid = pointerMid();
        camera.zoomAt(mid.x - rect.left, mid.y - rect.top, d / pinchDist);
      }
      pinchDist = d;
      return;
    }
    const dx = e.clientX - mouse.x, dy = e.clientY - mouse.y;
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (mouse.down) {
      if (Math.abs(e.clientX - mouse.startX) + Math.abs(e.clientY - mouse.startY) > 4) mouse.moved = true;
      if (mouse.moved) camera.panByScreen(dx, dy);
    }
  });
  const endPointer = (e) => {
    const had = pointers.has(e.pointerId);
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchDist = 0;
    if (!had || pointers.size !== 0 || !mouse.down) return;
    mouse.down = false;
    if (mouse.moved) return;
    const rect = canvas.getBoundingClientRect();
    if (!ui.selectedAction) {
      // In navigation mode a double-tap reframes the network (mobile 'F').
      const now = Date.now();
      if (now - lastTapTime < 320 && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 30) {
        camera.fitBounds(expandedBounds(), 120);
        lastTapTime = 0;
        return;
      }
      lastTapTime = now; lastTapX = e.clientX; lastTapY = e.clientY;
      return;
    }
    const w = camera.screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    onCanvasClick(w.x, w.y);
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    camera.zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY < 0 ? 1.12 : 1 / 1.12);
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); handlers.onEndTurn(); }
    else if (e.code === 'Escape') { ui.setSelectedAction(null); uiDirty = true; }
    else if (e.code === 'KeyF') { camera.fitBounds(expandedBounds(), 120); }
  });

  window.addEventListener('resize', resize);
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  camera.setViewport(window.innerWidth, window.innerHeight);
}

// --- render loop ------------------------------------------------------------
function frame(time) {
  // background (outside the world bounds)
  ctx.fillStyle = '#05070d';
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  substrateRenderer.draw(ctx, camera, time);

  for (const net of state.networks) {
    rendererFor(net).draw(ctx, camera, time);
    if (net.fruited && net.fruitPoints.length) drawFruitBodies(ctx, camera, net.fruitPoints, time, false);
  }

  // Fruit preview (where would it fruit?) — uses the cache from hover-start.
  if (previewFruit && !state.runOver) {
    drawFruitBodies(ctx, camera, previewFruitPoints, time, true);
  }

  // Dynamic lighting: dim the earth, then add the colony's glow back in.
  lighting.compose(ctx, camera, state, networkRenderers, substrateRenderer, time);

  // Atmosphere drifts on top of the lighting so spores read as bright motes.
  substrateRenderer.drawAtmosphere(ctx, camera, time);

  drawTargetingCursor(time);

  if (uiDirty) { ui.update(); uiDirty = false; }
  requestAnimationFrame(frame);
}

function drawTargetingCursor(time) {
  const sel = ui && ui.selectedAction;
  if (!sel) return;
  const rect = canvas.getBoundingClientRect();
  const w = camera.screenToWorld(mouse.x - rect.left, mouse.y - rect.top);
  if (sel === 'addSubstrate') {
    const rad = CONFIG.actions.addSubstrate.radius * state.substrate.cellSize * camera.zoom;
    const s = camera.worldToScreen(w.x, w.y);
    ctx.save();
    ctx.strokeStyle = w.y > state.substrate.surfaceY ? 'rgba(120,220,140,0.8)' : 'rgba(220,120,120,0.8)';
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  } else if (sel === 'amputate') {
    const target = state.active.nodeNear(w.x, w.y, CONFIG.actions.amputate.pickRadius * 2);
    if (target) {
      // Highlight the subtree that would be cut.
      const toCut = collectSubtree(state.active, target.id);
      ctx.save();
      ctx.strokeStyle = 'rgba(255,90,90,0.9)';
      ctx.lineWidth = 2;
      for (const id of toCut) {
        const n = state.active.byId.get(id);
        if (!n || n.parentId == null) continue;
        const p = state.active.byId.get(n.parentId);
        if (!p) continue;
        const a = camera.worldToScreen(p.x, p.y), b = camera.worldToScreen(n.x, n.y);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      const ts = camera.worldToScreen(target.x, target.y);
      ctx.fillStyle = 'rgba(255,90,90,0.95)';
      ctx.beginPath(); ctx.arc(ts.x, ts.y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

function collectSubtree(net, nodeId) {
  const set = new Set(); const stack = [nodeId];
  while (stack.length) {
    const id = stack.pop();
    if (set.has(id)) continue;
    set.add(id);
    const n = net.byId.get(id);
    if (n) for (const c of n.children) stack.push(c);
  }
  return set;
}

// --- boot -------------------------------------------------------------------
setupInput();
start((Date.now() & 0x7fffffff) || 1);
requestAnimationFrame(frame);

  return {  };
})();
