name: Deploy game to GitHub Pages

# Builds the single-file bundle and publishes it to GitHub Pages on every push
# to a development branch. The first run auto-enables Pages (enablement: true),
# so there is nothing to toggle in repo settings.
#
# The site carries BOTH games: the 2D game at the root (built by build.mjs,
# exactly as before) and the 3D game copied verbatim to /mycelium3d/ (it is
# fully static — vendored three.js, no build step). A repo gets one Pages
# site, so whichever branch pushes deploys the whole thing.

on:
  push:
    branches:
      - claude/mycelium-phase-1-build-urvq5e
      - claude/mycelium-3d-procedural-a45o44
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build single-file bundle (dist/)
        run: node build.mjs

      - name: Add the 3D game at /mycelium3d/ (static, no build)
        run: |
          if [ -d mycelium3d ]; then
            mkdir -p dist/mycelium3d
            cp -r mycelium3d/index.html mycelium3d/src mycelium3d/vendor dist/mycelium3d/
            [ -d mycelium3d/assets ] && cp -r mycelium3d/assets dist/mycelium3d/
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
