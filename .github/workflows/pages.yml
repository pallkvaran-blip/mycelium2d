name: Deploy game to GitHub Pages

# Builds the single-file bundle and publishes it to GitHub Pages on every push
# to a development branch. The first run auto-enables Pages (enablement: true),
# so there is nothing to toggle in repo settings.
#
# The site carries BOTH games: the 2D game at the root and the 3D game copied
# verbatim to /mycelium3d/ (fully static — vendored three.js, no build step).
# A repo gets one Pages site, so whichever branch pushes deploys the whole
# thing. To make sure a 3D-branch deploy can NEVER regress the hosted 2D game,
# the root is always built from the LATEST tip of the 2D dev branch — not from
# whatever 2D snapshot the pushing branch happens to carry.

on:
  push:
    branches:
      - claude/mycelium-phase-1-build-urvq5e
      - claude/mycelium-3d-procedural-a45o44
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the 2D site root from the LATEST 2D dev branch
        run: |
          git fetch origin claude/mycelium-phase-1-build-urvq5e
          git worktree add /tmp/twod origin/claude/mycelium-phase-1-build-urvq5e
          (cd /tmp/twod && node build.mjs)
          rm -rf dist
          mv /tmp/twod/dist dist

      - name: Add the 3D game at /mycelium3d/ (static, no build)
        run: |
          if [ -d mycelium3d ]; then
            mkdir -p dist/mycelium3d
            cp -r mycelium3d/index.html mycelium3d/src mycelium3d/vendor dist/mycelium3d/
            [ -d mycelium3d/assets ] && cp -r mycelium3d/assets dist/mycelium3d/
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
