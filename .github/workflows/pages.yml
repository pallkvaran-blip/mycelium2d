name: Deploy game to GitHub Pages

# Builds the single-file bundle and publishes it to GitHub Pages on every push
# to the development branch. The first run auto-enables Pages (enablement: true),
# so there is nothing to toggle in repo settings.

on:
  push:
    branches:
      - claude/mycelium-phase-1-build-urvq5e
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-progress deploy (GitHub's recommended Pages setting):
# cancelling a run mid-deploy can leave the Pages backend in a state that makes
# the NEXT run fail with "Deployment failed, try again later." Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep1.outputs.page_url || steps.dep2.outputs.page_url || steps.dep3.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build single-file bundle (dist/)
        run: node build.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # The Pages deploy backend intermittently returns a hard "Deployment failed,
      # try again later." on the first attempt, and actions/deploy-pages does NOT
      # retry that. So we attempt up to 3 times with backoff — a transient failure
      # self-heals in the same run instead of needing a manual re-dispatch. Only the
      # LAST attempt is allowed to fail the job.
      - name: Deploy to GitHub Pages (try 1)
        id: dep1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait, then retry (try 2)
        if: steps.dep1.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (try 2)
        id: dep2
        if: steps.dep1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait, then retry (try 3)
        if: steps.dep1.outcome == 'failure' && steps.dep2.outcome == 'failure'
        run: sleep 40
      - name: Deploy to GitHub Pages (try 3)
        id: dep3
        if: steps.dep1.outcome == 'failure' && steps.dep2.outcome == 'failure'
        uses: actions/deploy-pages@v4
