<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🍄</text></svg>" />
  <title>Mycelium — 3D</title>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #04070a;
      --panel: rgba(14, 20, 30, 0.82);
      --panel-border: rgba(120, 160, 140, 0.18);
      --ink: #d7e6dc;
      --ink-dim: #8aa193;
      --accent: #7fe6a3;
      --accent-dim: #3a6f50;
      --warn: #e0a85a;
      --danger: #e06a6a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink);
      user-select: none; -webkit-user-select: none; }
    #game { position: fixed; inset: 0; display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }

    .panel { position: absolute; background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.4); }
    .title { font-weight: 600; font-size: 13px; letter-spacing: 0.04em; color: var(--ink);
      margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .title .sub { color: var(--accent); font-weight: 400; font-size: 11px; }
    .title.clickable { cursor: pointer; margin-bottom: 0; }
    .panel:not(.collapsed) .title.clickable { margin-bottom: 8px; }
    .title .chev { margin-left: auto; color: var(--ink-dim); font-size: 11px; }

    /* HUD */
    .hud { top: 14px; left: 14px; min-width: 220px; }
    .hud .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
    .stat { display: flex; justify-content: space-between; align-items: baseline; }
    .stat .k { color: var(--ink-dim); font-size: 11px; }
    .stat .v { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 16px; }
    .vitality { margin-top: 10px; }
    .vitality .k { color: var(--ink-dim); font-size: 11px; }
    .vitality .bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 5px; overflow: hidden; margin-top: 3px; }
    .vitality .fill { height: 100%; width: 100%; transition: width 0.4s ease, background 0.4s; }

    /* Help */
    .helppanel { top: 14px; left: 50%; transform: translateX(-50%); width: 430px; max-width: 90vw; }
    .helppanel.collapsed .help-body { display: none; }
    .help-body .li { font-size: 11.5px; color: var(--ink-dim); padding: 2px 0; }
    .help-body .li b { color: var(--ink); }
    .help-body .li.note { margin-top: 6px; font-style: italic; color: #5e7468; }

    /* Action bar */
    .actionbar { position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; justify-content: center; max-width: 96vw; }
    .btn { font-family: inherit; color: var(--ink); background: rgba(40,54,48,0.82);
      border: 1px solid var(--panel-border); border-radius: 8px; padding: 8px 12px; cursor: pointer;
      font-size: 13px; transition: background 0.15s, border 0.15s, transform 0.05s; white-space: nowrap; }
    .btn:hover:not(:disabled) { background: rgba(60,84,72,0.95); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .btn.selected { border-color: var(--accent); background: rgba(127,230,163,0.18);
      box-shadow: 0 0 0 1px var(--accent) inset; }
    .btn .cost { color: var(--accent); font-size: 11px; margin-left: 4px; }
    .btn .key { display: inline-block; min-width: 14px; margin-right: 6px; padding: 0 3px;
      border: 1px solid rgba(255,255,255,0.22); border-radius: 4px; font-size: 10px;
      color: var(--ink-dim); text-align: center; }
    .btn.restart { background: rgba(70,60,90,0.7); }

    .hint { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      font-size: 12px; color: var(--ink-dim); background: rgba(10,14,22,0.75); padding: 5px 12px;
      border-radius: 14px; max-width: 82vw; text-align: center; display: none; }

    /* Log */
    .logpanel { top: 14px; right: 14px; width: 290px; max-height: 36vh; display: flex; flex-direction: column; }
    .logpanel.collapsed .loglist { display: none; }
    .loglist { overflow-y: auto; font-size: 11.5px; line-height: 1.5; margin-top: 8px; }
    .le { padding: 1px 0; color: var(--ink-dim); }
    .le .t { color: #51695c; margin-right: 5px; font-variant-numeric: tabular-nums; }
    .le.action { color: var(--ink); }
    .le.good { color: var(--accent); }
    .le.warn { color: var(--warn); }
    .le.dev { color: #c07fe6; }

    /* Crosshair + targeting */
    .crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      font-size: 20px; color: rgba(215,230,220,0.85); text-shadow: 0 0 6px rgba(127,230,163,0.6);
      pointer-events: none !important; opacity: 0.25; }
    .cursor-dist { position: absolute; left: 50%; top: calc(50% + 22px); transform: translateX(-50%);
      font-size: 11px; color: var(--accent); background: rgba(10,14,22,0.6); padding: 1px 8px;
      border-radius: 10px; pointer-events: none !important; display: none; font-variant-numeric: tabular-nums; }
    .goal-arrow { position: absolute; display: none; flex-direction: column; align-items: center;
      color: #96e696; font-size: 22px; text-shadow: 0 0 8px rgba(150,230,150,0.8);
      pointer-events: none !important; line-height: 0.9; }
    .goal-arrow span { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }

    /* Click-to-fly prompt */
    .lockprompt { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 210px; pointer-events: none !important; }
    .lp-card { background: rgba(10,16,24,0.72); border: 1px solid var(--panel-border); border-radius: 12px;
      padding: 12px 22px; text-align: center; font-size: 13px; color: var(--ink-dim); line-height: 1.7; }
    .lp-card b { color: var(--accent); font-size: 15px; }

    /* Overlay */
    .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(3,5,10,0.78); backdrop-filter: blur(3px); }
    .overlay.hidden { display: none; }
    .overlay .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px;
      padding: 32px 40px; text-align: center; max-width: 460px; }
    .overlay h1 { font-size: 22px; margin: 0 0 12px; color: var(--accent); font-weight: 600; }
    .overlay p { color: var(--ink); font-size: 14px; line-height: 1.5; margin: 8px 0; }
    .overlay p.dim { color: var(--ink-dim); }
    .overlay p.small { font-size: 12px; }
    .overlay .btn.big { margin-top: 18px; font-size: 15px; padding: 12px 22px; background: rgba(127,230,163,0.16);
      border-color: var(--accent); }

    /* Dev panel */
    .dev { bottom: 14px; right: 14px; width: 240px; }
    .dev.collapsed .dev-body { display: none; }
    .cheats { display: flex; flex-wrap: wrap; gap: 6px; }
    .dev-btn { font-size: 11px; padding: 5px 8px; background: rgba(90,60,90,0.7); }

    @media (max-width: 1100px) {
      .helppanel { display: none; }
    }
    @media (max-width: 760px) {
      .logpanel { width: 170px; max-height: 24vh; }
      .actionbar { gap: 5px; }
      .actionbar .btn { padding: 6px 8px; font-size: 11.5px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
